<style>

enter;justify-content:space-between;gap:16px}.appbar h1{font:600 23px Georgia,serif;margin:0}.appbar small{display:block;color:#dce8f1;margin-top:3px}.status-pill{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.16);font-size:13px;font-weight:700;white-space:nowrap}.content{padding:24px;max-width:900px;margin:auto}.content h2{font:600 26px Georgia,serif;color:var(--navy);margin:0 0 6px}.lead{margin:0 0 20px;color:var(--mut)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:0 0 14px;box-shadow:0 8px 22px rgba(40,66,92,.05)}.card h3{font-size:16px;margin:0 0 12px;color:var(--navy)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:13px;font-weight:700;color:var(--navy);margin:0 0 6px}.input{min-height:44px;border:1px solid #cbd9e4;border-radius:11px;padding:11px 12px;background:#fbfdfe}.file{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid #edf1f4}.file:first-of-type{border-top:0}.file-icon{width:40px;height:40px;border-radius:11px;background:var(--soft);display:grid;place-items:center;color:var(--accent);font-weight:800;font-size:12px}.file b,.file small{display:block}.file small{color:var(--mut);font-size:13px}.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.ok{background:var(--green-bg);color:var(--green)}.warn{background:var(--amber-bg);color:var(--amber)}.bad{background:var(--red-bg);color:var(--red)}.neutral{background:#eef3f7;color:var(--mut)}.check{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:start;padding:11px 0;border-top:1px solid #edf1f4}.check:first-child{border-top:0}.dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:white;font-size:12px;font-weight:bold}.dot.wait{background:var(--amber)}.timeline{position:relative;padding-left:15px}.event{display:grid;grid-template-columns:18px 1fr;gap:12px;padding:0 0 20px;position:relative}.event:before{content:"";position:absolute;left:8px;top:18px;bottom:0;border-left:2px solid var(--line)}.event:last-child:before{display:none}.event i{width:18px;height:18px;border-radius:50%;background:#c8d6e1;border:4px solid #eef4f8;z-index:1}.event.done i{background:var(--green)}.event.now i{background:var(--blue);box-shadow:0 0 0 4px #dceaf4}.event b,.event span{display:block}.event span{font-size:13px;color:var(--mut);margin-top:2px}.tabs{display:flex;gap:4px;overflow:auto;border-bottom:1px solid var(--line);padding:0 24px;background:#fff}.tabs button{border:0;border-bottom:3px solid transparent;background:transparent;padding:14px 10px;color:var(--mut);white-space:nowrap;font-size:13px;font-weight:700}.tabs button.on{color:var(--accent);border-color:var(--accent)}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#f6f9fb;border-radius:14px;padding:13px}.metric b{font:600 22px Georgia,serif;color:var(--navy);display:block}.metric span{font-size:12px;color:var(--mut)}table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--mut);font-size:12px;padding:9px;border-bottom:1px solid var(--line)}td{padding:12px 9px;border-bottom:1px solid #edf1f4;vertical-align:top}.source{font-size:12px;color:var(--mut);margin-top:3px}.problem{border-left:4px solid var(--red);background:var(--red-bg);padding:13px 14px;border-radius:10px;margin:10px 0}.question{border-left:4px solid var(--amber);background:var(--amber-bg);padding:13px 14px;border-radius:10px;margin:10px 0}.btns{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:11px 15px;background:var(--accent);color:#fff;font-weight:800}.btn.secondary{background:#edf3f7;color:var(--navy)}.btn.danger{background:var(--red)}.btn:disabled{background:#d9e1e7;color:#8394a2;cursor:not-allowed}.footer-nav{border-top:1px solid var(--line);background:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px}.counter{font-size:13px;color:var(--mut)}.mini-nav{display:flex;gap:8px}.flow-note{font-size:13px;padding:9px 12px;border-radius:10px;background:#f4f7fa;color:var(--mut);margin-top:12px}.empty{padding:28px;text-align:center;background:#f7fafc;border:1px dashed #c9d7e2;border-radius:14px;color:var(--mut)}

@media(max-width:560px){.brand b{font-size:21px}.notice{font-size:13px}.mode{width:100%}.mode button{flex:1;padding:10px 7px;font-size:13px}.rail{padding:14px;border-radius:18px}.screen{border-radius:20px}.appbar{padding:17px}.appbar h1{font-size:20px}.status-pill{display:none}.content{padding:17px}.content h2{font-size:23px}.grid2{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.tabs{padding:0 10px}.file{grid-template-columns:38px 1fr}.file .tag{grid-column:2}.check{grid-template-columns:22px 1fr}.check>.tag{grid-column:2}.footer-nav{padding:12px}.counter{display:none}table{font-size:13px}.wide-table{overflow:auto}.wide-table table{min-width:680px}}

<body>
<main class="shell">
  <header class="top">
    <div class="brand"><b>Путь заявки и контроль качества</b><span>Интерактивный макет будущих экранов</span></div>
    <div class="notice">Макет · данные не загружаются и не сохраняются</div>
    <div class="mode" role="tablist" aria-label="Роль пользователя">
      <button type="button" class="on" data-mode="student">Кабинет студента</button>
      <button type="button" data-mode="executor">Реестр исполнителя</button>
    </div>
  </header>
  <div class="workspace">
    <aside class="rail">
      <h2 id="rail-title"></h2>
      <p id="rail-text"></p>
      <nav class="steps" id="steps" aria-label="Этапы сценария"></nav>
    </aside>
    <section class="screen" aria-live="polite">
      <header class="appbar"><div><h1 id="app-title"></h1><small id="app-sub"></small></div><span class="status-pill" id="top-status"></span></header>
      <div class="tabs" id="tabs"></div>
      <div class="content" id="view"></div>
      <footer class="footer-nav"><button class="btn secondary" id="prev">Назад</button><span class="counter" id="counter"></span><div class="mini-nav"><button class="btn" id="next">Далее</button></div></footer>
    </section>
  </div>
</main>

const state={mode:'student',index:0};
const cfg={student:{title:'Кабинет студента',text:'Что делает и видит студент',sub:'Работы · заявка №42'},executor:{title:'Реестр заявок',text:'Рабочие экраны исполнителя',sub:'Контроль требований и результата'}};
function render(){const list=state.mode==='student'?student:executor,item=list[state.index],c=cfg[state.mode];document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===state.mode));document.getElementById('rail-title').textContent=c.title;document.getElementById('rail-text').textContent=c.text;document.getElementById('app-title').textContent=c.title;document.getElementById('app-sub').textContent=c.sub;document.getElementById('top-status').textContent=item.status;document.getElementById('steps').innerHTML=list.map((x,i)=>`<button type="button" class="step ${i===state.index?'on':''}" data-step="${i}"><i>${i+1}</i><b>${x.name}</b></button>`).join('');document.getElementById('tabs').innerHTML=item.tabs.map((x,i)=>`<button type="button" class="${i===Math.min(state.index,item.tabs.length-1)?'on':''}">${x}</button>`).join('');document.getElementById('view').innerHTML=item.html;document.getElementById('counter').textContent=`Экран ${state.index+1} из ${list.length}`;document.getElementById('prev').disabled=state.index===0;document.getElementById('next').textContent=state.index===list.length-1?'Сначала': 'Далее';document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{state.index=Number(b.dataset.step);render();});window.scrollTo({top:0,behavior:'smooth'});}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;state.index=0;render();});document.getElementById('prev').onclick=()=>{if(state.index>0){state.index--;render();}};document.getElementById('next').onclick=()=>{const list=state.mode==='student'?student:executor;state.index=state.index===list.length-1?0:state.index+1;render();};render();
</script>
