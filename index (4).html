<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4E7A9E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Кабинет">
<title>Кабинет студента</title>
<link rel="manifest" href="manifest-kabinet.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/kabinet-32.png">
<link rel="apple-touch-icon" href="icons/kabinet-180.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="oblako-config.js"></script>
<script src="oblako.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#22303F; --mut:#6B7F92; --line:#DCE6EE; --ok:#4B7F62; --stop:#A85147;
  --ground:#F4F7FA; --card:rgba(255,255,255,.92);
  --navy:#28425C; --head:#4E7A9E; --accent:#2F6091; --warm:#B08347;
  --body-bg:radial-gradient(circle at 10% 8%,rgba(120,160,200,.20),transparent 30%),radial-gradient(circle at 88% 24%,rgba(176,131,71,.14),transparent 30%),linear-gradient(145deg,#F7FAFD 0%,#F1F5F9 52%,#F8F6F2 100%);
  --phone-bg:linear-gradient(180deg,#F5F8FB 0%,#F9FBFD 48%,#F4F7FA 100%);
  --appbar:radial-gradient(circle at 86% -40%,rgba(255,255,255,.30),transparent 42%),linear-gradient(120deg,#2E5A85 0%,#4E7A9E 55%,#6F98BB 100%);
  --appbar-sh:rgba(40,66,92,.22);
  --greet:linear-gradient(125deg,#2E5A85 0%,#4E7A9E 52%,#7FA6C6 100%);
  --greet-morning:linear-gradient(125deg,#B9784A 0%,#D3A06E 50%,#E6C48F 100%);
  --greet-day:linear-gradient(125deg,#2E5A85 0%,#4E7A9E 52%,#7FA6C6 100%);
  --greet-evening:linear-gradient(125deg,#33465F 0%,#4E6483 50%,#7A8AA3 100%);
  --greet-night:linear-gradient(130deg,#1B2637 0%,#2C3D58 55%,#465A78 100%);
  --greet-sh:rgba(40,66,92,.24);
  --card-border:rgba(200,214,226,.9); --card-sh:rgba(40,66,92,.07);
  --lab:#6B7F92; --ic-bg:linear-gradient(145deg,#E8F0F7,#F3F7FA); --ic-fg:#2F6091; --ic-ring:rgba(190,208,224,.7);
  --bar:linear-gradient(90deg,#2F6091,#6F98BB); --bar-bg:#E4ECF3;
  --chip-bg:linear-gradient(110deg,#E8F0F7,#EEF4F9); --chip-fg:#2F6091;
  --btn:linear-gradient(110deg,#2F6091,#4E7A9E); --btn-sh:rgba(47,96,145,.22);
  --fab:linear-gradient(115deg,#B08347,#D2A46A); --fab-sh:rgba(176,131,71,.36);
  --tab-on:#2F6091; --tab-bg:rgba(255,255,255,.94); --tab-line:#DCE6EE;
  --sheet-bg:rgba(34,48,63,.45); --toast:linear-gradient(110deg,#28425C,#3D5E80);
  --days-bg:#E8F0F7; --days-fg:#2F6091; --spine:linear-gradient(#C8D6E2,#E4ECF3); --dot-on:#4E7A9E;
  --cal-today:linear-gradient(145deg,#2F6091,#6F98BB);
  --warm-bg:#F6EEE1; --warm-fg:#8F6A3A; --hot-bg:#F6E7E4; --hot-fg:#A85147;
}
body[data-theme="green"]{
  --navy:#2A4A42; --head:#3F7A6A; --accent:#2F6B5E; --warm:#C48A3F;
  --body-bg:radial-gradient(circle at 10% 8%,rgba(110,170,150,.22),transparent 30%),radial-gradient(circle at 88% 24%,rgba(196,138,63,.14),transparent 30%),linear-gradient(145deg,#F6FAF8 0%,#F0F5F3 52%,#F9F7F2 100%);
  --phone-bg:linear-gradient(180deg,#F4F9F7 0%,#F9FCFA 48%,#F3F7F5 100%);
  --appbar:radial-gradient(circle at 86% -40%,rgba(255,255,255,.30),transparent 42%),linear-gradient(120deg,#25594C 0%,#3F7A6A 55%,#6AA08F 100%);
  --appbar-sh:rgba(42,74,66,.22);
  --greet:linear-gradient(125deg,#25594C 0%,#3F7A6A 52%,#7DB3A2 100%);
  --greet-morning:linear-gradient(125deg,#B57A3E 0%,#D3A360 50%,#E8C98B 100%);
  --greet-day:linear-gradient(125deg,#25594C 0%,#3F7A6A 52%,#7DB3A2 100%);
  --greet-evening:linear-gradient(125deg,#2F4D47 0%,#4C6D66 50%,#7A948E 100%);
  --greet-night:linear-gradient(130deg,#182A26 0%,#264038 55%,#3F5C52 100%);
  --greet-sh:rgba(42,74,66,.24);
  --card-border:rgba(200,222,214,.9); --card-sh:rgba(42,74,66,.07);
  --lab:#6B8A80; --ic-bg:linear-gradient(145deg,#E6F2ED,#F2F8F5); --ic-fg:#2F6B5E; --ic-ring:rgba(190,220,208,.7);
  --bar:linear-gradient(90deg,#2F6B5E,#6AA08F); --bar-bg:#E2EEE9;
  --chip-bg:linear-gradient(110deg,#E6F2ED,#EEF6F2); --chip-fg:#2F6B5E;
  --btn:linear-gradient(110deg,#2F6B5E,#3F7A6A); --btn-sh:rgba(47,107,94,.22);
  --fab:linear-gradient(115deg,#C48A3F,#DFAE6A); --fab-sh:rgba(196,138,63,.36);
  --tab-on:#2F6B5E; --tab-line:#D8E6E0; --sheet-bg:rgba(30,50,44,.45); --toast:linear-gradient(110deg,#2A4A42,#3F6B5E);
  --days-bg:#E6F2ED; --days-fg:#2F6B5E; --spine:linear-gradient(#C6DCD3,#E2EEE9); --dot-on:#3F7A6A;
  --cal-today:linear-gradient(145deg,#2F6B5E,#6AA08F);
}
body[data-theme="lilac"]{
  --ink:#352D42; --mut:#7A6D86; --line:#E9DDEC; --navy:#503B68; --head:#8164B5; --accent:#7652A8; --warm:#D47794; --stop:#B34D67;
  --ground:#FBF7FC;
  --body-bg:radial-gradient(circle at 10% 8%,rgba(236,183,211,.28),transparent 29%),radial-gradient(circle at 88% 24%,rgba(180,151,222,.25),transparent 31%),linear-gradient(145deg,#fffafd 0%,#f7f4ff 52%,#fff7f2 100%);
  --phone-bg:linear-gradient(180deg,#F9F4FD 0%,#FFF9FC 48%,#F8F5FF 100%);
  --appbar:radial-gradient(circle at 86% -40%,rgba(255,255,255,.36),transparent 42%),linear-gradient(120deg,#7052A5 0%,#A66EB0 53%,#D77F9D 100%);
  --appbar-sh:rgba(92,62,126,.18);
  --greet:linear-gradient(125deg,#6E50A2 0%,#A965AD 52%,#DC839E 100%);
  --greet-morning:linear-gradient(125deg,#D7839E 0%,#EDAA9D 53%,#F2C38F 100%);
  --greet-day:linear-gradient(125deg,#7A62B5 0%,#A978C3 50%,#E58FAE 100%);
  --greet-evening:linear-gradient(125deg,#68488D 0%,#9B5E9F 50%,#CE718F 100%);
  --greet-night:linear-gradient(130deg,#302A5A 0%,#533C78 55%,#765083 100%);
  --greet-sh:rgba(99,63,132,.22);
  --card-border:rgba(219,202,227,.82); --card-sh:rgba(81,55,105,.075);
  --lab:#886E96; --ic-bg:linear-gradient(145deg,#F4E9FA,#FFEFF3); --ic-fg:#704E9A; --ic-ring:rgba(211,187,225,.55);
  --bar:linear-gradient(90deg,#7652A8,#E18DAA); --bar-bg:#EEE4F2;
  --chip-bg:linear-gradient(110deg,#F0E6F8,#FCEAF2); --chip-fg:#704E9A;
  --btn:linear-gradient(110deg,#7452AA,#A565B1); --btn-sh:rgba(103,70,145,.2);
  --fab:linear-gradient(115deg,#D16991,#E99A9D); --fab-sh:rgba(190,91,126,.34);
  --tab-on:#7652A8; --tab-bg:rgba(255,251,254,.93); --tab-line:#E8DCEB;
  --sheet-bg:rgba(48,34,60,.48); --toast:linear-gradient(110deg,#513A68,#74518B);
  --days-bg:#F0E6F8; --days-fg:#704E9A; --spine:linear-gradient(#D5C2E0,#EFD4DD); --dot-on:#9A72BE;
  --cal-today:linear-gradient(145deg,#7252A4,#C578A1);
  --warm-bg:#FFF0E6; --warm-fg:#A8663A; --hot-bg:#FFE9EE; --hot-fg:#B34D67;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden}
html,body{max-width:100%}
body{margin:0;color:var(--ink);font-family:'Golos Text',system-ui,-apple-system,sans-serif;line-height:1.45;overflow-x:hidden;width:100%;background:var(--body-bg)}
button,input,select,textarea{font:inherit;color:inherit}
.num,.big,.stat b,.tl-time{font-family:'IBM Plex Mono',monospace}

.phone{width:100%;max-width:520px;min-height:100vh;margin:0 auto;position:relative;display:flex;flex-direction:column;background:var(--phone-bg)}
@media (min-width:600px){.phone{margin:22px auto;min-height:calc(100vh - 44px);border:1px solid var(--card-border);border-radius:34px;box-shadow:0 28px 70px var(--greet-sh);overflow:hidden}}

.appbar{position:sticky;top:0;z-index:5;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 18px 16px;display:flex;align-items:flex-end;justify-content:space-between;background:var(--appbar);box-shadow:0 10px 30px var(--appbar-sh)}
.appbar:after{content:'✦';position:absolute;right:21%;top:14px;color:rgba(255,255,255,.5);font-size:11px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:28px;height:28px;flex:0 0 28px;display:block;filter:drop-shadow(0 3px 7px rgba(0,0,0,.2))}
.appbar h2{font-family:'Spectral',serif;font-size:20px;margin:0;font-weight:600;letter-spacing:.01em}
.appbar .sub,.appbar .saved{font-size:11px;color:rgba(255,255,255,.84);margin-top:2px}
.appbar .saved{font-size:10px;text-align:right}

.screen{flex:1;padding:18px 16px 150px;overflow-x:hidden}

.greeting{position:relative;overflow:hidden;margin:0 0 14px;padding:18px 18px 17px;border-radius:22px;color:#fff;background:var(--greet);box-shadow:0 14px 32px var(--greet-sh)}
.greeting:before{content:'✦';position:absolute;right:19px;top:12px;font-size:28px;color:rgba(255,255,255,.2);transform:rotate(12deg)}
.greeting:after{content:'✧';position:absolute;right:58px;bottom:12px;font-size:17px;color:rgba(255,255,255,.26)}
.greeting .hello{font-family:'Spectral',Georgia,serif;font-size:23px;font-weight:600;line-height:1.2;padding-right:48px}
.greeting .moment{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:12px;color:rgba(255,255,255,.84)}
.greeting .moment i{display:block;width:6px;height:6px;border-radius:50%;background:#FFE3C2;box-shadow:0 0 0 4px rgba(255,227,194,.15)}
.greeting.morning{background:var(--greet-morning)}
.greeting.morning:before{content:'☀';color:rgba(255,248,210,.34)}
.greeting.day{background:var(--greet-day)}
.greeting.evening{background:var(--greet-evening)}
.greeting.evening:before{content:'◐';color:rgba(255,224,210,.3)}
.greeting.night{background:var(--greet-night)}
.greeting.night:before{content:'☾';color:rgba(236,219,255,.32)}
.greeting.night:after{content:'✦  ·  ✧';letter-spacing:7px;color:rgba(255,255,255,.35)}

.card{background:var(--card);border:1px solid var(--card-border);border-radius:20px;padding:14px;margin-bottom:12px;max-width:100%;box-shadow:0 10px 26px var(--card-sh),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(10px)}
.card.now{border-color:var(--head);box-shadow:0 12px 30px var(--card-sh),0 0 0 3px var(--days-bg)}
.lab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--lab);font-weight:600;margin-bottom:8px}
.mut{color:var(--mut);font-size:12px;overflow-wrap:anywhere}
.title{font-family:'Spectral',serif;font-size:18px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.big{font-size:27px;font-weight:500;letter-spacing:-.02em}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.days{flex:0 0 auto;text-align:center;min-width:58px;padding:6px 8px;border-radius:14px;background:var(--days-bg);color:var(--days-fg)}
.days b{display:block;font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:500;line-height:1}
.days span{font-size:10px;letter-spacing:.06em}
.days.warm{background:var(--warm-bg);color:var(--warm-fg)}
.days.hot{background:var(--hot-bg);color:var(--hot-fg)}
.days.late{background:var(--stop);color:#fff}

.dayline{position:relative;padding-left:22px}
.spine{position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--spine)}
.tl{position:relative;padding:0 0 14px}
.tl:last-child{padding-bottom:2px}
.tl-dot{position:absolute;left:-21px;top:4px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.tl.next .tl-dot{background:var(--dot-on);border-color:var(--dot-on);box-shadow:0 0 0 4px var(--days-bg)}
.tl.late .tl-dot{background:var(--stop);border-color:var(--stop)}
.tl-time{font-size:11px;color:var(--mut)}
.tl-what{font-size:14px;font-weight:500;overflow-wrap:anywhere}
.tl-sub{font-size:11px;color:var(--mut)}
.stat.tapline{border-radius:8px;margin:0 -6px;padding-left:6px;padding-right:6px;cursor:pointer}
.stat.tapline:active{background:var(--ground)}

.stat{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.stat:last-child{border:0;padding-bottom:0}
.stat b{font-weight:500;text-align:right;overflow-wrap:anywhere}
.item{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);max-width:100%}
.item:last-child{border-bottom:0}
.item.tapline{cursor:pointer}
.item.tapline:active{background:var(--ground)}
.ic{width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;color:var(--ic-fg);background:var(--ic-bg);box-shadow:inset 0 0 0 1px var(--ic-ring)}
.item .txt{flex:1;min-width:0}
.item .txt b{display:block;font-weight:500;font-size:14px;overflow-wrap:anywhere}
.item .txt small{color:var(--mut);font-size:11px;overflow-wrap:anywhere}
.bar{height:7px;border-radius:99px;background:var(--bar-bg);overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--bar)}

.pill{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:99px;white-space:nowrap;flex:0 0 auto}
.p-gray{background:var(--bar-bg);color:var(--mut)}
.p-och{background:var(--warm-bg);color:var(--warm-fg)}
.p-warn{background:var(--hot-bg);color:var(--hot-fg)}
.p-ok{background:#E7F1EA;color:#4B7F62}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:8px 13px;border:none;border-radius:99px;background:var(--chip-bg);font-size:12.5px;color:var(--chip-fg);font-weight:600;cursor:pointer}
.chip:active{filter:brightness(.96)}
.chip.ok{background:#E7F1EA;color:#4B7F62}
.chip.warn{background:var(--warm-bg);color:var(--warm-fg)}
.switch{display:flex;background:var(--bar-bg);border-radius:12px;padding:3px;margin-bottom:12px}
.switch button{flex:1;border:0;background:transparent;padding:9px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500;color:var(--mut)}
.switch button[aria-selected="true"]{background:#fff;color:var(--accent);box-shadow:0 4px 12px var(--card-sh)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:rgba(255,255,255,.8);border-radius:99px;padding:7px 12px;cursor:pointer;font-size:13px;color:var(--ink)}
.pick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font-family:'Spectral',serif;font-size:17px;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dw{text-align:center;font-size:10px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;padding:2px 0 4px}
.cal .d{aspect-ratio:1;border:1px solid var(--line);border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;cursor:pointer;background:rgba(255,255,255,.7);position:relative}
.cal .d.out{visibility:hidden}
.cal .d.today{background:var(--cal-today);border-color:transparent;color:#fff;font-weight:600}
.cal .d.sel{outline:2px solid var(--accent);outline-offset:-2px}
.cal .d .dots{display:flex;gap:2px;height:5px}
.cal .d .dots i{width:5px;height:5px;border-radius:50%;background:var(--dot-on)}
.cal .d .dots i.tk{background:var(--warm)}
.cal .d .dots i.late{background:var(--stop)}
.cal .d .dots i.ev{background:var(--navy)}
.cal-legend i.ev{background:var(--navy)}
.cal .d.today .dots i{background:#fff}
.cal-legend{display:flex;gap:12px;font-size:11px;color:var(--mut);margin-top:10px}
.cal-legend i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--dot-on);margin-right:4px;vertical-align:middle}
.cal-legend i.tk{background:var(--warm)}
.cal-legend i.late{background:var(--stop)}
.dategroup{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--lab);font-weight:600;margin:12px 0 4px}
.dategroup:first-child{margin-top:0}

.btn,button.b{display:block;width:100%;border:0;border-radius:14px;padding:12px;font-size:14px;font-weight:500;cursor:pointer;color:#fff;background:var(--btn);box-shadow:0 8px 18px var(--btn-sh);transition:transform .18s ease}
.btn:active,button.b:active{transform:scale(.985)}
.btn.ghost,.b-alt,.b-quiet{background:rgba(255,255,255,.75);border:1px solid var(--line);color:var(--accent);box-shadow:none}
.b-quiet{color:var(--mut)}
button.b{width:auto;display:inline-block;padding:11px 16px}
.b-sm{padding:8px 12px;font-size:13px}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.rowbtns button.b{flex:1 1 auto}
.mini{border:1px solid var(--line);background:#fff;color:var(--accent);border-radius:8px;padding:5px 9px;font-size:11px;cursor:pointer;white-space:nowrap}
.del{border:0;background:transparent;color:var(--stop);font-size:12px;cursor:pointer;flex:0 0 auto}
.tick{width:26px;height:26px;flex:0 0 26px;border:1.5px solid var(--line);background:#fff;border-radius:50%;cursor:pointer;color:#fff;font-size:14px;line-height:1;padding:0}
.tick.on{background:var(--ok);border-color:var(--ok)}
.empty{color:var(--mut);font-size:13px;padding:8px 0}

.fld,.field{margin-bottom:10px}
.fld label,.field label{display:block;font-size:11px;color:var(--mut);margin-bottom:4px;font-weight:500}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;font-size:16px;background:rgba(255,255,255,.9);color:var(--ink)}
textarea{resize:vertical;min-height:120px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:3px solid var(--days-bg);border-color:var(--head)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.fgrid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 8px}
@media (max-width:420px){.fgrid4{grid-template-columns:repeat(2,1fr)}}
.hint,.small{display:block;font-size:11px;color:var(--mut);margin-top:6px;line-height:1.35}
.infobox{background:var(--days-bg);border:1px solid var(--line);color:var(--accent);border-radius:12px;padding:9px 12px;font-size:12px;margin:10px 0}
.warnbar,.warnbox{background:var(--hot-bg);border:1px solid #E4C3BD;color:var(--stop);border-radius:12px;padding:9px 12px;font-size:12.5px;margin-bottom:12px}
.warnbar ul{margin:6px 0 0;padding-left:18px}
.warnbar li{margin-bottom:3px}
.okbar,.okbox{background:#E7F1EA;border:1px solid #C9DED0;color:#4B7F62;border-radius:12px;padding:9px 12px;font-size:12.5px}

.fab{position:fixed;right:max(16px,calc(50% - 230px));bottom:calc(80px + env(safe-area-inset-bottom));min-height:56px;padding:0 18px;border:0;border-radius:99px;background:var(--fab);color:#fff;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 10px 26px var(--fab-sh);z-index:5}
.fab i{font-style:normal;font-size:19px;line-height:1}
.fab:active{transform:scale(.95)}
.fab[hidden]{display:none}

.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;height:calc(66px + env(safe-area-inset-bottom));padding:0 4px env(safe-area-inset-bottom);display:flex;align-items:center;z-index:6;background:var(--tab-bg,rgba(255,255,255,.94));border-top:1px solid var(--tab-line);box-shadow:0 -10px 28px var(--card-sh);backdrop-filter:blur(18px)}
@media (min-width:600px){.tabs{bottom:22px;border-radius:0 0 33px 33px}}
.tabs button{flex:1;border:0;background:transparent;cursor:pointer;padding:5px 0;font-size:10.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button i{font-style:normal;font-size:18px;opacity:.5}
.tabs button[aria-selected="true"]{color:var(--tab-on);font-weight:600;transform:translateY(-1px)}
.tabs button[aria-selected="true"] i{opacity:1}

.sheet{position:fixed;inset:0;background:var(--sheet-bg);backdrop-filter:blur(4px);display:flex;align-items:flex-end;z-index:20}
.sheet-in{background:#fff;width:100%;max-width:520px;margin:0 auto;border-radius:26px 26px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;box-shadow:0 -18px 50px var(--greet-sh);animation:up .26s ease}
.sheet-in:before{content:'';display:block;width:42px;height:4px;border-radius:99px;background:var(--line);margin:-7px auto 14px}
@keyframes up{from{transform:translateY(50px);opacity:0}to{transform:none;opacity:1}}
.sheet h2,.sheet h3{font-family:'Spectral',serif;font-size:17px;margin:0 0 4px;font-weight:600}
.sheet .close{float:right;background:none;border:0;font-size:18px;color:var(--mut);cursor:pointer;padding:0 4px;margin-top:-4px}
.sheet .small,.sheet .mut{font-size:12px}

.fold{border:1px solid var(--card-border);border-radius:16px;background:var(--card);margin-bottom:12px;padding:0 14px}
.fold summary{list-style:none;cursor:pointer;padding:13px 0;font-size:13px;font-weight:600;color:var(--ink);display:flex;justify-content:space-between;align-items:center}
.fold summary::-webkit-details-marker{display:none}
.fold summary:after{content:'›';color:var(--mut);font-size:18px;transform:rotate(90deg);transition:transform .2s}
.fold[open] summary:after{transform:rotate(-90deg)}
.fold[open] summary{border-bottom:1px solid var(--line)}
.fold .in{padding:10px 0 14px}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(8px);bottom:150px;z-index:60;width:min(480px,92%);background:var(--toast);color:#fff;border-radius:12px;padding:11px 14px;font-size:13px;box-shadow:0 12px 28px var(--greet-sh);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}

<script>

"use strict";

/* работа без сети и установка как приложение */
if ("serviceWorker" in navigator && location.protocol === "https:"){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}

/* ==================================================================
   СТУДЕНЧЕСКИЙ КАБИНЕТ
   Данные хранятся только в памяти этого устройства.
   ================================================================== */

var CLOUD_APP = "kabinet";

var STATUS = {
  draft: "Черновик",
  in_progress: "В работе",
  review: "На проверке",
  revision: "Требует доработки",
  accepted: "Принята",
  graded: "Оценена"
};
var STATUS_PILL = {
  draft:"p-gray", in_progress:"p-och", review:"p-warn",
  revision:"p-warn", accepted:"p-ok", graded:"p-ok"
};
var WORK_STATUSES = ["draft","in_progress","review","revision","accepted","graded"];
var CHAPTER_STATUSES = ["draft","in_progress","review","accepted"];
var EVENT_KINDS = { exam:"Экзамен", test:"Зачёт", consult:"Консультация", defense:"Защита", cls:"Пара", other:"Событие" };
var EVENT_ORDER = ["exam","test","consult","defense","cls","other"];

var CHAPTERS = [
  { id:"introduction", name:"Введение",                    weight:10 },
  { id:"chapter1",     name:"Глава 1. Теоретическая часть", weight:25 },
  { id:"chapter2",     name:"Глава 2. Практическая часть",  weight:25 },
  { id:"chapter3",     name:"Глава 3. Результаты",          weight:20 },
  { id:"conclusion",   name:"Заключение",                   weight:10 },
  { id:"references",   name:"Список литературы",            weight:5  },
  { id:"appendices",   name:"Приложения",                   weight:5  }
];

/* Оформление по умолчанию — общий ГОСТ. Требования кафедры всегда важнее. */
function defaultFormat(){
  return {
    org:"", univ:"", faculty:"", kafedra:"", city:"", year:"",
    workType:"Курсовая работа", discipline:"", supervisor:"",
    program:"", form:"", course:"",
    mTop:20, mRight:15, mBottom:20, mLeft:30,
    font:"Times New Roman", size:14, spacing:1.5, indent:1.25,
    titlePageNum:false, toc:true
  };
}

function emptyStructure(){
  var ch = {};
  CHAPTERS.forEach(function(c){ ch[c.id] = { text:"", status:"draft" }; });
  return ch;
}

function emptyData(){
  return {
    settings: { name:"", group:"", theme:"blue", warnDays:3,
      univ:"", faculty:"", kafedra:"", program:"", form:"", course:"", city:"", contact:"",
      registryUrl:"https://innaodincova-finpro.github.io/studkab/reestr/" },
    works: [], tasks: [], events: [], icsSeq: {},
    templates: [ { id:"tpl1", name:"ГОСТ 7.32-2017 (общий)",
      description:"Поля 30/15/20/20, Times New Roman 14, интервал 1,5", format: defaultFormat() } ]
  };
}

/* ---------- НАЧАЛЬНЫЕ ДАННЫЕ ---------- */
function demoData(){
  var t = new Date(); t.setHours(0,0,0,0);
  function day(n){ var d = new Date(t); d.setDate(d.getDate()+n); return isoLocal(d); }
  var f1 = defaultFormat();
  f1.univ = "Российская академия народного хозяйства и государственной службы";
  f1.faculty = "Факультет рыночных технологий";
  f1.kafedra = "Кафедра менеджмента";
  f1.city = "Москва";
  f1.discipline = "Информационные системы";
  f1.supervisor = "доц. Николаева О. В.";
  return {
    settings: { name:"Петров Иван Сергеевич", group:"3-ИС-21", theme:"light", warnDays:3,
      univ:"", faculty:"", kafedra:"", program:"", form:"очная", course:"3", city:"", contact:"" },
    works: [
      {
        id:"w1",
        topic:"Базы данных для интернет-магазина",
        student:"Петров Иван Сергеевич", group:"3-ИС-21",
        created:day(-31), deadline:day(14),
        requirements:"40–50 страниц, оригинальность от 70%",
        status:"in_progress",
        format:f1,
        structure:{
          introduction:{ text:"Актуальность темы обусловлена ростом электронной коммерции.", status:"accepted" },
          chapter1:{ text:"Теоретические основы проектирования баз данных.", status:"in_progress" },
          chapter2:{ text:"", status:"draft" },
          chapter3:{ text:"", status:"draft" },
          conclusion:{ text:"", status:"draft" },
          references:{ text:"1. Иванов И. И. Базы данных. — М., 2020.\n2. Петров П. П. SQL. — СПб., 2021.", status:"in_progress" },
          appendices:{ text:"", status:"draft" }
        },
        tasks:[
          { id:"tk1", due:day(3), text:"Сдать черновик главы 1", done:false },
          { id:"tk2", due:day(7), text:"Собрать литературу по теме", done:false }
        ]
      }
    ],
    tasks:[],
    events:[],
    templates:[
      { id:"tpl1", name:"ГОСТ 7.32-2017 (общий)",
        description:"Поля 20/15/20/30, Times New Roman 14, интервал 1,5",
        format: defaultFormat() }
    ]
  };
}

/* ---------- ХРАНЕНИЕ ---------- */
var KEY = "student_cabinet_v3";
var D = null, undoStack = [], redoStack = [], storageOk = true;

function load(){
  var raw = null;
  try{ raw = localStorage.getItem(KEY); }catch(e){ storageOk = false; }
  if (raw){ try{ D = JSON.parse(raw); }catch(e){ D = null; } }
  if (!D){ D = emptyData(); }
  if (!D.works) D.works = [];
  if (!D.tasks) D.tasks = [];
  if (!D.events) D.events = [];
  if (!D.templates) D.templates = [];
  if (!D.icsSeq) D.icsSeq = {};
  if (!D.settings) D.settings = { name:"", group:"", theme:"light", warnDays:3 };
  if (D.settings.warnDays === undefined) D.settings.warnDays = 3;
  ["univ","faculty","kafedra","program","form","course","city","contact"].forEach(function(k){
    if (D.settings[k] === undefined) D.settings[k] = "";
  });
  if (D.settings.registryUrl === undefined)
    D.settings.registryUrl = "https://innaodincova-finpro.github.io/studkab/reestr/";
  /* реестр переехал в свою папку — старый адрес поправляем сами */
  if (/\/studkab\/reestr\.html$/.test(D.settings.registryUrl || ""))
    D.settings.registryUrl = D.settings.registryUrl.replace(/reestr\.html$/, "reestr/");
  D.works.forEach(function(w){
    if (!w.tasks) w.tasks = [];
    if (!w.structure) w.structure = emptyStructure();
    CHAPTERS.forEach(function(c){
      if (!w.structure[c.id]) w.structure[c.id] = { text:"", status:"draft" };
    });
    var def = defaultFormat();
    if (!w.format) w.format = def;
    for (var k in def){ if (w.format[k] === undefined) w.format[k] = def[k]; }
    if (!w.req) w.req = { id:uid("rq"), contact:"", org:"", notes:"", sent:"", sentBy:"" };
    if (!w.req.id) w.req.id = uid("rq");
  });
  if (!D.settings.theme || D.settings.theme === "dark" || D.settings.theme === "light") D.settings.theme = "blue";
  applyTheme();
  save();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(D)); lastSaved = new Date(); markSaved();
        if (window.Oblako) Oblako.touch(); }
  catch(e){ storageOk = false; markSaved(); }
}
function change(fn){
  undoStack.push(JSON.stringify(D));
  if (undoStack.length > 20) undoStack.shift();
  redoStack = [];
  fn(); save();
}
function undo(){
  if (!undoStack.length) return toast("Отменять нечего");
  redoStack.push(JSON.stringify(D));
  D = JSON.parse(undoStack.pop());
  save(); render(); toast("Отменено");
}
function redo(){
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify(D));
  D = JSON.parse(redoStack.pop());
  save(); render();
}
var lastSaved = null;
function markSaved(){
  var el = document.getElementById("savedAt");
  if (!el) return;
  if (!storageOk){ el.textContent = "НЕ СОХРАНЯЕТСЯ"; el.style.color = "#E0A79E"; return; }
  el.textContent = lastSaved ? "сохранено " + pad(lastSaved.getHours()) + ":" + pad(lastSaved.getMinutes()) : "";
}
function pad(n){ return n < 10 ? "0"+n : ""+n }

/* копия проверяется до того, как заменит текущие данные */
function isTime(v){
  if (typeof v !== "string") return false;
  var m = v.match(/^(\d{1,2}):(\d{2})$/);
  return !!m && +m[1] >= 0 && +m[1] <= 23 && +m[2] >= 0 && +m[2] <= 59;
}
function checkFormat(fm, where){
  if (!fm) return null;
  if (typeof fm !== "object" || Array.isArray(fm)) return "Повреждено оформление: " + where;
  var lim = { mTop:[0,100], mRight:[0,100], mBottom:[0,100], mLeft:[0,100], size:[6,72], spacing:[0.5,4], indent:[0,10] };
  for (var q in lim){
    var v = fm[q];
    if (v === "" || v == null) continue;
    if (typeof v !== "number" || isNaN(v) || v < lim[q][0] || v > lim[q][1])
      return "Недопустимое значение оформления «" + q + "»: " + where;
  }
  var strs = ["font","univ","faculty","kafedra","city","workType","discipline","supervisor","program","form","course","org","year"];
  for (var t2 = 0; t2 < strs.length; t2++)
    if (fm[strs[t2]] != null && typeof fm[strs[t2]] !== "string") return "Повреждено поле оформления «" + strs[t2] + "»: " + where;
  return null;
}
function isDate(v){
  if (typeof v !== "string") return false;
  var m = v.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return false;
  var d = new Date(+m[1], +m[2]-1, +m[3]);
  /* new Date(2026,12,45) молча превращается в другую дату — сверяем обратно */
  return d.getFullYear() === +m[1] && d.getMonth() === +m[2]-1 && d.getDate() === +m[3];
}
function checkBackup(o){
  if (!o || typeof o !== "object" || Array.isArray(o)) return "Это не копия кабинета";
  if (!Array.isArray(o.works)) return "В файле нет списка работ";
  var arrs = ["tasks","events","templates"];
  for (var a = 0; a < arrs.length; a++)
    if (o[arrs[a]] && !Array.isArray(o[arrs[a]])) return "Файл повреждён: " + arrs[a];
  if (o.settings && (typeof o.settings !== "object" || Array.isArray(o.settings))) return "Файл повреждён: настройки";

  var seen = {};
  function checkTask(t, where){
    if (!t || typeof t !== "object" || Array.isArray(t)) return "Повреждено дело: " + where;
    if (typeof t.id !== "string" || !t.id) return "У дела нет номера: " + where;
    if (seen[t.id]) return "Повторяющийся номер дела: " + t.id;
    seen[t.id] = 1;
    if (typeof t.text !== "string") return "У дела повреждён текст: " + where;
    if (!isDate(t.due)) return "У дела неверная дата: " + where;
    return null;
  }
  for (var i = 0; i < o.works.length; i++){
    var w = o.works[i], name = "работа №" + (i+1);
    if (!w || typeof w !== "object" || Array.isArray(w)) return "Повреждена " + name;
    if (typeof w.id !== "string" || !w.id) return "У работы №" + (i+1) + " нет номера";
    if (seen[w.id]) return "Повторяющийся номер работы: " + w.id;
    seen[w.id] = 1;
    if (typeof w.topic !== "string") return "У работы №" + (i+1) + " повреждена тема";
    name = w.topic || name;
    if (w.status && WORK_STATUSES.indexOf(w.status) < 0) return "Неизвестный статус работы: " + name;
    if (w.deadline && !isDate(w.deadline)) return "Неверный срок сдачи: " + name;
    if (w.created && !isDate(w.created)) return "Неверная дата создания: " + name;
    if (w.structure){
      if (typeof w.structure !== "object" || Array.isArray(w.structure)) return "Повреждены разделы: " + name;
      for (var k in w.structure){
        var ch = w.structure[k];
        if (!ch || typeof ch !== "object" || Array.isArray(ch)) return "Повреждён раздел «" + k + "»: " + name;
        if (ch.text != null && typeof ch.text !== "string") return "Повреждён текст раздела «" + k + "»: " + name;
        if (ch.status && CHAPTER_STATUSES.indexOf(ch.status) < 0) return "Неизвестный статус раздела «" + k + "»: " + name;
      }
    }
    if (w.tasks){
      if (!Array.isArray(w.tasks)) return "Повреждены дела: " + name;
      for (var t = 0; t < w.tasks.length; t++){ var e1 = checkTask(w.tasks[t], name); if (e1) return e1; }
    }
    var ef0 = checkFormat(w.format, name);
    if (ef0) return ef0;
  }
  if (o.tasks) for (var j = 0; j < o.tasks.length; j++){ var e2 = checkTask(o.tasks[j], "общий список"); if (e2) return e2; }
  var workIds = {};
  o.works.forEach(function(w){ if (w && w.id) workIds[w.id] = 1; });
  if (o.events) for (var m = 0; m < o.events.length; m++){
    var ev = o.events[m];
    if (!ev || typeof ev !== "object" || Array.isArray(ev)) return "Повреждено событие №" + (m+1);
    if (typeof ev.id !== "string" || !ev.id) return "У события №" + (m+1) + " нет номера";
    if (seen[ev.id]) return "Повторяющийся номер события: " + ev.id;
    seen[ev.id] = 1;
    if (!isDate(ev.date)) return "У события №" + (m+1) + " неверная дата";
    if (ev.time && !isTime(ev.time)) return "У события №" + (m+1) + " неверное время";
    if (ev.kind && !EVENT_KINDS[ev.kind]) return "У события №" + (m+1) + " неизвестный вид";
    if (ev.wid && !workIds[ev.wid]) return "Событие №" + (m+1) + " ссылается на несуществующую работу";
  }
  if (o.templates) for (var p = 0; p < o.templates.length; p++){
    var tp = o.templates[p];
    if (!tp || typeof tp !== "object" || Array.isArray(tp)) return "Повреждён шаблон №" + (p+1);
    if (typeof tp.id !== "string" || !tp.id) return "У шаблона №" + (p+1) + " нет номера";
    if (seen[tp.id]) return "Повторяющийся номер шаблона: " + tp.id;
    seen[tp.id] = 1;
    if (typeof tp.name !== "string" || !tp.name) return "У шаблона №" + (p+1) + " нет названия";
    var ef = checkFormat(tp.format, "шаблон «" + tp.name + "»");
    if (ef) return ef;
  }
  if (o.settings){
    var sset = o.settings;
    var strs = ["name","group","univ","faculty","kafedra","program","form","course","city","contact","registryUrl","theme"];
    for (var v2 = 0; v2 < strs.length; v2++)
      if (sset[strs[v2]] != null && typeof sset[strs[v2]] !== "string") return "Повреждена настройка «" + strs[v2] + "»";
    if (sset.warnDays != null && (typeof sset.warnDays !== "number" || sset.warnDays < 1 || sset.warnDays > 30))
      return "Недопустимый срок предупреждения в настройках";
    if (sset.registryUrl && !/^https?:\/\//.test(sset.registryUrl)) return "Неверный адрес реестра в настройках";
  }
  return null;
}

/* ---------- ОБЩЕЕ ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c] }); }
/* toISOString отдаёт время по Гринвичу — в Москве это съезжает на вчерашний день */
function isoLocal(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function parseIso(iso){
  var m = String(iso||"").match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? new Date(+m[1], +m[2]-1, +m[3]) : new Date(iso);
}
function today(){ return isoLocal(new Date()); }
function addDays(iso,n){ var d = parseIso(iso); d.setDate(d.getDate()+n); return isoLocal(d); }
function ruDate(iso){
  var M = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  var d = parseIso(iso), now = new Date();
  if (isNaN(d)) return iso || "";
  return d.getDate()+" "+M[d.getMonth()]+(d.getFullYear()!==now.getFullYear()?" "+d.getFullYear():"");
}
function uid(p){ return p + Math.random().toString(36).slice(2,8) }
function work(id){ return D.works.filter(function(w){ return w.id === id })[0]; }
function getStatus(w){ return w.status || "draft"; }

/* Готовность: пустая глава 0, начата 25, написана 50, на проверке 75, принята 100 */
function getProgress(w){
  var total = 0, done = 0;
  CHAPTERS.forEach(function(c){
    var ch = (w.structure||{})[c.id] || { text:"", status:"draft" };
    var k = 0;
    /* пустой раздел не может быть готов, какой бы статус ни стоял */
    if ((ch.text||"").trim()){
      if (ch.status === "accepted") k = 1;
      else if (ch.status === "review") k = .75;
      else if (ch.status === "in_progress") k = .5;
      else k = .25;
    }
    total += c.weight; done += c.weight * k;
  });
  return total ? Math.round(done/total*100) : 0;
}
function workChars(w){
  var n = 0;
  CHAPTERS.forEach(function(c){ n += ((w.structure||{})[c.id]||{}).text ? w.structure[c.id].text.length : 0; });
  return n;
}
function workPages(w){ return Math.max(0, Math.round(workChars(w)/1800*10)/10); }

var toastT;
function toast(t){
  var el = document.getElementById("toast");
  el.textContent = t; el.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(function(){ el.classList.remove("on") }, 2600);
}

function checkWork(w){
  var out = [], f = w.format || {};
  var empty = CHAPTERS.filter(function(c){ return !((w.structure[c.id]||{}).text||"").trim() });
  if (empty.length) out.push("Не написаны разделы: " + empty.map(function(c){ return c.name }).join(", "));
  if (!(w.student || D.settings.name)) out.push("Не заполнено ФИО студента — раздел «Ещё → Данные студента»");
  if (!f.univ) out.push("Не заполнено название вуза — титульный лист выйдет неполным");
  if (!f.workType) out.push("Не указан вид работы (курсовая, ВКР, реферат)");
  if (!f.city || !f.year) out.push("Не заполнены город и год для нижней части титульного листа");
  if (!f.supervisor) out.push("Не указан руководитель");
  if (!(w.structure.references.text||"").trim()) out.push("Пустой список литературы");
  if (w.deadline && w.deadline < today()) out.push("Срок сдачи прошёл: " + ruDate(w.deadline));
  return out;
}

function daysLeft(iso){
  var a = parseIso(today()), b = parseIso(iso);
  if (isNaN(b)) return 9999;
  return Math.round((b - a) / 86400000);
}
function ruDays(n){
  var a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return "дней";
  if (b > 1 && b < 5) return "дня";
  if (b === 1) return "день";
  return "дней";
}
function whenText(iso){
  var d = daysLeft(iso);
  if (d < 0) return "просрочено на " + (-d) + " " + ruDays(d);
  if (d === 0) return "сегодня";
  if (d === 1) return "завтра";
  return "через " + d + " " + ruDays(d);
}

/* Сроки работ и задачи в одном списке */
function reminders(){
  var out = [];
  D.works.forEach(function(w){
    var st = getStatus(w);
    if (w.deadline && st !== "accepted" && st !== "graded"){
      out.push({ id:"dl-"+w.id, kind:"deadline", due:w.deadline,
        text:"Сдать работу: " + w.topic, wid:w.id, wname:"" });
    }
    (w.tasks||[]).filter(function(x){ return !x.done }).forEach(function(x){
      out.push({ id:x.id, kind:"task", due:x.due, text:x.text, wid:w.id, wname:w.topic });
    });
  });
  D.tasks.filter(function(x){ return !x.done }).forEach(function(x){
    out.push({ id:x.id, kind:"task", due:x.due, text:x.text, wid:null, wname:"" });
  });
  var t = today();
  (D.events || []).filter(function(e){ return e.date >= t }).forEach(function(e){
    var w = e.wid ? work(e.wid) : null;
    out.push({ id:e.id, kind:"event", due:e.date, time:e.time || "", text:eventText(e), wid:e.wid || null, wname:w ? w.topic : "" });
  });
  return out.sort(function(a,b){
    if (a.due !== b.due) return a.due < b.due ? -1 : 1;
    return (a.time || "99") < (b.time || "99") ? -1 : 1;

}

    soon.forEach(function(x){ lines.push("— " + x.text + (x.time ? " в " + x.time : "") + ": " + whenText(x.due) + " (" + ruDate(x.due) + ")"); });
  } else {
    lines.push("", "Ближайших сроков нет.");

function fallbackCopy(msg){
  var ta = document.createElement("textarea");
  ta.value = msg; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  var done = false;

/* копирование асинхронно — возвращаем обещание с честным результатом */
function copyText(msg){
  if (navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(msg).then(
      function(){ toast("Скопировано"); return true; },
      function(){ return fallbackCopy(msg); });
  }
  return Promise.resolve(fallbackCopy(msg));
}

}

function icsEscape(s){
  return String(s==null?"":s)
    .replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
}
/* Строка в файле календаря не может быть длиннее 75 байт — переносим по правилам формата */
function icsFold(line){
  var enc = new TextEncoder();
  if (enc.encode(line).length <= 73) return line;
  var out = [], cur = "", curLen = 0, first = true;
  for (var i=0; i<line.length; i++){
    var chLen = enc.encode(line[i]).length;
    var limit = first ? 73 : 72;
    if (curLen + chLen > limit){ out.push(cur); cur = " "; curLen = 1; first = false; }
    cur += line[i]; curLen += chLen;
  }
  out.push(cur);
  return out.join("\r\n");
}
function icsStamp(d){
  function p(n){ return n<10 ? "0"+n : ""+n }
  return d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate())+"T"+
         p(d.getUTCHours())+p(d.getUTCMinutes())+p(d.getUTCSeconds())+"Z";
}
function icsLocal(iso, h, m){
  function p(n){ return n<10 ? "0"+n : ""+n }
  return String(iso).replace(/-/g,"") + "T" + p(h) + p(m) + "00";
}
function buildIcs(items, stale, workId){
  var warn = D.settings.warnDays || 3;
  var days = [warn, 1].filter(function(v,i,a){ return v >= 1 && a.indexOf(v) === i });
  var now = icsStamp(new Date());
  var L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//StudKab//RU","CALSCALE:GREGORIAN","METHOD:PUBLISH"];

  items.forEach(function(it){
    /* Номер версии события: календарь по нему понимает, что запись надо обновить, а не добавить заново */
    var rec = D.icsSeq[it.uid];
    if (!rec) rec = D.icsSeq[it.uid] = { n:-1, w:null };
    rec.n++;
    rec.w = it.wid || rec.w || null;
    rec.due = it.due; rec.title = it.title; rec.live = true; rec.time = it.time || "";

    L.push("BEGIN:VEVENT");
    L.push("UID:" + it.uid + "@studkab");
    L.push("SEQUENCE:" + rec.n);
    L.push("DTSTAMP:" + now);
    L.push("LAST-MODIFIED:" + now);
    var hh = 10, mm = 0, tm = (it.time || "").match(/^(\d{1,2}):(\d{2})$/);
    if (tm){ hh = parseInt(tm[1],10); mm = parseInt(tm[2],10); }
    var endH = hh + 1, endM = mm;
    if (!tm){ endH = hh; endM = 30; }
    if (endH > 23){ endH = 23; endM = 59; }
    L.push("DTSTART:" + icsLocal(it.due, hh, mm));
    L.push("DTEND:" + icsLocal(it.due, endH, endM));
    L.push("SUMMARY:" + icsEscape(it.title));
    if (it.desc) L.push("DESCRIPTION:" + icsEscape(it.desc));
    L.push("STATUS:CONFIRMED");
    days.forEach(function(d){
      L.push("BEGIN:VALARM");
      L.push("TRIGGER:-P" + d + "D");
      L.push("ACTION:DISPLAY");
      L.push("DESCRIPTION:" + icsEscape(it.title));
      L.push("END:VALARM");
    });
    L.push("END:VEVENT");
  });

  /* Снятые задачи и удалённые работы — помечаем отменёнными, чтобы убрались из календаря */
  (stale || []).forEach(function(uid){
    var rec = D.icsSeq[uid];
    if (!rec || !rec.due) return;
    rec.n++; rec.live = false;
    L.push("BEGIN:VEVENT");
    L.push("UID:" + uid + "@studkab");
    L.push("SEQUENCE:" + rec.n);
    L.push("DTSTAMP:" + now);
    L.push("LAST-MODIFIED:" + now);
    L.push("DTSTART:" + icsLocal(rec.due, 10, 0));
    L.push("DTEND:" + icsLocal(rec.due, 10, 30));
    L.push("SUMMARY:" + icsEscape(rec.title || "Отменено"));
    L.push("STATUS:CANCELLED");
    L.push("END:VEVENT");
  });

  L.push("END:VCALENDAR");
  return L.map(icsFold).join("\r\n") + "\r\n";
}
function calendarItems(workId){
  var out = [];
  var list = workId ? D.works.filter(function(w){ return w.id === workId }) : D.works;
  list.forEach(function(w){
    var st = getStatus(w);
    if (w.deadline && st !== "accepted" && st !== "graded"){
      out.push({ uid:"dl-"+w.id, wid:w.id, due:w.deadline, title:"Сдать: " + w.topic,
        desc:(w.format && w.format.workType ? w.format.workType : "Работа") +
             (w.requirements ? ". " + w.requirements : "") });
    }
    (w.tasks||[]).filter(function(x){ return !x.done }).forEach(function(x){
      out.push({ uid:x.id, wid:w.id, due:x.due, title:x.text, desc:w.topic });
    });
  });
  if (!workId){
    D.tasks.filter(function(x){ return !x.done }).forEach(function(x){
      out.push({ uid:x.id, wid:null, due:x.due, title:x.text, desc:"" });
    });
    (D.events || []).filter(function(e){ return e.date >= today() }).forEach(function(e){
      var w = e.wid ? work(e.wid) : null;
      out.push({ uid:e.id, wid:e.wid || null, due:e.date, time:e.time || "", title:eventText(e),
        desc:(w ? w.topic : "") + (e.note ? (w ? ". " : "") + e.note : "") });
    });

  return out;
}
function exportIcs(workId){
  if (!D.icsSeq) D.icsSeq = {};
  var items = calendarItems(workId);
  var live = {};
  items.forEach(function(it){ live[it.uid] = true; });
  var stale = Object.keys(D.icsSeq).filter(function(uid){
    var rec = D.icsSeq[uid];
    if (live[uid] || !rec || rec.live === false) return false;
    return workId ? rec.w === workId : true;
  });
  if (!items.length && !stale.length) return toast("Нечего добавлять: сроков и задач нет");
  try{
    var text = buildIcs(items, stale, workId);
    save();

    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = (workId ? safeName(work(workId).topic) : "sroki") + ".ics";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url) }, 4000);
    toast(stale.length && !items.length
      ? "Файл скачан — откройте его, календарь уберёт лишнее"
      : "Файл скачан — откройте его, календарь обновит записи");
  }catch(e){ toast("Не удалось собрать напоминание"); }
}

function openChapterEditor(workId, chapterId){
  var w = work(workId); if (!w) return toast("Работа не найдена");
  var ch = w.structure[chapterId]; if (!ch) return toast("Раздел не найден");
  var chapter = CHAPTERS.filter(function(c){ return c.id === chapterId })[0];

  var wrap = openModal(
    '<button type="button" class="close" data-x="1">✕</button>'+
    '<h2>'+esc(chapter.name)+'</h2>'+
    '<p class="small">'+esc(w.topic)+'</p>'+
    '<div class="field" style="margin-top:14px"><label>Текст раздела</label>'+
      '<textarea id="chText"></textarea>'+
      '<span class="hint">Для диктовки нажмите микрофон на клавиатуре телефона.</span></div>'+
    '<div class="field"><label>Готовность раздела</label>'+
      '<select id="chStatus">'+
        CHAPTER_STATUSES.map(function(s){
          return '<option value="'+s+'"'+(ch.status===s?" selected":"")+'>'+STATUS[s]+'</option>';
        }).join("")+
      '</select></div>'+
    '<div class="rowbtns">'+
      '<button type="button" class="b b-main" data-save="1">Сохранить</button>'+
      '<button type="button" class="b b-quiet" data-x="1">Отмена</button>'+
    '</div>',
    function(el){ el.querySelector("#chText").value = ch.text || ""; }
  );

  wrap.addEventListener("click", function(ev){
    if (!ev.target.closest("[data-save]")) return;
    var text = wrap.querySelector("#chText").value;
    var status = wrap.querySelector("#chStatus").value;
    if (!text.trim() && status !== "draft"){
      toast("Раздел пуст — статус останется «Черновик»");
      status = "draft";
    }
    change(function(){
      ch.text = text;
      ch.status = status;
      if (w.status === "draft" && text.trim()) w.status = "in_progress";
    });
    wrap.remove(); render(); toast("Раздел сохранён");
  });
}

function weekdayRu(iso){
  var W = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
  var d = parseIso(iso); return isNaN(d) ? "" : W[d.getDay()];
}
function firstName(){
  var n = (D.settings.name || "").trim();
  if (!n) return "";
  var parts = n.split(/\s+/);
  return parts.length >= 3 ? parts[1] : parts[0];
}
function greetingCard(){
  var now = new Date(), hour = now.getHours();
  var hello = hour < 5 ? "Доброй ночи" : hour < 12 ? "Доброе утро" : hour < 18 ? "Добрый день" : "Добрый вечер";
  var period = hour < 5 ? "night" : hour < 12 ? "morning" : hour < 18 ? "day" : "evening";
  var time = pad(hour) + ":" + pad(now.getMinutes());
  var phrase = hour < 5 ? "Всё важное подождёт до утра" :
    hour < 12 ? "Самое время заглянуть в план" :
    hour < 18 ? "Проверим, что горит, а что подождёт" : "Можно подвести итоги дня";
  var name = firstName();
  return '<div class="greeting ' + period + '">' +
    '<div class="hello">' + hello + (name ? ", " + esc(name) : "") + '!</div>' +
    '<div class="moment"><i aria-hidden="true"></i><span>' + time + ' · ' + phrase + '</span></div></div>';
}
function nearestWork(){
  var t = today();
  var list = D.works.filter(function(w){
    var st = getStatus(w);
    return w.deadline && st !== "accepted" && st !== "graded";
  }).sort(function(a,b){ return a.deadline < b.deadline ? -1 : 1 });
  return list[0] || null;
}
function pill(st){ return '<span class="pill ' + STATUS_PILL[st] + '">' + STATUS[st] + '</span>'; }
function card(inner, cls){ return '<div class="card' + (cls ? ' ' + cls : '') + '">' + inner + '</div>'; }
function lab(t){ return '<div class="lab">' + esc(t) + '</div>'; }

function viewToday(){
  var h = greetingCard();
  if (!storageOk) h += '<div class="warnbar">Браузер не сохраняет данные — возможно, открыт режим инкогнито.</div>';
  var t = today(), warn = D.settings.warnDays || 3, all = reminders();

  var todayItems = all.filter(function(x){ return x.due === t });
  h += card(lab("Сегодня") + (todayItems.length ? todayItems.map(renderItem).join("")
    : '<div class="empty">На сегодня ничего не назначено.</div>'));

  var w = nearestWork();
  if (w){
    var d = daysLeft(w.deadline), p = getProgress(w);
    var tone = d < 0 ? "late" : d <= 7 ? "hot" : d <= 21 ? "warm" : "";
    h += card(
      '<div class="row" style="align-items:flex-start">' +
        '<div style="min-width:0">' + lab("Ближайшая сдача") +
          '<div class="title">' + esc(w.topic) + '</div>' +
          '<div class="mut" style="margin-top:3px">' + esc((w.format && w.format.workType || "работа").toLowerCase()) +
            ' · ' + ruDate(w.deadline) + ' · готово на ' + p + '%</div>' +
        '</div>' +
        '<div class="days ' + tone + '"><b>' + (d < 0 ? -d : d) + '</b><span>' +
          (d < 0 ? ruDays(d) + " назад" : d === 0 ? "сегодня" : ruDays(d)) + '</span></div>' +
      '</div>' +
      '<div class="bar"><i style="width:' + p + '%"></i></div>' +
      '<div class="chips">' +
        '<button type="button" class="chip" data-act="open-work" data-id="' + w.id + '">Открыть работу</button>' +
        '<button type="button" class="chip warn" data-act="send-request" data-id="' + w.id + '">Заказать черновик</button>' +
      '</div>', "now");
  } else {
    h += card(lab(D.works.length ? "Ближайшая сдача" : "С чего начать") +
      '<div class="mut">' + (D.works.length ? "Работ со сроком пока нет."
        : "Заведите работу — тема и срок. Кабинет будет напоминать о сроках и соберёт документ по вашей методичке.") + '</div>' +
      '<div class="chips"><button type="button" class="chip" data-act="new-work">Новая работа</button>' +
      (D.works.length ? '' : '<button type="button" class="chip" data-act="go-profile">Данные о себе</button>') + '</div>');
  }

  var hot = all.filter(function(x){ var d2 = daysLeft(x.due); return d2 !== 0 && d2 <= warn });
  if (hot.length){
    h += card(lab("Горит") + '<div class="dayline"><div class="spine"></div>' +
      hot.map(function(x){
        var d2 = daysLeft(x.due);
        return '<div class="tl ' + (d2 < 0 ? "late" : "next") + '"><div class="tl-dot"></div>' +
          '<div class="tl-time">' + whenText(x.due) + ' · ' + ruDate(x.due) + (x.time ? ' · ' + x.time : '') + '</div>' +
          '<div class="row"><span class="tl-what">' + esc(x.text) + '</span>' +
            (x.kind === "task" ? '<button type="button" class="tick" data-act="task-done" data-id="' + x.id + '"></button>'
              : x.kind === "event" ? '<button type="button" class="mini" data-act="edit-event" data-id="' + x.id + '">изменить</button>'
              : '<button type="button" class="mini" data-act="open-work" data-id="' + x.wid + '">открыть</button>') +
          '</div>' + (x.wname ? '<div class="tl-sub">' + esc(x.wname) + '</div>' : '') + '</div>';
      }).join("") + '</div>');
  }
  return h;
}

/* ---------- КАЛЕНДАРЬ ---------- */
function isoOf(d){ var x = new Date(d); x.setHours(0,0,0,0); return isoLocal(x); }
function monthStart(iso){ return iso.slice(0,8) + "01"; }
function weekStart(iso){ var d = parseIso(iso); var wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return isoOf(d); }
function shiftMonth(iso, n){ var d = parseIso(iso); d.setDate(1); d.setMonth(d.getMonth() + n); return isoOf(d); }
function monthName(iso){
  var M = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
  var d = parseIso(iso); return M[d.getMonth()] + " " + d.getFullYear();
}
function calItemsByDate(){
  var by = {}, t = today();
  reminders().forEach(function(x){ (by[x.due] = by[x.due] || []).push(x); });
  D.works.forEach(function(w){
    (w.tasks || []).filter(function(x){ return x.done }).forEach(function(x){
      (by[x.due] = by[x.due] || []).push({ id:x.id, kind:"done", due:x.due, text:x.text, wid:w.id, wname:w.topic });
    });
  });
  (D.events || []).filter(function(e){ return e.date < t }).forEach(function(e){
    var w = e.wid ? work(e.wid) : null;
    (by[e.date] = by[e.date] || []).push({ id:e.id, kind:"past", due:e.date, time:e.time || "", text:eventText(e), wid:e.wid || null, wname:w ? w.topic : "" });
  });
  return by;
}
function dotClass(x, iso, t){
  if (x.kind === "done" || x.kind === "past") return "ev";
  if (iso < t) return "late";
  return x.kind === "event" ? "ev" : x.kind === "task" ? "tk" : "";
}
function renderItem(x){
  var t = today(), late = x.kind !== "done" && x.kind !== "past" && x.due < t;
  var icon = x.kind === "deadline" ? "!" : x.kind === "done" ? "✓" : x.kind === "event" || x.kind === "past" ? (x.time || "◷") : "•";
  var faded = x.kind === "done" || x.kind === "past";
  var tap = (x.kind === "event" || x.kind === "past") ? ' class="item tapline" data-act="edit-event" data-id="' + x.id + '"' : ' class="item"';
  return '<div' + tap + '><div class="ic" style="' + (late ? 'color:var(--stop);' : '') + (x.time ? 'font-size:11px' : '') + '">' + icon + '</div>' +
    '<div class="txt"><b' + (faded ? ' style="color:var(--mut)' + (x.kind === "done" ? ';text-decoration:line-through' : '') + '"' : '') + '>' + esc(x.text) + '</b>' +
      '<small>' + (x.kind === "done" ? "сделано" : x.kind === "past" ? "прошло" : whenText(x.due)) +
      (x.wname ? ' · ' + esc(x.wname) : '') + '</small></div>' +
    (x.kind === "task" ? '<button type="button" class="tick" data-act="task-done" data-id="' + x.id + '" title="Сделано"></button>'
      : x.kind === "done" ? '<button type="button" class="tick on" data-act="task-done" data-id="' + x.id + '" title="Вернуть в дела">✓</button>'
      : x.kind === "deadline" && x.wid ? '<button type="button" class="mini" data-act="open-work" data-id="' + x.wid + '">открыть</button>' : '') +
  '</div>';
}
function viewCal(){
  var t = today();
  if (!calCursor) calCursor = calMode === "month" ? monthStart(t) : weekStart(t);
  var by = calItemsByDate();
  var h = '<div class="switch">' +
    [["week","Неделя"],["month","Месяц"],["range","Период"]].map(function(m){
      return '<button type="button" aria-selected="' + (calMode === m[0]) + '" data-act="cal-mode" data-k="' + m[0] + '">' + m[1] + '</button>';
    }).join("") + '</div>';

  var days = [], from, to;
  if (calMode === "month"){
    from = monthStart(calCursor);
    var d0 = parseIso(from), dEnd = parseIso(from); dEnd.setMonth(dEnd.getMonth() + 1); dEnd.setDate(0);
    to = isoOf(dEnd);
    var shift = (d0.getDay() + 6) % 7, cells = "";
    for (var i = 0; i < shift; i++) cells += '<div class="d out"></div>';
    for (var dd = parseIso(from); dd <= dEnd; dd.setDate(dd.getDate() + 1)){
      var iso = isoOf(dd), list = by[iso] || [];
      var dots = list.slice(0,3).map(function(x){ return '<i class="' + dotClass(x, iso, t) + '"></i>'; }).join("");
      cells += '<div class="d' + (iso === t ? " today" : "") + (iso === calSel ? " sel" : "") + '" data-act="cal-day" data-d="' + iso + '">' +
        '<span>' + dd.getDate() + '</span><span class="dots">' + dots + '</span></div>';
    }
    h += card('<div class="cal-head"><button type="button" class="mini" data-act="cal-shift" data-n="-1">‹</button><b>' + monthName(from) + '</b>' +
      '<button type="button" class="mini" data-act="cal-shift" data-n="1">›</button></div>' +
      '<div class="cal"><div class="dw">пн</div><div class="dw">вт</div><div class="dw">ср</div><div class="dw">чт</div><div class="dw">пт</div><div class="dw">сб</div><div class="dw">вс</div>' + cells + '</div>' +
      '<div class="cal-legend"><span><i></i>сдача</span><span><i class="tk"></i>дело</span><span><i class="ev"></i>событие</span><span><i class="late"></i>просрочено</span></div>');
  } else if (calMode === "range"){
    if (!calFrom) calFrom = t;
    if (!calTo) calTo = addDays(t, 9);
    from = calFrom; to = calTo;
    var n = Math.round((parseIso(to) - parseIso(from)) / 86400000) + 1;
    h += card(lab("Период") +
      '<div class="fgrid">' +
        '<div class="fld"><label>С даты</label><input type="date" id="calFrom" value="' + from + '" data-cal="from"></div>' +
        '<div class="fld"><label>По дату</label><input type="date" id="calTo" value="' + to + '" data-cal="to"></div>' +
      '</div>' +
      '<div class="pick">' +
        [[1,"Сегодня"],[3,"3 дня"],[10,"10 дней"],[30,"Месяц"]].map(function(q){
          return '<button type="button" data-act="cal-quick" data-n="' + q[0] + '"' + (n === q[0] && from === t ? ' aria-pressed="true"' : '') + '>' + q[1] + '</button>';
        }).join("") +
      '</div>' +
      '<div class="hint">' + ruDate(from) + ' — ' + ruDate(to) + ' · ' + n + ' ' + ruDays(n) + '</div>');
  } else {
    from = weekStart(calCursor);
    var wEnd = parseIso(from); wEnd.setDate(wEnd.getDate() + 6); to = isoOf(wEnd);
    var cells2 = "";
    for (var dw = parseIso(from); dw <= wEnd; dw.setDate(dw.getDate() + 1)){
      var iso2 = isoOf(dw), list2 = by[iso2] || [];
      var dots2 = list2.slice(0,3).map(function(x){ return '<i class="' + dotClass(x, iso2, t) + '"></i>'; }).join("");
      cells2 += '<div class="d' + (iso2 === t ? " today" : "") + (iso2 === calSel ? " sel" : "") + '" data-act="cal-day" data-d="' + iso2 + '">' +
        '<span>' + dw.getDate() + '</span><span class="dots">' + dots2 + '</span></div>';
    }
    h += card('<div class="cal-head"><button type="button" class="mini" data-act="cal-shift" data-n="-1">‹</button><b>' +
      ruDate(from) + ' — ' + ruDate(to) + '</b>' +
      '<button type="button" class="mini" data-act="cal-shift" data-n="1">›</button></div>' +
      '<div class="cal"><div class="dw">пн</div><div class="dw">вт</div><div class="dw">ср</div><div class="dw">чт</div><div class="dw">пт</div><div class="dw">сб</div><div class="dw">вс</div>' + cells2 + '</div>');
  }

  /* список: выбранный день или весь период */
  var dates = Object.keys(by).filter(function(k){ return calSel ? k === calSel : (k >= from && k <= to) }).sort();
  var body = "";
  dates.forEach(function(k){
    body += '<div class="dategroup">' + ruDate(k) + ' · ' + weekdayRu(k) + '</div>' + by[k].map(renderItem).join("");
  });
  h += card((calSel ? '<div class="row" style="margin-bottom:6px">' + lab(ruDate(calSel)).replace("margin-bottom:8px","") +
      '<button type="button" class="mini" data-act="cal-day" data-d="' + calSel + '">весь ' + (calMode === "month" ? "месяц" : calMode === "week" ? "неделю" : "период") + '</button></div>'
      : lab(calMode === "month" ? "За месяц" : calMode === "week" ? "За неделю" : "За период")) +
    (body || '<div class="empty">' + (calSel ? 'На этот день ничего нет.' : 'За этот период планов нет.') + '</div>'));

  h += card(lab("Напомнить себе") +
    '<div class="chips" style="margin-top:0">' +
      '<button type="button" class="chip" data-act="ics-all">В календарь телефона</button>' +
      '<button type="button" class="chip" data-act="tg-share">Сводка в Telegram</button>' +
    '</div>');
  return h;
}

/* ---------- СОБЫТИЕ ---------- */
function openEvent(eventId, dateIso){
  var e = eventId ? eventById(eventId) : null;
  var isNew = !e;
  e = e || { kind:"exam", title:"", date:dateIso || today(), time:"", wid:"", note:"" };
  var wrap = openModal(
    '<button type="button" class="close" data-x="1">✕</button>' +
    '<h3>' + (isNew ? "Новое событие" : "Событие") + '</h3>' +
    '<div class="fld" style="margin-top:12px"><label>Что это</label><select id="evKind">' +
      EVENT_ORDER.map(function(k){ return '<option value="' + k + '"' + (e.kind === k ? " selected" : "") + '>' + EVENT_KINDS[k] + '</option>' }).join("") +
    '</select></div>' +
    '<div class="fld"><label>Название</label><input type="text" id="evTitle" value="' + esc(e.title) + '" placeholder="Например: философия, ауд. 305"></div>' +
    '<div class="fgrid">' +
      '<div class="fld"><label>Дата</label><input type="date" id="evDate" value="' + esc(e.date) + '"></div>' +
      '<div class="fld"><label>Время</label><input type="time" id="evTime" value="' + esc(e.time || "") + '"></div>' +
    '</div>' +
    '<div class="fld"><label>К какой работе</label><select id="evWork">' +
      '<option value="">— не относится —</option>' +
      D.works.map(function(w){ return '<option value="' + w.id + '"' + (e.wid === w.id ? " selected" : "") + '>' + esc(w.topic) + '</option>' }).join("") +
    '</select></div>' +
    '<div class="fld"><label>Заметка</label><input type="text" id="evNote" value="' + esc(e.note || "") + '" placeholder="Что взять, что повторить"></div>' +
    '<div class="rowbtns"><button type="button" class="btn" data-save="1" style="flex:1">' + (isNew ? "Добавить" : "Сохранить") + '</button>' +
    (isNew ? '' : '<button type="button" class="btn ghost" data-del="1" style="flex:1">Удалить</button>') +
    '<button type="button" class="btn ghost" data-x="1" style="flex:1">Отмена</button></div>'
  );
  wrap.addEventListener("click", function(ev){
    if (ev.target.closest("[data-del]")){
      change(function(){ D.events = D.events.filter(function(x){ return x.id !== e.id }); });
      wrap.remove(); render(); toast("Событие удалено"); return;
    }
    if (!ev.target.closest("[data-save]")) return;
    var kind = wrap.querySelector("#evKind").value;
    var title = wrap.querySelector("#evTitle").value.trim();
    var date = wrap.querySelector("#evDate").value;
    var time = wrap.querySelector("#evTime").value;
    var wid = wrap.querySelector("#evWork").value;
    var note = wrap.querySelector("#evNote").value.trim();
    if (!date) return toast("Укажите дату");
    change(function(){
      if (isNew) D.events.push({ id:uid("ev"), kind:kind, title:title, date:date, time:time, wid:wid, note:note });
      else { e.kind = kind; e.title = title; e.date = date; e.time = time; e.wid = wid; e.note = note; }
    });
    wrap.remove(); render(); toast(isNew ? "Событие добавлено" : "Сохранено");
  });
}

function openNewTask(workId, dateIso){
  var wrap = openModal(
    '<button type="button" class="close" data-x="1">✕</button>' +
    '<h3>Новое дело</h3>' +
    '<div class="fld" style="margin-top:12px"><label>Что сделать</label><input type="text" id="tkText" placeholder="Например: сдать черновик главы 1"></div>' +
    '<div class="fld"><label>К какому числу</label><input type="date" id="tkDue" value="' + (dateIso || addDays(today(), 7)) + '"></div>' +
    '<div class="fld"><label>К какой работе</label><select id="tkWork">' +
      '<option value="">— без работы —</option>' +
      D.works.map(function(w){ return '<option value="' + w.id + '"' + (w.id === workId ? " selected" : "") + '>' + esc(w.topic) + '</option>' }).join("") +
    '</select></div>' +
    '<div class="rowbtns"><button type="button" class="btn" data-save="1" style="flex:1">Добавить</button>' +
    '<button type="button" class="btn ghost" data-x="1" style="flex:1">Отмена</button></div>'
  );
  wrap.addEventListener("click", function(ev){
    if (!ev.target.closest("[data-save]")) return;
    var text = wrap.querySelector("#tkText").value.trim();
    if (!text) return toast("Впишите, что нужно сделать");
    var due = wrap.querySelector("#tkDue").value || today();
    var wid = wrap.querySelector("#tkWork").value;
    change(function(){
      var tk = { id:uid("tk"), due:due, text:text, done:false };
      var w = wid ? work(wid) : null;
      if (w) w.tasks.push(tk); else D.tasks.push(tk);
    });
    wrap.remove(); render(); toast("Дело добавлено");
  });
}

var cloudNote = "";           /* короткая строка состояния для экрана */

function cloudInit(){
  if (!window.Oblako) return;
  Oblako.init({
    app: CLOUD_APP,
    getData: function(){ return D; },
    onChange: function(){ cloudPaint(); },
    onConflict: function(res){ cloudConflict(res); }
  }).then(function(){
    if (Oblako.mode === "cloud") cloudFirstPull();
  });
}

/* при входе решаем, чьи записи оставить */
function cloudFirstPull(){
  Oblako.pull({ silent:true }).then(function(res){
    if (!res) return;
    if (res.status === "empty"){
      /* в базе пусто: если на устройстве что-то есть — предлагаем перенести */
      if (cloudHasLocal()){
        if (confirm("В базе пока пусто.\n\nПеренести записи с этого устройства в базу?")){
          Oblako.push(D, true).then(function(){ cloudPaint(); toast("Записи перенесены в базу"); });
        }
      } else {
        Oblako.push(D, true);
      }
      return;
    }
    if (res.status === "loaded"){
      var remoteEmpty = cloudIsEmpty(res.remote);
      if (!cloudHasLocal() || remoteEmpty){
        if (!remoteEmpty) cloudApply(res.remote);
        else Oblako.push(D, true);
        cloudPaint(); return;
      }
      /* и там, и там есть записи — спрашиваем */
      var when = res.remoteAt ? new Date(res.remoteAt) : null;
      var msg = "Записи есть и в базе, и на этом устройстве.\n\n" +
        "ОК — взять из базы" + (when ? " (изменены " + when.toLocaleString("ru-RU") + ")" : "") + "\n" +
        "Отмена — оставить записи этого устройства и записать их в базу";
      if (confirm(msg)) { cloudApply(res.remote); toast("Взяты записи из базы"); }
      else Oblako.push(D, true).then(function(){ toast("Записи этого устройства сохранены в базе"); });
      cloudPaint();
    }
  });
}

/* на другом устройстве записали новее */
function cloudConflict(res){
  var when = res.updated_at ? new Date(res.updated_at).toLocaleString("ru-RU") : "";
  var msg = "Эти записи менялись на другом устройстве" + (when ? " (" + when + ")" : "") + ".\n\n" +
    "ОК — забрать оттуда (здешние несохранённые правки пропадут)\n" +
    "Отмена — оставить здешние и перезаписать базу";
  if (confirm(msg)){
    Oblako.pull().then(function(r){
      if (r && r.status === "loaded"){ cloudApply(r.remote); toast("Взяты записи из базы"); }
    });
  } else {
    Oblako.push(D, true).then(function(){ toast("База перезаписана записями этого устройства"); });
  }
}

function cloudApply(remote){
  if (!remote || typeof remote !== "object") return;
  var bad = checkBackup(remote);
  if (bad){ toast("Записи в базе повреждены: " + bad); return; }
  D = remote; save(); load(); render();
}

function cloudPaint(){
  cloudNote = window.Oblako ? Oblako.statusText() : "";
  var el = document.getElementById("cloudLine");
  if (el) el.textContent = cloudNote;
  var b = document.getElementById("cloudBadge");
  if (b){
    var on = window.Oblako && Oblako.mode === "cloud";
    b.className = "pill " + (on ? "p-ok" : "p-gray");
    b.textContent = on ? "в базе" : "на устройстве";
  }
}
