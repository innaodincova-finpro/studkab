.shell>aside{background:linear-gradient(180deg,#edf4fa,#f9fcfe);border-right-color:#e1eaf2}.logo:before{content:'▤ ';color:#c49d60}.top{background:radial-gradient(circle at 86% -40%,rgba(255,255,255,.3),transparent 42%),linear-gradient(120deg,#2e5a85,#4e7a9e 55%,#6f98bb);box-shadow:0 10px 28px #28425c25}.top b:before{content:'▤ ';color:#e0bd7f}.top b{font-weight:600}.card{border:1px solid #e4ebf1;border-radius:28px;background:linear-gradient(145deg,#fff,#f7fbfe);box-shadow:0 13px 32px #28425c13}.nav button.on{background:linear-gradient(145deg,#fff,#edf5fb);box-shadow:0 6px 16px #28425c15,inset 3px 0 #3c6b92;border-radius:18px}.primary{background:linear-gradient(115deg,#b08347,#d2a46a);border-color:#c9a16a;box-shadow:0 7px 18px #b0834730;border-radius:18px}.secondary,.assistant button{background:linear-gradient(145deg,#fff,#edf4fa);border-color:#c9dae8;box-shadow:0 4px 12px #28425c12;border-radius:18px}.pill{background:linear-gradient(110deg,#e8f0f7,#eef4f9);border-radius:12px}.stage{background:linear-gradient(135deg,#e7f0f7,#f4f8fb);border:1px solid #c8dae9;border-radius:24px;padding:22px}.stage h2{font-size:27px}.file{background:linear-gradient(145deg,#fff,#f4f8fb);border-radius:16px}.file:before{content:'▤ ';color:#43749c}.tabs button.on{border-bottom-color:#37658c}.steps{display:block;margin:0;padding:0}.steps li{display:grid;grid-template-columns:42px 1fr;gap:16px;text-align:left;position:relative;min-height:65px;font-size:16px;padding:0 0 18px}.steps li:not(:last-child):before{content:'';position:absolute;left:20px;top:40px;bottom:0;width:3px;background:#dae5ee}.steps .route-dot{border:2px solid #d0dee8;border-radius:50%;height:42px;width:42px;display:flex;align-items:center;justify-content:center;padding:0;background:#f8fbfd;color:#8094a5;font-weight:600}.steps .done .route-dot{background:#50836c;color:#fff;border-color:#50836c}.steps .current .route-dot{background:linear-gradient(145deg,#315f88,#527d9f);border:5px solid #dce8f1;color:#fff;box-shadow:0 0 0 5px #edf4fa}.route-body{padding-top:8px;min-width:0}.steps .current .route-body>b{color:#38678f}.route-content{padding-top:14px}.assistant{flex-direction:column}.assistant button{flex:initial;width:100%;text-align:left;padding:13px 18px}.assistant button:after{content:' →';float:right}.heading h1{font-weight:600}details{border-radius:20px;box-shadow:0 5px 14px #28425c09}button{transition:background .16s ease,box-shadow .16s ease,transform .16s ease}button:active:not(:disabled){transform:translateY(1px)}.route-content{animation:appear .18s ease-out}@keyframes appear{from{opacity:.55;transform:translateY(4px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:959px){.top{padding:24px 20px}.nav button.on{border-radius:14px;box-shadow:0 0 12px #28425c14,inset 0 3px #37658c}.steps li{font-size:16px}.stage{padding:18px}.stage h2{font-size:25px}.card{padding:20px}}

<div class="proposal"><div><b>Единая концепция STUDKAB</b> · Макет. Данные демонстрационные. Приложение не изменено.</div><div class="roles"><button data-role="student">Студент</button><button data-role="executor" class="on">Исполнитель</button><button onclick="role='executor';navigate('detail')">Подготовка работы</button><button onclick="showAccess()">Вход</button><button onclick="showActivation()">Активация</button></div></div>
<div class="catalogue"><b>Каталог экранов и состояний</b><select id="scenario" onchange="specimen(this.value)" aria-label="Экран макета"></select><span>Выборы ниже только показывают примеры; документы не отправляются.</span></div><div class="shell"><aside><div class="logo">STUDKAB</div><nav class="nav" id="nav"></nav></aside><main><header class="top"><div><b id="brand">Кабинет студента</b><small>Четверг, 8 октября</small></div><span class="save">✓ Сохранено</span></header><div class="page" id="page"></div></main></div><div class="dialog" id="dialog" hidden></div><div class="toast" id="toast" role="status" hidden></div>
<script>
let role='executor',tab='detail',detailTab='overview',prepState='idle',checked=false;
const studentTabs=[['today','Сегодня'],['calendar','Календарь'],['works','Работы'],['profile','Профиль']],executorTabs=[['today','Сегодня'],['requests','Заявки'],['universities','Вузы'],['more','Ещё']];
const data=[['№ 7','Правоведение — практические задания','25 октября','Ожидает подготовки'],['№ 6','Русский язык — практические задания','13 ноября','Есть вопрос'],['№ 5','История России — практическая работа','20 ноября','Передана студенту']];
function button(t,fn,cls='secondary'){return `<button class="${cls}" onclick="${fn.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">${t}</button>`}function head(title,copy='',action=''){return `<div class="heading"><div><h1>${title}</h1>${copy?`<div class="mut">${copy}</div>`:''}</div>${action}</div>`}function card(t,body){return `<section class="card"><h2>${t}</h2>${body}</section>`}function notify(t){document.getElementById('toast').textContent=t;document.getElementById('toast').hidden=false;setTimeout(()=>document.getElementById('toast').hidden=true,2700)}function modal(body){document.getElementById('dialog').innerHTML=`<div class="card"><button class="close" onclick="closeDialog()" aria-label="Закрыть">×</button>${body}</div>`;document.getElementById('dialog').hidden=false}function closeDialog(){document.getElementById('dialog').hidden=true}function navigate(t){tab=t;detailTab='overview';render();window.scrollTo(0,0)}
function listRows(){return data.map(x=>`<div class="row"><div><b>${x[1]}</b><small>${x[0]} · ${x[3]}</small></div><div class="due"><small>Сдать до ${x[2]}</small>${button('Открыть',"navigate('detail')",'link')}</div></div>`).join('')}
function today(){let body=role==='student'?head('Сегодня','Ваши работы, занятия и ближайшие действия',button('Отправить задание','showIntake()','primary'))+`<div class="grid">${card('Требует внимания',`<div class="row"><div><b>Русский язык · № 6</b><small>Исполнитель задал вопрос</small></div>${button('Ответить',"navigate('detail');setDetail('questions')",'primary')}</div><div class="row"><div><b>Правоведение · № 7</b><small>Ожидает подготовки · до 25 октября</small></div>${button('Открыть',"navigate('detail')")}</div>`)}<div>${card('Занятия сегодня','<div class="row"><div><b>14:20 — 15:40</b><small>Русский язык · практическое занятие</small></div></div>')}${card('Ближайшие сроки','<div class="row"><div><b>25 октября</b><small>Правоведение — практические задания</small></div></div>')}</div></div>`:head('Сегодня','Что требует вашего действия')+`<div class="grid">${card('Ваш ход',`<div class="row"><div><b>№ 7 · Правоведение</b><small>Материалы получены · до 25 октября</small></div>${button('Открыть',"navigate('detail')",'primary')}</div><div class="row"><div><b>№ 5 · История России</b><small>Проверить готовый файл</small></div>${button('Проверить',"navigate('detail');prepState='ready';render()")}</div>`)}${card('Ждём студента','<div class="row"><div><b>№ 6 · Русский язык</b><small>Вопрос отправлен · 13 ноября</small></div><span class="pill">Ожидаем ответ</span></div>')}</div>`;return body}
function works(){return head(role==='student'?'Работы':'Заявки','3 работы',role==='student'?button('Отправить задание','showIntake()','primary'):button('Обновить',"notify('Макет: список обновлён')"))+`<input class="search" placeholder="Поиск по номеру, предмету или названию" aria-label="Поиск"><div class="filters"><button class="on" onclick="filter(this)">Все · 3</button><button onclick="filter(this)">В работе · 2</button><button onclick="filter(this)">Переданы · 1</button></div>`+(role==='student'?card('Ваши работы',listRows()):`<section class="card"><table><thead><tr><th>Заявка</th><th>Работа</th><th>Срок</th><th>Следующий шаг</th></tr></thead><tbody>${data.map(x=>`<tr onclick="navigate('detail')"><td>${x[0]}<small>Студент</small></td><td>${x[1]}</td><td>${x[2]}</td><td><span class="pill">${x[3]}</span></td></tr>`).join('')}</tbody></table></section>`)}
function filter(el){el.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));el.classList.add('on');notify('Макет: выбран фильтр '+el.textContent)}
function route(){let currentStep=prepState==='submitted'?4:prepState==='delivered'?3:2;let steps=role==='student'?['Задание','Вопросы','В работе','Готово','Сдача']:['Получена','Вопросы','В работе','Передана','Сдана'];return `<ol class="steps">${steps.map((x,i)=>`<li class="${i<currentStep?'done':i===currentStep?'current':''}"><span class="route-dot">${i<currentStep?'✓':i+1}</span><div class="route-body"><b>${x}</b>${i===currentStep?'<div class="route-content">'+prep()+'</div>':''}</div></li>`).join('')}</ol>`}

function prep(){if(role==='student'&&['delivered','submitted'].includes(prepState))return `<div class="stage"><span class="pill done">${prepState==='submitted'?'Сдача отмечена':'Передана вам'}</span><h2>${prepState==='submitted'?'Вы отметили сдачу работы':'Работа передана вам'}</h2><div class="file">Практические задания.docx</div><div class="actions">${button('Открыть файл','showReview()','primary')}${button('Я сдал работу',"markSubmitted()")}${button('Вернули на доработку','showVersions()')}</div></div>`;if(role==='student'){const states={idle:['Ожидает подготовки','Задание у исполнителя'],sending:['Отправляется','Материалы передаются помощнику'],queued:['Ожидается запуск','Комплект принят системой'],working:['Выполняется','Работа подготавливается'],ready:['Проверяется исполнителем','Файл подготовлен'],error:['Нет подтверждения','Исполнитель проверяет состояние']};const state=states[prepState]||states.idle;return `<div class="stage"><span class="pill">${state[0]}</span><h2>${state[1]}</h2><p>Следующий результат появится здесь.</p></div>`;}if(prepState==='idle')return `<div class="stage"><span class="pill">Ожидает подготовки</span><h2>Подготовить работу</h2><div class="assistant"><button onclick="startPrep('Claude')">Claude</button><button onclick="startPrep('ChatGPT / Codex')">ChatGPT / Codex</button><button onclick="startPrep('DeepSeek')">DeepSeek</button></div></div>`;if(prepState==='sending'||prepState==='working')return `<div class="stage"><span class="pill">${prepState==='sending'?'Отправляем…':'Выполняется'}</span><h2>${chosen}</h2><p>Готовый файл появится в этой заявке.</p><div class="actions">${button('Показать результат макета',"prepState='ready';render()")}${button('Показать ожидание запуска',"prepState='queued';render()")}${button('Показать ошибку',"prepState='error';render()")}</div></div>`;if(prepState==='queued')return `<div class="stage"><span class="pill">Ожидается запуск</span><h2>${chosen}</h2><p>Комплект принят системой.</p><div class="actions">$
