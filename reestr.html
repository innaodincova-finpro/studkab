*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden}
html,body{max-width:100%}
body{margin:0;color:var(--ink);font-family:'Golos Text',system-ui,-apple-system,sans-serif;line-height:1.45;overflow-x:hidden;width:100%;background:var(--body-bg)}
button,input,select,textarea{font:inherit;color:inherit}
.num,.big,.stat b,.tl-time{font-family:'IBM Plex Mono',monospace}

.phone{width:100%;max-width:520px;min-height:100vh;margin:0 auto;position:relative;display:flex;flex-direction:column;background:var(--phone-bg)}
@media (min-width:600px){.phone{margin:22px auto;min-height:calc(100vh - 44px);border:1px solid var(--card-border);border-radius:34px;box-shadow:0 28px 70px var(--greet-sh);overflow:hidden}}

.appbar{position:sticky;top:0;z-index:5;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 18px 16px;display:flex;align-items:flex-end;justify-content:space-between;background:var(--appbar);box-shadow:0 10px 30px var(--appbar-sh)}

.brand{display:flex;align-items:center;gap:10px}

.appbar h2{font-family:'Spectral',serif;font-size:20px;margin:0;font-weight:600;letter-spacing:.01em}
.appbar .sub,.appbar .saved{font-size:11px;color:rgba(255,255,255,.84);margin-top:2px}
.appbar .saved{font-size:10px;text-align:right}

.screen{flex:1;padding:18px 16px 150px;overflow-x:hidden}

.greeting{position:relative;overflow:hidden;margin:0 0 14px;padding:18px 18px 17px;border-radius:22px;color:#fff;background:var(--greet);box-shadow:0 14px 32px var(--greet-sh)}
.greeting:before{content:'✦';position:absolute;right:19px;top:12px;font-size:28px;color:rgba(255,255,255,.2);transform:rotate(12deg)}
.greeting:after{content:'✧';position:absolute;right:58px;bottom:12px;font-size:17px;color:rgba(255,255,255,.26)}
.greeting .hello{font-family:'Spectral',Georgia,serif;font-size:23px;font-weight:600;line-height:1.2;padding-right:48px}
.greeting .moment{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:12px;color:rgba(255,255,255,.84)}
.greeting .moment i{display:block;width:6px;height:6px;border-radius:50%;background:#FFE3C2;box-shadow:0 0 0 4px rgba(255,227,194,.15)}
.greeting.morning{background:var(--greet-morning)}
.greeting.morning:before{content:'☀';color:rgba(255,248,210,.34)}
.greeting.day{background:var(--greet-day)}
.greeting.evening{background:var(--greet-evening)}
.greeting.evening:before{content:'◐';color:rgba(255,224,210,.3)}
.greeting.night{background:var(--greet-night)}
.greeting.night:before{content:'☾';color:rgba(236,219,255,.32)}
.greeting.night:after{content:'✦  ·  ✧';letter-spacing:7px;color:rgba(255,255,255,.35)}

.card{background:var(--card);border:1px solid var(--card-border);border-radius:20px;padding:14px;margin-bottom:12px;max-width:100%;box-shadow:0 10px 26px var(--card-sh),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(10px)}
.card.now{border-color:var(--head);box-shadow:0 12px 30px var(--card-sh),0 0 0 3px var(--days-bg)}
.lab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--lab);font-weight:600;margin-bottom:8px}
.mut{color:var(--mut);font-size:12px;overflow-wrap:anywhere}
.title{font-family:'Spectral',serif;font-size:18px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.big{font-size:27px;font-weight:500;letter-spacing:-.02em}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.days{flex:0 0 auto;text-align:center;min-width:58px;padding:6px 8px;border-radius:14px;background:var(--days-bg);color:var(--days-fg)}
.days b{display:block;font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:500;line-height:1}
.days span{font-size:10px;letter-spacing:.06em}
.days.warm{background:var(--warm-bg);color:var(--warm-fg)}
.days.hot{background:var(--hot-bg);color:var(--hot-fg)}
.days.late{background:var(--stop);color:#fff}

.dayline{position:relative;padding-left:22px}
.spine{position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--spine)}
.tl{position:relative;padding:0 0 14px}
.tl:last-child{padding-bottom:2px}
.tl-dot{position:absolute;left:-21px;top:4px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.tl.next .tl-dot{background:var(--dot-on);border-color:var(--dot-on);box-shadow:0 0 0 4px var(--days-bg)}
.tl.late .tl-dot{background:var(--stop);border-color:var(--stop)}
.tl-time{font-size:11px;color:var(--mut)}
.tl-what{font-size:14px;font-weight:500;overflow-wrap:anywhere}
.tl-sub{font-size:11px;color:var(--mut)}

.stat{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.stat:last-child{border:0;padding-bottom:0}
.stat b{font-weight:500;text-align:right;overflow-wrap:anywhere}
.item{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);max-width:100%}
.item:last-child{border-bottom:0}
.item.tapline{cursor:pointer}
.item.tapline:active{background:var(--ground)}
.ic{width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;color:var(--ic-fg);background:var(--ic-bg);box-shadow:inset 0 0 0 1px var(--ic-ring)}
.item .txt{flex:1;min-width:0}
.item .txt b{display:block;font-weight:500;font-size:14px;overflow-wrap:anywhere}
.item .txt small{color:var(--mut);font-size:11px;overflow-wrap:anywhere}
.bar{height:7px;border-radius:99px;background:var(--bar-bg);overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--bar)}

.pill{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:99px;white-space:nowrap;flex:0 0 auto}
.p-gray{background:var(--bar-bg);color:var(--mut)}
.p-och{background:var(--warm-bg);color:var(--warm-fg)}
.p-warn{background:var(--hot-bg);color:var(--hot-fg)}
.p-ok{background:#E7F1EA;color:#4B7F62}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:8px 13px;border:none;border-radius:99px;background:var(--chip-bg);font-size:12.5px;color:var(--chip-fg);font-weight:600;cursor:pointer}
.chip:active{filter:brightness(.96)}
.chip.ok{background:#E7F1EA;color:#4B7F62}
.chip.warn{background:var(--warm-bg);color:var(--warm-fg)}
.switch{display:flex;background:var(--bar-bg);border-radius:12px;padding:3px;margin-bottom:12px}
.switch button{flex:1;border:0;background:transparent;padding:9px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500;color:var(--mut)}
.switch button[aria-selected="true"]{background:#fff;color:var(--accent);box-shadow:0 4px 12px var(--card-sh)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:rgba(255,255,255,.8);border-radius:99px;padding:7px 12px;cursor:pointer;font-size:13px;color:var(--ink)}
.pick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font-family:'Spectral',serif;font-size:17px;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dw{text-align:center;font-size:10px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;padding:2px 0 4px}
.cal .d{aspect-ratio:1;border:1px solid var(--line);border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;cursor:pointer;background:rgba(255,255,255,.7);position:relative}
.cal .d.out{visibility:hidden}
.cal .d.today{background:var(--cal-today);border-color:transparent;color:#fff;font-weight:600}
.cal .d.sel{outline:2px solid var(--accent);outline-offset:-2px}
.cal .d .dots{display:flex;gap:2px;height:5px}
.cal .d .dots i{width:5px;height:5px;border-radius:50%;background:var(--dot-on)}
.cal .d .dots i.tk{background:var(--warm)}
.cal .d .dots i.late{background:var(--stop)}
.cal .d .dots i.ev{background:var(--navy)}
.cal-legend i.ev{background:var(--navy)}
.cal .d.today .dots i{background:#fff}
.cal-legend{display:flex;gap:12px;font-size:11px;color:var(--mut);margin-top:10px}
.cal-legend i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--dot-on);margin-right:4px;vertical-align:middle}
.cal-legend i.tk{background:var(--warm)}
.cal-legend i.late{background:var(--stop)}
.dategroup{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--lab);font-weight:600;margin:12px 0 4px}
.dategroup:first-child{margin-top:0}

.btn,button.b{display:block;width:100%;border:0;border-radius:14px;padding:12px;font-size:14px;font-weight:500;cursor:pointer;color:#fff;background:var(--btn);box-shadow:0 8px 18px var(--btn-sh);transition:transform .18s ease}
.btn:active,button.b:active{transform:scale(.985)}
.btn.ghost,.b-alt,.b-quiet{background:rgba(255,255,255,.75);border:1px solid var(--line);color:var(--accent);box-shadow:none}
.b-quiet{color:var(--mut)}
button.b{width:auto;display:inline-block;padding:11px 16px}
.b-sm{padding:8px 12px;font-size:13px}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.rowbtns button.b{flex:1 1 auto}
.mini{border:1px solid var(--line);background:#fff;color:var(--accent);border-radius:8px;padding:5px 9px;font-size:11px;cursor:pointer;white-space:nowrap}
.del{border:0;background:transparent;color:var(--stop);font-size:12px;cursor:pointer;flex:0 0 auto}
.tick{width:26px;height:26px;flex:0 0 26px;border:1.5px solid var(--line);background:#fff;border-radius:50%;cursor:pointer;color:#fff;font-size:14px;line-height:1;padding:0}
.tick.on{background:var(--ok);border-color:var(--ok)}
.empty{color:var(--mut);font-size:13px;padding:8px 0}

.fld,.field{margin-bottom:10px}
.fld label,.field label{display:block;font-size:11px;color:var(--mut);margin-bottom:4px;font-weight:500}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;font-size:16px;background:rgba(255,255,255,.9);color:var(--ink)}
textarea{resize:vertical;min-height:120px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:3px solid var(--days-bg);border-color:var(--head)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.fgrid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 8px}
@media (max-width:420px){.fgrid4{grid-template-columns:repeat(2,1fr)}}
.hint,.small{display:block;font-size:11px;color:var(--mut);margin-top:6px;line-height:1.35}
.infobox{background:var(--days-bg);border:1px solid var(--line);color:var(--accent);border-radius:12px;padding:9px 12px;font-size:12px;margin:10px 0}
.warnbar,.warnbox{background:var(--hot-bg);border:1px solid #E4C3BD;color:var(--stop);border-radius:12px;padding:9px 12px;font-size:12.5px;margin-bottom:12px}
.warnbar ul{margin:6px 0 0;padding-left:18px}
.warnbar li{margin-bottom:3px}
.okbar,.okbox{background:#E7F1EA;border:1px solid #C9DED0;color:#4B7F62;border-radius:12px;padding:9px 12px;font-size:12.5px}

.fab{position:fixed;right:max(16px,calc(50% - 230px));bottom:calc(80px + env(safe-area-inset-bottom));min-height:56px;padding:0 18px;border:0;border-radius:99px;background:var(--fab);color:#fff;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 10px 26px var(--fab-sh);z-index:5}
.fab i{font-style:normal;font-size:19px;line-height:1}
.fab:active{transform:scale(.95)}
.fab[hidden]{display:none}

.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;height:calc(66px + env(safe-area-inset-bottom));padding:0 4px env(safe-area-inset-bottom);display:flex;align-items:center;z-index:6;background:var(--tab-bg,rgba(255,255,255,.94));border-top:1px solid var(--tab-line);box-shadow:0 -10px 28px var(--card-sh);backdrop-filter:blur(18px)}
@media (min-width:600px){.tabs{bottom:22px;border-radius:0 0 33px 33px}}
.tabs button{flex:1;border:0;background:transparent;cursor:pointer;padding:5px 0;font-size:10.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button i{font-style:normal;font-size:18px;opacity:.5}
.tabs button[aria-selected="true"]{color:var(--tab-on);font-weight:600;transform:translateY(-1px)}
.tabs button[aria-selected="true"] i{opacity:1}

.sheet{position:fixed;inset:0;background:var(--sheet-bg);backdrop-filter:blur(4px);display:flex;align-items:flex-end;z-index:20}
.sheet-in{background:#fff;width:100%;max-width:520px;margin:0 auto;border-radius:26px 26px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;box-shadow:0 -18px 50px var(--greet-sh);animation:up .26s ease}
.sheet-in:before{content:'';display:block;width:42px;height:4px;border-radius:99px;background:var(--line);margin:-7px auto 14px}
@keyframes up{from{transform:translateY(50px);opacity:0}to{transform:none;opacity:1}}
.sheet h2,.sheet h3{font-family:'Spectral',serif;font-size:17px;margin:0 0 4px;font-weight:600}
.sheet .close{float:right;background:none;border:0;font-size:18px;color:var(--mut);cursor:pointer;padding:0 4px;margin-top:-4px}
.sheet .small,.sheet .mut{font-size:12px}

.fold{border:1px solid var(--card-border);border-radius:16px;background:var(--card);margin-bottom:12px;padding:0 14px}
.fold summary{list-style:none;cursor:pointer;padding:13px 0;font-size:13px;font-weight:600;color:var(--ink);display:flex;justify-content:space-between;align-items:center}
.fold summary::-webkit-details-marker{display:none}
.fold summary:after{content:'›';color:var(--mut);font-size:18px;transform:rotate(90deg);transition:transform .2s}
.fold[open] summary:after{transform:rotate(-90deg)}
.fold[open] summary{border-bottom:1px solid var(--line)}
.fold .in{padding:10px 0 14px}
.item .txt small{display:block}
.stat.tapline{border-radius:8px;margin:0 -6px;padding-left:6px;padding-right:6px}
.stat.tapline:active{background:var(--ground)}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(8px);bottom:150px;z-index:60;width:min(480px,92%);background:var(--toast);color:#fff;border-radius:12px;padding:11px 14px;font-size:13px;box-shadow:0 12px 28px var(--greet-sh);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}

/* ---------- ХРАНЕНИЕ ---------- */
function load(){
  var raw = null;
  try{ raw = localStorage.getItem(KEY); }catch(e){ storageOk = false; }
  if (raw){ try{ D = JSON.parse(raw); }catch(e){ D = null; } }

  if (!D.settings) D.settings = {};
  delete D.settings.dsKey;
  if (D.settings.proxyUrl === undefined) D.settings.proxyUrl = "";
  if (D.settings.proxyToken === undefined) D.settings.proxyToken = "";
  if (!D.settings.providers) D.settings.providers = {};

    if (!D.settings.providers[pv.id]) D.settings.providers[pv.id] = { on: pv.id === "deepseek", model: pv.model };
  });
  if (!D.settings.defaultProvider) D.settings.defaultProvider = "deepseek";
  D.refs.forEach(function(r){ if (!r.id) r.id = uid("ref"); if (!r.format) r.format = {}; });
  D.items.forEach(function(x){
    if (ORDER.indexOf(x.status) < 0) x.status = "new";
    if (!x.added) x.added = today();
  });
  recountRefs();

}

/* копия проверяется до того, как заменит текущие данные */
function isDateStr(v){
  if (typeof v !== "string") return false;
  var m = v.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return false;
  var d = new Date(+m[1], +m[2]-1, +m[3]);
  return d.getFullYear() === +m[1] && d.getMonth() === +m[2]-1 && d.getDate() === +m[3];
}
function checkItemFormat(fm, n){
  if (!fm) return null;
  if (typeof fm !== "object" || Array.isArray(fm)) return "Повреждено оформление в заявке №" + n;
  var lim = { mTop:[0,100], mRight:[0,100], mBottom:[0,100], mLeft:[0,100], size:[6,72], spacing:[0.5,4], indent:[0,10] };
  for (var q in lim){
    var v = fm[q];
    if (v === "" || v == null) continue;
    if (typeof v !== "number" || !isFinite(v) || v < lim[q][0] || v > lim[q][1])
      return "Недопустимое оформление «" + q + "» в заявке №" + n;
  }
  if (fm.font != null && typeof fm.font !== "string") return "Повреждён шрифт в заявке №" + n;
  return null;
}
/* документ проверяем поштучно: один null в списке разделов роняет редактор */
function checkDoc(doc, n){
  if (!doc) return null;
  if (typeof doc !== "object" || Array.isArray(doc)) return "Повреждён документ в заявке №" + n;
  if (!Array.isArray(doc.order)) return "Повреждён список разделов в заявке №" + n;
  if (!doc.structure || typeof doc.structure !== "object" || Array.isArray(doc.structure))
    return "Повреждены разделы документа в заявке №" + n;
  var ids = {};
  for (var i = 0; i < doc.order.length; i++){
    var c = doc.order[i];
    if (!c || typeof c !== "object" || Array.isArray(c)) return "Повреждён раздел №" + (i+1) + " в заявке №" + n;
    if (typeof c.id !== "string" || !c.id) return "У раздела №" + (i+1) + " нет номера, заявка №" + n;
    if (ids[c.id]) return "Повторяющийся номер раздела «" + c.id + "» в заявке №" + n;
    ids[c.id] = 1;
    if (typeof c.name !== "string") return "У раздела «" + c.id + "» повреждено название, заявка №" + n;
    if (c.pages != null && c.pages !== "" &&
        (typeof c.pages !== "number" || !isFinite(c.pages) || c.pages < 0 || c.pages > 500))
      return "Недопустимый объём раздела «" + c.id + "» в заявке №" + n;
    var sec = doc.structure[c.id];
    if (sec === undefined) return "Нет текста раздела «" + c.id + "» в заявке №" + n;
    if (!sec || typeof sec !== "object" || Array.isArray(sec)) return "Повреждён текст раздела «" + c.id + "», заявка №" + n;
    if (sec.text != null && typeof sec.text !== "string") return "Текст раздела «" + c.id + "» не является текстом, заявка №" + n;
    if (sec.by != null && typeof sec.by !== "string") return "Повреждена пометка автора раздела «" + c.id + "», заявка №" + n;
  }
  if (doc.updated && !isDateStr(doc.updated)) return "Неверная дата правки документа в заявке №" + n;
  return null;
}
function checkSafeIds(value, depth){
  if (depth > 40) return "Слишком сложная структура копии";
  if (!value || typeof value !== "object") return null;
  for (var key of Object.keys(value)) {
    if (["__proto__", "prototype", "constructor"].indexOf(key) >= 0) return "Недопустимое поле копии";
    if (!/^[a-zA-Z0-9_.:-]+$/.test(key)) return "Недопустимое имя поля";
    if (/^(id|wid|refId)$/.test(key) && value[key] != null && value[key] !== "" &&
        (typeof value[key] !== "string" || !/^[a-zA-Z0-9_.:-]{1,128}$/.test(value[key]))) return "Недопустимый идентификатор";
    var bad = checkSafeIds(value[key], depth + 1); if (bad) return bad;
  }
  return null;
}
function checkBackup(o){
  var unsafe = checkSafeIds(o, 0); if (unsafe) return unsafe;
  if (!o || typeof o !== "object" || Array.isArray(o)) return "Это не копия реестра";
  if (!Array.isArray(o.items)) return "В файле нет списка заявок";
  if (o.refs && !Array.isArray(o.refs)) return "Файл повреждён: справочник вузов";
  if (o.settings){
    var ss = o.settings;
    if (typeof ss !== "object" || Array.isArray(ss)) return "Файл повреждён: настройки";
    if (ss.proxyUrl != null && typeof ss.proxyUrl !== "string") return "Повреждён адрес посредника";
    if (ss.proxyUrl && !/^https?:\/\//.test(ss.proxyUrl)) return "Неверный адрес посредника";
    if (ss.defaultProvider != null){
      if (typeof ss.defaultProvider !== "string") return "Повреждён поставщик по умолчанию";
      if (!PROVIDERS.some(function(p){ return p.id === ss.defaultProvider })) return "Неизвестный поставщик по умолчанию";
    }
    if (ss.providers != null){
      if (typeof ss.providers !== "object" || Array.isArray(ss.providers)) return "Повреждён список поставщиков";
      for (var pk in ss.providers){
        if (!PROVIDERS.some(function(p){ return p.id === pk })) return "Неизвестный поставщик «" + pk + "»";
        var pc = ss.providers[pk];
        if (!pc || typeof pc !== "object" || Array.isArray(pc)) return "Повреждены настройки поставщика «" + pk + "»";
        if (pc.model != null && typeof pc.model !== "string") return "Повреждено название модели «" + pk + "»";
        if (pc.on != null && typeof pc.on !== "boolean") return "Повреждён переключатель поставщика «" + pk + "»";
      }
    }
  }
  /* повторяющиеся номера ломают открытие и удаление: item(id) находит первую попавшуюся */
  var refIds = {};
  for (var j0 = 0; o.refs && j0 < o.refs.length; j0++){
    var r0 = o.refs[j0];
    if (!r0 || typeof r0 !== "object" || Array.isArray(r0)) return "Карточка вуза №" + (j0+1) + " повреждена";
    if (typeof r0.id !== "string" || !r0.id) return "У карточки вуза №" + (j0+1) + " нет номера";
    if (refIds[r0.id]) return "Две карточки вуза с одним номером: " + r0.id;
    refIds[r0.id] = 1;
  }
  var itemIds = {};
  for (var i = 0; i < o.items.length; i++){
    var x = o.items[i];
    if (!x || typeof x !== "object" || Array.isArray(x)) return "Заявка №" + (i+1) + " повреждена";
    if (typeof x.id !== "string" || !x.id) return "У заявки №" + (i+1) + " нет номера";
    if (itemIds[x.id]) return "Две заявки с одним номером: " + x.id;
    itemIds[x.id] = 1;
    if (x.refId != null){
      if (typeof x.refId !== "string") return "У заявки №" + (i+1) + " повреждена ссылка на вуз";
      if (x.refId && !refIds[x.refId]) return "Заявка №" + (i+1) + " ссылается на несуществующую карточку вуза";
    }
    if (x.status && ORDER.indexOf(x.status) < 0) return "У заявки №" + (i+1) + " неизвестный статус";
    if (x.added && !isDateStr(x.added)) return "У заявки №" + (i+1) + " неверная дата";
    if (x.deadline && !isDateStr(x.deadline)) return "У заявки №" + (i+1) + " неверный срок";
    var ef = checkItemFormat(x.format, i+1);
    if (ef) return ef;
    var ed = checkDoc(x.doc, i+1);
    if (ed) return ed;
  }
  for (var j = 0; o.refs && j < o.refs.length; j++){
    var r = o.refs[j];
    if (!r || typeof r !== "object" || Array.isArray(r)) return "Карточка вуза №" + (j+1) + " повреждена";
    if (typeof r.univ !== "string") return "У карточки вуза №" + (j+1) + " нет названия";
  }
  return null;
}

/* ---------- ОБЩЕЕ ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c] }); }
function pad2(n){ return n<10 ? "0"+n : ""+n }
function isoLocal(d){ return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }
function parseIso(iso){
  var m = String(iso||"").match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? new Date(+m[1], +m[2]-1, +m[3]) : new Date(iso);
}
function today(){ return isoLocal(new Date()); }
function ruDate(iso){
  if (!iso) return "";
  var M=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  var d=parseIso(iso), now=new Date();
  if (isNaN(d)) return iso;
  return d.getDate()+" "+M[d.getMonth()]+(d.getFullYear()!==now.getFullYear()?" "+d.getFullYear():"");
}
function uid(p){ return p + Math.random().toString(36).slice(2,8) }
function item(id){ return D.items.filter(function(x){ return x.id===id })[0]; }
var toastT;
function toast(t){
  var el=document.getElementById("toast");
  el.textContent=t; el.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(function(){ el.classList.remove("on") },2600);
}
/* копирование асинхронно — сообщаем честный результат */
function copyText(msg){
  function fb(m){
    var ta=document.createElement("textarea");
    ta.value=m; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    var done=false;
    try{ done=document.execCommand("copy"); }catch(e){ done=false; }
    document.body.removeChild(ta);
    toast(done ? "Скопировано" : "Не удалось скопировать — выделите текст вручную");
    return done;
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(msg).then(
      function(){ toast("Скопировано"); return true; },
      function(){ return fb(msg); });
  }
  return Promise.resolve(fb(msg));
}

/* ---------- СПРАВОЧНИК ВУЗОВ ---------- */
var REF_STYLES = { brackets:"квадратные скобки [12]", footnotes:"постраничные сноски", unknown:"не уточнён" };
function seedRefs(){
  var t = today();
  function mk(univ, faculty, kafedra, fmt, refStyle, notes, verified){
    return { id:uid("ref"), univ:univ, faculty:faculty, kafedra:kafedra, format:fmt, refStyle:refStyle,
      notes:notes, verified:!!verified, source:"записи проекта", added:t, updated:t, requests:0 };
  }
  return [
    mk("РАНХиГС", "Институт отраслевого менеджмента, факультет рыночных технологий", "",
      { mTop:20, mRight:15, mBottom:20, mLeft:30, font:"Times New Roman", size:14, spacing:1.5, indent:1.25 }, "brackets",
      "Курсовая: не менее 20 стр. на автора, оригинальность от 70%. Интервал 1,5 в тексте, одинарный в сносках и заголовках. Титульный лист и содержание — по формам приложений 2 и 3 Положения о курсовой работе.", false),
    mk("РАНХиГС", "Волгоградский институт управления, факультет ГМУ", "",
      { mTop:20, mRight:15, mBottom:20, mLeft:20, font:"Times New Roman", size:14, spacing:1.5, indent:1.25 }, "unknown",
      "Левое поле 20 мм — по записям проекта, ПЕРЕПРОВЕРИТЬ по методичке: обычно 30. Титульный лист по форме Приложения 1.", false),
    mk("Московский международный университет", "", "Кафедра экономики и управления",
      { mTop:20, mRight:15, mBottom:20, mLeft:30, font:"Times New Roman", size:14, spacing:1.5, indent:1.25 }, "footnotes",
      "Ссылки — настоящие постраничные сноски (автор, работа, издательство, год, страница), не квадратные скобки. Дисциплина из разобранной методички: «Теория и практика рекламы».", false),
    mk("Столичный бизнес колледж", "", "",
      { mTop:20, mRight:10, mBottom:20, mLeft:30, font:"Times New Roman", size:14, spacing:1.5, indent:1.25 }, "brackets",
      "ВКР: собственный стандарт колледжа. Свой титульный лист, свой порядок группировки источников, приложения без номеров страниц. Правое поле 10 мм.", false)
  ];
}
function normKey(s){ return String(s||"").toLowerCase().replace(/[«»"']/g,"").replace(/\s+/g," ").trim(); }
function refKey(r){ return normKey(r.univ) + "|" + normKey(r.faculty) + "|" + normKey(r.kafedra); }
function refById(id){ return (D.refs||[]).filter(function(r){ return r.id===id })[0]; }
function findRef(x){
  if (!x.univ) return null;
  var key = refKey(x);
  return D.refs.filter(function(r){ return refKey(r) === key })[0] || null;
}
function findTwin(rec){
  var st = normKey(rec.student), tp = normKey(rec.topic), un = normKey(rec.univ);
  if (!st && !tp) return null;
  return D.items.filter(function(x){
    if (x.id === rec.id) return false;
    return normKey(x.student) === st && normKey(x.topic) === tp && normKey(x.univ) === un;
  })[0] || null;
}
function mergeInto(target, rec){
  var keepId = target.id, keepStatus = target.status, keepNote = target.note, keepDoc = target.doc, keepAdded = target.added;
  for (var k in rec) target[k] = rec[k];
  target.id = keepId; target.status = keepStatus; target.note = keepNote;
  target.doc = keepDoc; target.added = keepAdded;   /* дата первой заявки не меняется */
  target.updatedAt = today();
  return target;
}
var FMT_FIELDS = [["mLeft","лево, мм"],["mRight","право, мм"],["mTop","верх, мм"],["mBottom","низ, мм"],["font","шрифт"],["size","кегль"],["spacing","интервал"],["indent","отступ, см"]];
function fmtDiff(a, b){
  var out = [];
  FMT_FIELDS.forEach(function(f){
    var va = a && a[f[0]], vb = b && b[f[0]];
    if (va == null || vb == null || va === "" || vb === "") return;
    if (String(va).trim().toLowerCase() !== String(vb).trim().toLowerCase()) out.push({ k:f[0], label:f[1], ref:vb, req:va });
  });
  return out;
}
function fmtShort(f){
  if (!f || f.mLeft == null) return "оформление не задано";
  var font = (f.font || "").replace("Times New Roman","TNR");
  return f.mLeft + "/" + f.mRight + "/" + f.mTop + "/" + f.mBottom + " мм · " + font + " " + (f.size||"") + " · " + (f.spacing||"");
}
function fmtLine(f){
  if (!f || f.mLeft == null) return "не задано";
  return "поля " + f.mLeft + "/" + f.mRight + "/" + f.mTop + "/" + f.mBottom + " мм · " + (f.font||"") + " " + (f.size||"") + " · интервал " + (f.spacing||"") + " · отступ " + (f.indent||"") + " см";
}
/* заявка пришла — записываем вуз в справочник или сверяем с ним */
/* счётчик считаем по фактическому числу заявок, а не прибавлением:
   при повторном приёме той же заявки прибавление накручивало лишнее */
function countRequests(refId){
  return D.items.filter(function(it){ return it.refId === refId }).length;
}
function recountRefs(){
  (D.refs || []).forEach(function(r){ r.requests = countRequests(r.id); });
}
function refIntake(x){
  if (!x.univ) return;
  var r = findRef(x);
  if (!r){
    r = { id:uid("ref"), univ:x.univ, faculty:x.faculty||"", kafedra:x.kafedra||"",
      format:JSON.parse(JSON.stringify(x.format||{})), refStyle:"unknown",
      notes:(x.methodNotes ? "Из заявки: " + x.methodNotes : ""), verified:false,
      source:"заявка " + (x.student||"") , added:today(), updated:today(), requests:0 };
    D.refs.unshift(r);
    x.refId = r.id; x.refNew = true;
  } else {
    x.refId = r.id; x.refNew = false;
  }
  recountRefs();
}

/* ---------- ЗАГОТОВКА ЗАПРОСА ---------- */
function buildPrompt(x){

  var refs = "";
  var L = [];
  L.push("Ты помогаешь студенту подготовить черновик учебной работы. Нужен обоснованный связный черновик для проверки исполнителем и дальнейшей работы студента.");
  L.push("");
  L.push("РАБОТА");
  if (x.workType) L.push("Вид работы: " + x.workType);
  if (x.topic) L.push("Тема: " + x.topic);
  if (x.discipline) L.push("Дисциплина: " + x.discipline);
  if (x.univ) L.push("Вуз: " + x.univ);
  if (x.faculty) L.push("Факультет: " + x.faculty);
  if (x.kafedra) L.push("Кафедра: " + x.kafedra);
  if (x.program) L.push("Направление подготовки: " + x.program);
  var packet=DraftQuality.inputs(x);
  if (packet.requirements) L.push("Требования: " + packet.requirements);
  if (packet.organization){ L.push(""); L.push("ОРГАНИЗАЦИЯ ИЛИ ОБЪЕКТ ИССЛЕДОВАНИЯ"); L.push(packet.organization); }

  L.push("");
  L.push("СТРУКТУРА");
  L.push("[вписать главы и параграфы из задания]");
  L.push("");
  L.push("КАК ПИСАТЬ");
  L.push("— Пиши цельным текстом, а не тезисами: каждый параграф — законченный связный фрагмент.");
  L.push("— Академический стиль, без канцелярита и без воды ради объёма.");
  L.push("— Абзацы 4–8 предложений, каждый с одной мыслью.");
  L.push("");

var PROVIDERS = [
  { id:"deepseek",  name:"DeepSeek",  model:"deepseek-chat",     note:"дешёвый, оплата зарубежная" },
  { id:"gigachat",  name:"GigaChat",  model:"GigaChat",          note:"Сбер, рубли, есть бесплатный запас" },

  { id:"anthropic", name:"Claude",    model:"claude-sonnet-5",   note:"оплата зарубежная" }
];
/* считать всё, что вписано в форму настроек, до перерисовки экрана */
function readProviderForm(){
  var stg = D.settings, u = document.getElementById("pxUrl"), t = document.getElementById("pxTok"), df = document.getElementById("pxDef");
  if (u) stg.proxyUrl = u.value.trim().replace(/\/+$/, "");
  if (t) stg.proxyToken = t.value.trim();
  if (df) stg.defaultProvider = df.value;
  document.querySelectorAll("[data-pvmodel]").forEach(function(inp){
    var pid = inp.getAttribute("data-pvmodel");
    stg.providers[pid] = stg.providers[pid] || {};
    stg.providers[pid].model = inp.value.trim();
  });
}
function providerName(id){ var p = PROVIDERS.filter(function(q){ return q.id === id })[0]; return p ? p.name : id; }
/* нейросеть готова, только если настроен посредник И отмечен хотя бы один поставщик */
function aiReady(){
  var st = D.settings || {};
  return !!(st.proxyUrl && st.proxyToken && activeProviders().length);
}
function activeProviders(){
  return PROVIDERS.filter(function(pv){ return (D.settings.providers[pv.id] || {}).on; });
}
/* meta: { section, stage, attempt } — какой раздел и на каком шаге.
   В журнал попадают только метки и числа: ни текста запроса, ни ответа. */
function askAI(providerId, system, user, meta){
  var clientRequestId = crypto.randomUUID();
  var st = D.settings, cfg = st.providers[providerId] || {};
  var url = (st.proxyUrl || "").trim();
  meta = Object.assign({}, meta || {}, {client_request_id: clientRequestId});
  if (url){
    var data = D, started = Date.now(), phase = 'connect', status = 0, detail = null;
    var controller = new AbortController();
    var timer = setTimeout(function(){ controller.abort(); }, 195000);
    return Promise.resolve().then(function(){return fetch(url, {
      method:"POST", signal:controller.signal,
      headers:{ "Content-Type":"application/json", "X-Proxy-Token": st.proxyToken || "" },
      body: JSON.stringify({ client_request_id: clientRequestId, provider: providerId, model: cfg.model || "", system: system, user: user, max_tokens: 8000, temperature: 0.2, keepalive:true })
    });}).then(function(r){
      phase = 'body'; status = r.status;
      return r.json().catch(function(e){ if(e.name === "AbortError" || /Failed to fetch|NetworkError|Load failed/i.test(e.message||""))throw e; throw new Error("HTTP:proxy:" + r.status); }).then(function(j){
        if (j && j.detail) detail = j.detail;
        if (!r.ok) throw new Error(j && j.error || "HTTP:proxy:" + r.status);
        return j;
      });
    }).then(function(j){
      if (j && j.detail) detail = j.detail;
      if (j.error) throw new Error(j.error);
      if (j.complete === false) throw new Error("INCOMPLETE:" + providerId);
      if (!j.text) throw new Error("EMPTY:" + providerId);
      /* удачный ответ тоже запоминаем, если подошли близко к пределу:
         по этому видно, что раздел вот-вот перестанет помещаться */
      if (D === data) writeDiag(data, providerId, meta, 'body', status, Math.round((Date.now()-started)/1000), detail && Number(detail.limit_tokens)>0 && Number(detail.completion_tokens)>=Number(detail.limit_tokens)*0.9 ? 'NEAR_LIMIT' : 'SUCCESS', detail, system, user);
      return { text: j.text, tokens: j.tokens || 0, provider: j.provider || providerId };
    }).catch(function(e){
      var elapsed = Math.round((Date.now()-started)/1000);
      var network = /Failed to fetch|NetworkError|Load failed/i.test(e.message||'');
      /* раньше любая ошибка сводилась к «RESPONSE» и причина терялась;
         теперь берём точный код посредника, когда он есть */
      var upstream = safeCode(e && e.message);
      var code = controller.signal.aborted ? 'CLIENT_TIMEOUT' : network ? 'NETWORK' : (upstream || 'RESPONSE');
      if (D === data) writeDiag(data, providerId, meta, phase, status, elapsed, code, detail, system, user);
      if(code === 'CLIENT_TIMEOUT' || code === 'NETWORK')throw Error(code+':'+phase+':'+elapsed);
      throw e;
    }).finally(function(){clearTimeout(timer);});
  }
  return Promise.reject(new Error("NOPROXY"));
}
/* Код посредника вида INCOMPLETE:deepseek или HTTP:proxy:502 — только метки. */
function safeCode(m){
  m = String(m || "");
  return /^(NOKEY|AUTH|PAY|RATE|HTTP|EMPTY|INCOMPLETE|TIMEOUT|UPSTREAM|CONTEXT_TOO_BIG|TOO_BIG|TOKEN|NOTOKEN_SERVER|BAD_JSON|BAD_REQUEST|UNKNOWN_PROVIDER|UNKNOWN_MODEL)(:[a-zA-Z0-9_-]+)*$/.test(m) ? m.slice(0, 60) : "";
}
/* Одна запись журнала. Только метки и числа: тексты сюда попасть не могут. */
function writeDiag(data, providerId, meta, phase, status, seconds, code, detail, system, user){
  var rec = {
    at: new Date().toISOString(),
    client_request_id: meta.client_request_id,
    provider: providerId,
    section: String((meta && meta.section) || "").slice(0, 24),
    stage: String((meta && meta.stage) || "").slice(0, 16),
    attempt: Number((meta && meta.attempt) || 1),
    phase: phase, status: status, seconds: seconds, code: code,
    chars: (String(system || "").length + String(user || "").length)
  };
  if (detail && typeof detail === "object"){
    ["reason","model","request_id"].forEach(function(k){
      if (typeof detail[k] === "string" && /^[A-Za-z0-9_\-.]{1,40}$/.test(detail[k])) rec[k] = detail[k];
    });
    ["prompt_tokens","completion_tokens","limit_tokens"].forEach(function(k){
      if (Number.isFinite(Number(detail[k]))) rec[k] = Math.round(Number(detail[k]));
    });
  }
  var log = Array.isArray(data.aiDiagnostics) ? data.aiDiagnostics : [];
  data.aiDiagnostics = log.slice(-39).concat([rec]);
  save();
}
/* Человеческая расшифровка записи журнала. */
function diagLine(r){
  var when = r.at ? new Date(r.at).toLocaleString("ru-RU") : "";
  var what = { SUCCESS:"ответ получен", NEAR_LIMIT:"почти упёрлись в предел ответа", CLIENT_TIMEOUT:"истекло время ожидания",
    NETWORK:"связь прервалась", RESPONSE:"ответ не разобран" }[r.code] || r.code || "";
  if (String(r.code).indexOf("INCOMPLETE:") === 0)
    what = r.reason === "length" ? "ответ обрезан по пределу длины"
         : r.reason === "insufficient_system_resource" ? "у поставщика не хватило ресурсов"
         : "ответ не завершён" + (r.reason ? " (" + r.reason + ")" : "");
  if (String(r.code).indexOf("PAY:") === 0) what = "поставщик отклонил запрос по оплате";
  if (String(r.code).indexOf("RATE:") === 0) what = "слишком часто, поставщик просит подождать";
  if (String(r.code).indexOf("AUTH:") === 0) what = "поставщик не принял ключ";
  var where = r.section ? "раздел " + r.section : "";
  if (r.stage) where += (where ? ", " : "") + (r.stage === "revision" ? "редактура" : "черновик");
  var nums = [];
  if (r.seconds != null) nums.push(r.seconds + " с");
  if (r.chars) nums.push(Math.round(r.chars/1000) + " тыс. знаков запроса");
  if (r.completion_tokens != null) nums.push("ответ " + r.completion_tokens + (r.limit_tokens ? " из " + r.limit_tokens : "") + " токенов");
  return [when, where, what, nums.join(" · ")].filter(Boolean).join(" — ");
}
function aiErrorText(e){
  var m = (e && e.message) || "", who = m.split(":")[1] || "";
  var nm = who ? providerName(who) : "";
  if (/^(CLIENT_TIMEOUT|NETWORK):/.test(m)) {
    var parts=m.split(':');
    return (parts[0]==='CLIENT_TIMEOUT'?'Истекло время ожидания ответа':'Соединение прервалось')+' через '+parts[2]+' с. '+(parts[1]==='body'?'Посредник ответил, но полный результат не получен.':'Ответ посредника не получен.')+' Причина записана в копию данных. Автоматического повторного запроса не было.';
  }
  if (m === "NOPROVIDER") return "Не выбран поставщик: «Ещё» → «Нейросети», отметьте хотя бы одного.";
  if (m === "NOPROXY") return "Посредник не настроен: Ещё → Нейросети.";
  if (m === "CONTEXT_TOO_BIG" || m === "TOO_BIG") return "Материалы и предыдущие разделы превышают допустимый объём запроса. Ничего не обрезано. Сократите материалы, сохранив нужные факты, и повторите подготовку.";
  if (m.indexOf("INCOMPLETE:") === 0) return "Нейросеть не завершила раздел. Незавершённый ответ не заменил сохранённый текст. Уменьшите объём раздела или разделите его на подразделы и повторите подготовку.";
  if (m.indexOf("TIMEOUT:") === 0) return "Нейросеть не ответила за три минуты. Сохранённые разделы доступны; повторный запуск продолжит подготовку с остановленного раздела.";
  if (m.indexOf("UPSTREAM:") === 0) return "Посредник не получил корректный ответ нейросети. Сохранённый текст не заменён. Повторите подготовку позже.";
  if (m === "TOKEN") return "Посредник не принял пароль — проверьте, что он одинаковый здесь и в настройках посредника.";
  if (m === "NOTOKEN_SERVER") return "У посредника не задан PROXY_TOKEN в настройках.";
  if (m.indexOf("NOKEY:") === 0) return "У посредника нет ключа для " + nm + " — добавьте его в настройках воркера.";
  if (m.indexOf("AUTH:") === 0) return nm + " не принял ключ.";
  if (m.indexOf("PAY:") === 0) return "У " + nm + " закончились деньги на счёте.";
  if (m.indexOf("RATE:") === 0) return nm + " просит подождать — слишком много запросов подряд.";
  if (m.indexOf("EMPTY:") === 0) return nm + " вернул пустой ответ, попробуйте ещё раз.";
  if (m.indexOf("UNKNOWN_PROVIDER") === 0) return "Посредник не знает такого поставщика.";
  if (m.indexOf("HTTP:") === 0) return "Ошибка связи (" + m.replace("HTTP:","") + ").";
  return dsErrorText(e);
}

function b64dec(s){
  s = s.replace(/-/g,"+").replace(/_/g,"/");
  while (s.length % 4) s += "=";
  var bin = atob(s), out = "";
  for (var i=0; i<bin.length; i++) out += "%" + ("0" + bin.charCodeAt(i).toString(16)).slice(-2);
  return decodeURIComponent(out);
}

  fields.forEach(function(k){
    if (rec[k] != null && (typeof rec[k] !== "string" || rec[k].length > 20000)) throw new Error("bad field");
  });
  if (!rec.topic || !rec.topic.trim() || checkBackup({items:[rec], refs:[]})) throw new Error("bad request");
  return rec;
}
function fromPayload(p){
  if (!p || typeof p !== "object" || Array.isArray(p) || checkSafeIds(p, 0)) throw new Error("bad payload");
  if (p.fm != null && (typeof p.fm !== "object" || Array.isArray(p.fm))) throw new Error("bad format");
  var f = p.fm || {};
  return validateRequest({
    id: p.id || uid("rq"),

    univ: p.u || "", faculty: p.fc || "", kafedra: p.kf || "", city: p.ct || "",
    student: p.n || "", group: p.g || "", supervisor: p.s || "",
    program: p.pr || "", form: p.fo || "", course: p.co || "",
    deadline: p.dl || "", requirements: p.rq || "",

    format: { mTop:f.mt, mRight:f.mr, mBottom:f.mb, mLeft:f.ml,

function intake(){
  var h = location.hash || "";
  var m = h.match(/#z=(.+)$/);
  if (!m) return null;
  try{
    var p = JSON.parse(b64dec(m[1]));
    if (!p || !p.t) throw new Error("bad");
    var rec = fromPayload(p);
    /* по ссылке обновляем только точное совпадение номера: у двух разных работ
       одного студента может совпасть тема, а спросить через ссылку не у кого */
    var exist = item(rec.id);
    if (exist){
      /* повторная отправка: обновляем данные, но сохраняем статус, заметку, документ и дату поступления */
      mergeInto(exist, rec);
      exist.refId = null; refIntake(exist);
      var okA = save(); return { rec:exist, updated:true, stored:okA };
    }
    D.items.unshift(rec); refIntake(rec);
    var okB = save();
    return { rec:rec, updated:false, stored:okB };
  }catch(e){ return { error:true }; }
  finally{
    history.replaceState(null, "", location.pathname + location.search);
  }
}

/* «поля 30/15/20/20 мм (лево/право/верх/низ), Times New Roman 14, интервал 1.5, отступ 1.25 см» */
function parseFormatText(str){
  var f = {}, t = String(str||"");
  var m = t.match(/(\d{1,3})\s*\/\s*(\d{1,3})\s*\/\s*(\d{1,3})\s*\/\s*(\d{1,3})/);
  if (m){ f.mLeft = +m[1]; f.mRight = +m[2]; f.mTop = +m[3]; f.mBottom = +m[4]; }
  var fn = t.match(/(?:мм[^,]*,|^)\s*([A-Za-zА-Яа-яЁё][A-Za-zА-Яа-яЁё\s]*?)\s+(\d{1,2})(?:\s*(?:пт|pt))?\s*(?:,|$)/);
  if (fn){ f.font = fn[1].trim(); f.size = +fn[2]; }
  var sp = t.match(/интервал\s*([\d]+(?:[.,]\d+)?)/i);
  if (sp) f.spacing = parseFloat(sp[1].replace(",", "."));
  var ind = t.match(/отступ\s*([\d]+(?:[.,]\d+)?)/i);
  if (ind) f.indent = parseFloat(ind[1].replace(",", "."));
  return f;
}
function parseText(text){
  var rec = { id:uid("rq"), added:today(), status:"new", format:{}, note:"" };
  var found = 0, current = null;
  String(text).replace(/\r\n?/g, "\n").split("\n").forEach(function(line){
    // Two spaces mark a continuation in messages produced by the cabinet.
    if (current && /^  /.test(line)) { rec[current] += "\n" + line.slice(2); return; }
    var m = line.match(/^\s*([^:]{3,40}):\s*(.*)$/);
    var key = m && Object.prototype.hasOwnProperty.call(LABELS, m[1].trim()) ? LABELS[m[1].trim()] : null;
    if (/^\s*Ссылка для реестра:/.test(line)) { current = null; return; }
    if (!key){ if (current) rec[current] += "\n" + line; return; }
    current = key;
    var val = m[2].trim();
    if (key === "deadline"){
      var iso = val.match(/(\d{4}-\d{2}-\d{2})/);
      rec.deadline = iso ? iso[1] : val;
      current = null;
    } else if (key === "formatText"){
      rec.formatText = val;
      var pf = parseFormatText(val);
      for (var fk in pf) rec.format[fk] = pf[fk];
      current = null;
    } else rec[key] = val;
    found++;
  });
  Object.keys(rec).forEach(function(k){ if (typeof rec[k] === "string") rec[k] = rec[k].trim(); });
  try { return found >= 2 ? validateRequest(rec) : null; } catch(e) { return null; }
}


var CRC_TABLE = (function(){
  var c, t = [];
  for (var n=0; n<256; n++){
    c = n;
    for (var k=0; k<8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes){
  var c = 0xFFFFFFFF;
  for (var i=0; i<bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function makeZip(files){
  var enc = new TextEncoder(), parts = [], central = [], offset = 0;
  files.forEach(function(f){
    var name = enc.encode(f.name), data = enc.encode(f.text);
    var crc = crc32(data), len = data.length;
    var lh = new Uint8Array(30 + name.length), dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true); dv.setUint16(6, 0x0800, true);
    dv.setUint16(8, 0, true); dv.setUint16(10, 0, true); dv.setUint16(12, 0, true);
    dv.setUint32(14, crc, true); dv.setUint32(18, len, true); dv.setUint32(22, len, true);
    dv.setUint16(26, name.length, true); dv.setUint16(28, 0, true);
    lh.set(name, 30);
    parts.push(lh, data);
    var ch = new Uint8Array(46 + name.length), cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true); cv.setUint16(6, 20, true); cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true); cv.setUint16(12, 0, true); cv.setUint16(14, 0, true);
    cv.setUint32(16, crc, true); cv.setUint32(20, len, true); cv.setUint32(24, len, true);
    cv.setUint16(28, name.length, true); cv.setUint16(30, 0, true); cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true); cv.setUint16(36, 0, true); cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    ch.set(name, 46);
    central.push(ch);
    offset += lh.length + len;
  });
  var cdSize = central.reduce(function(a,b){ return a + b.length }, 0);
  var end = new Uint8Array(22), ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true); ev.setUint16(6, 0, true);
  ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true); ev.setUint16(20, 0, true);
  return new Blob(parts.concat(central).concat([end]),
    { type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
}

async function receiveInbox() {

  inboxBusy=true;
  var expectedData=D, received=[], cursor=0;
  var match=location.hash.match(/^#request=([a-f0-9-]{36})$/);
  try {
    do {
      var result=await Oblako.requestApi({action:"inbox",after:cursor,id:match?match[1]:undefined});
      if(D!==expectedData) throw new Error("Реестр изменился. Повторите получение заявок");
      if(!Array.isArray(result.rows))throw new Error("Не удалось прочитать входящие");

        var rec=fromPayload(Object.assign({},row.payload,{id:row.id}));
        rec.requestNumber=row.number;received.push(rec);
      });
      cursor=result.next;
    } while(cursor && !match);
    var count=0;
    received.forEach(function(rec){if(!item(rec.id)){D.items.unshift(rec);refIntake(rec);count++;}});
    var stored=save();
    if(match && item(match[1])){openId=match[1];tab="list";}

function readRefForm(r){

  r.univ = v("rfUniv") || r.univ; r.faculty = v("rfFac"); r.kafedra = v("rfKaf");
  r.format = { mLeft:n("rfL"), mRight:n("rfR"), mTop:n("rfT"), mBottom:n("rfB"), font:v("rfFont"), size:n("rfSize"), spacing:n("rfSp"), indent:n("rfInd") };

var cloudGuestCandidate = null;
var cloudInitialSnapshot = null;
var cloudNote = "";           /* короткая строка состояния для экрана */

function cloudSwitchUser(id){
  var target = id ? CLOUD_LOCAL_KEY + ":user:" + id :
    (localStorage.getItem(CLOUD_LOCAL_KEY + ":scoped") ? CLOUD_LOCAL_KEY + ":guest" : CLOUD_LOCAL_KEY);
  cloudGuestCandidate = null;
  var freshAccount = id && localStorage.getItem(target) === null;
  if (id && localStorage.getItem(target) === null && KEY === CLOUD_LOCAL_KEY + ":guest" && !cloudIsEmpty(D)) cloudGuestCandidate = JSON.parse(JSON.stringify(D));
  var legacy = localStorage.getItem(CLOUD_LOCAL_KEY);
  if (id && legacy !== null && localStorage.getItem(target) === null) {
    localStorage.setItem(target, legacy);
    localStorage.setItem(CLOUD_LOCAL_KEY + ":scoped", "1");
    localStorage.setItem(CLOUD_LOCAL_KEY + ":legacy-backup", legacy);
    localStorage.removeItem(CLOUD_LOCAL_KEY);
  }
  if (id) localStorage.setItem(CLOUD_LOCAL_KEY + ":scoped", "1");
  localStorage.setItem(CLOUD_LOCAL_KEY + ":active-user", id || "");
  KEY = target; D = null;
  if (typeof undoStack !== "undefined") { undoStack = []; redoStack = []; }
  if (typeof openId !== "undefined") { openId = null; openRefId = null; }
  load(); render();
  cloudInitialSnapshot = freshAccount && legacy === null ? Oblako.snapshot(D) : null;
}

function cloudInit(){
  if (!window.Oblako) return;
  Oblako.init({
    app: CLOUD_APP,
    getData: function(){ return D; },
    switchUser: cloudSwitchUser,
    onAccountChange: cloudFirstPull,
    onChange: function(){ cloudPaint(); },
    onConflict: function(res){ cloudConflict(res); }
  }).then(function(){
    if (Oblako.mode === "cloud") cloudFirstPull();
  });
}

function cloudSave(message, overwrite){
  return Oblako.push(D, !!overwrite).then(function(r){
    cloudPaint();
    if (r.status === "ok") toast(message);
    else if (r.status === "conflict") cloudConflict(r);
    else toast(r.error || "Запись не завершена. Данные остались на устройстве");
    return r;
  });
}
function cloudFirstPull(){ return CloudUI.sync(); }
function cloudConflict(){ toast("Обнаружены изменения на другом устройстве. Откройте хранение записей и нажмите «Синхронизировать»"); }
function cloudApply(remote){
  Oblako.pause();
  var bad = checkBackup(remote);
  if (bad){ toast("Записи в базе повреждены: " + bad); return false; }
  var next = JSON.parse(JSON.stringify(remote));
  if (next.settings) { delete next.settings.proxyToken; delete next.settings.dsKey; }
  if (CLOUD_APP === "reestr") {
    next.settings = next.settings || {};
    next.settings.proxyToken = (D.settings || {}).proxyToken || "";
  }
  try { localStorage.setItem(KEY, JSON.stringify(next)); }
  catch(e) { toast("Не удалось сохранить на устройстве. Загрузка отменена"); return false; }
  D = next; load(); render(); Oblako.pause(); Oblako.accept(D);
  return true;
}

function cloudPaint(){ CloudUI.paint(); }

function cloudHasLocal(){ return !!(D && Object.keys(D).length); }
function cloudIsEmpty(x){
  if(!x)return true;
  if(["works","tasks","events","items","refs","templates"].some(function(k){return (x[k]||[]).length;}))return false;
  return !["name","contact","univ","faculty","department","group","course","city"].some(function(k){return x.settings && x.settings[k];});
}

/* окно входа */

    '<p class="hint">Первый вход без Google — по персональной ссылке от исполнителя. Если вы уже пользуетесь «Точкой дня», используйте ту же почту и пароль.</p>' +
    '<details><summary>Забыли пароль?</summary><p class="hint">Если входили через Google, воспользуйтесь им и задайте пароль в настройках аккаунта. Иначе запросите у исполнителя персональную ссылку восстановления. Письмо автоматически не отправляется. Не сообщайте никому свой пароль.</p></details>' +
    '<div id="clMsg" class="hint" role="status" aria-live="polite"></div>' +
    '<div class="rowbtns"><button type="button" class="btn ghost" data-google="1">Войти через Google</button></div>');
  var busy = false;

function openInvitation(recovery){
  var identity=Oblako.identity();
  var w=openModal('<button class="close" data-x="1" aria-label="Закрыть приглашение">✕</button><h3>'+ (recovery?'Восстановить доступ':'Пригласить студента') +'</h3>'+(recovery?'<p class="hint">Сначала лично подтвердите владельца аккаунта. Ссылка позволит сменить общий пароль кабинета и «Точки дня».</p>':'<p class="hint" id="inviteIntro">Укажите только почту студента. Пароль он задаст самостоятельно. Мы подготовим сообщение со ссылкой и инструкцией — вы выберете, кому и через какой мессенджер его отправить.</p>')+'<form id="inviteForm"><div class="fld"><label for="inviteEmail">Почта студента</label><input type="email" id="inviteEmail" autocomplete="off" required></div>'+(recovery?'<label><input type="checkbox" id="identityVerified" required> Личность владельца аккаунта подтверждена</label>':'')+'<button class="btn" type="submit">'+(recovery?'Подготовить восстановление':'Подготовить приглашение')+'</button></form><p class="hint" id="inviteMsg" role="status"></p><section id="inviteResult" hidden><p class="hint">Ссылка и инструкция уже вместе. Отправьте сообщение только указанному студенту.</p><label for="inviteMessage">Текст для студента</label><textarea id="inviteMessage" readonly rows="9" style="width:100%;min-height:220px;overflow-wrap:anywhere" aria-label="Текст приглашения"></textarea><div class="rowbtns"><button class="btn" type="button" id="inviteShare">Поделиться приглашением</button><button class="btn ghost" type="button" id="inviteCopy">Скопировать приглашение</button></div><p class="hint" id="inviteShareStatus" role="status" aria-live="polite"></p></section>');
  w.dataset.invitationIdentity=identity;
  var busy=false,output=w.querySelector('#inviteMessage'),result=w.querySelector('#inviteResult');
  w.querySelector('#inviteForm').addEventListener('submit',async function(e){
    e.preventDefault();if(busy)return;busy=true;
    var btn=this.querySelector('button'),emailInput=w.querySelector('#inviteEmail'),msg=w.querySelector('#inviteMsg');
    var email=emailInput.value.trim().toLowerCase();btn.disabled=true;emailInput.readOnly=true;result.hidden=true;output.value='';w.querySelector('#inviteShareStatus').textContent='';msg.textContent='Готовим сообщение…';
    try{
      var r=await Oblako.requestApi({action:recovery?'recover':'invite',identityVerified:recovery&&w.querySelector('#identityVerified').checked,email:email});
      if(!w.isConnected||identity!==Oblako.identity())return;
      if(r.missing){msg.textContent='Аккаунт не найден. Проверьте почту; для нового студента создайте приглашение.';return;}
      if(!r.existing&&!r.url)throw Error('Не удалось подготовить приглашение');
      output.value=Onboarding.invitationMessage(email,r.url,r.existing?'existing':recovery?'recovery':'new');
      result.hidden=false;w.querySelector('#inviteForm').hidden=true;w.querySelector('h3').textContent=recovery?'Сообщение для восстановления готово':'Приглашение готово';var intro=w.querySelector('#inviteIntro');if(intro)intro.remove();
      msg.textContent=r.existing?'Аккаунт уже существует. Подготовлена инструкция для входа; пароль не изменён.':'Готово для '+email+'. Сообщение ещё не отправлено.';
      output.focus();output.setSelectionRange(0,0);output.scrollTop=0;
    }catch(err){msg.textContent=err.message||'Не удалось подготовить приглашение';}
    finally{busy=false;btn.disabled=false;emailInput.readOnly=false;}
  });
  w.querySelector('#inviteShare').onclick=async function(){
    var status=w.querySelector('#inviteShareStatus');if(!output.value||identity!==Oblako.identity())return;
    if(!navigator.share){status.textContent='На этом устройстве используйте «Скопировать приглашение» и вставьте сообщение в переписку со студентом.';return;}
    try{await navigator.share({title:'Кабинет студента',text:output.value});status.textContent='Проверьте в выбранном мессенджере, что сообщение отправлено нужному студенту.';}
    catch(err){status.textContent=err.name==='AbortError'?'Отправка отменена. Можно попробовать снова.':'Не удалось открыть отправку. Используйте «Скопировать приглашение».';}
  };
  w.querySelector('#inviteCopy').onclick=async function(){
    if(!output.value||identity!==Oblako.identity())return;
    try{await navigator.clipboard.writeText(output.value);w.querySelector('#inviteShareStatus').textContent='Приглашение с инструкцией скопировано. Вставьте его в личное сообщение студенту.';}
    catch{output.focus();output.select();w.querySelector('#inviteShareStatus').textContent='Автоматическое копирование недоступно. Скопируйте выделенный текст и вставьте в переписку.';}
  };
}

function openModal(html){
  var wrap = document.createElement("div");
  wrap.className = "sheet";
  wrap.innerHTML = '<div class="sheet-in">' + html + '</div>';
  document.body.appendChild(wrap);
  wrap.addEventListener("click", function(ev){
    if (ev.target === wrap){ wrap.remove(); return; }
    if (ev.target.closest("[data-x]")) wrap.remove();
  });
  return wrap;
}

/* ---------- ДЕЙСТВИЯ ---------- */
document.addEventListener("input", function(ev){
  if (ev.target.id === "q"){
    query = ev.target.value; var p = ev.target.selectionStart, v = ev.target.value; render();
    var el = document.getElementById("q");
    if (el){ el.focus(); el.value = v; try{ el.setSelectionRange(p,p) }catch(e){} }
  }
});
document.addEventListener("change", function(ev){
  var el = ev.target;
  if (el.tagName === "SELECT" && el.getAttribute("data-act") === "status"){
    var x = item(el.getAttribute("data-id")); if (!x) return;
    x.status = el.value; var okk = save(); render(); toast(okk ? "Статус: " + STATUS[x.status] : "Не сохранено: браузер не разрешает хранение");
  }
});
document.addEventListener("keydown", function(ev){
  if (ev.key === "Escape"){ var m = document.querySelector(".sheet"); if (m) m.remove(); }
});
document.addEventListener("click", function(ev){
  var el = ev.target.closest ? ev.target.closest("[data-act],[data-tab]") : null;
  if (!el || el.tagName === "SELECT") return;
  var tb = el.getAttribute("data-tab");
  if (tb){ tab = tb; openId = null; openRefId = null; return render(); }
  var act = el.getAttribute("data-act"), id = el.getAttribute("data-id");
  if (act === "receive-inbox") return receiveInbox();

  if (act === "diag-copy"){
    var lg = (D.aiDiagnostics||[]);
    if (!lg.length) return toast("Журнал пуст");
    copyText(lg.map(function(r){ return diagLine(r) + "  |  " + JSON.stringify(r); }).join("\n"));
    return;
  }
  if (act === "diag-clear"){
    if (!confirm("Очистить журнал подготовки?")) return;
    D.aiDiagnostics = []; save(); render(); toast("Журнал очищен"); return;
  }
  if (act === "cloud") return openCloud();
  if (act === "go-filter"){ tab = "list"; openId = null; filter = el.getAttribute("data-k"); query = ""; return render(); }
  if (act === "go-refs"){ tab = "refs"; openRefId = null; return render(); }
  if (act === "back"){ openId = null; return render(); }
  if (act === "ref-back"){ openRefId = null; return render(); }
  if (act === "ref-open"){ tab = "refs"; openRefId = id; openId = null; return render(); }
  if (act === "open-from-ref"){ tab = "list"; openId = id; openRefId = null; return render(); }
  if (act === "ref-new") return newRef();
  if (act === "ref-save"){ var rr = refById(id); if (!rr) return; readRefForm(rr); var ok4 = save(); render(); toast(ok4 ? "Сохранено" : "Не сохранено: браузер не разрешает хранение"); return; }
  if (act === "ref-delete"){
    if (!confirm("Удалить карточку вуза? Заявки останутся.")) return;
    D.refs = D.refs.filter(function(r){ return r.id !== id }); D.items.forEach(function(x){ if (x.refId === id) delete x.refId; });
    var ok6 = save(); openRefId = null; render(); toast(ok6 ? "Карточка удалена" : "Не сохранено: браузер не разрешает хранение"); return;
  }
  if (act === "ref-accept"){
    var xx = item(id); if (!xx) return;
    var rr2 = xx.refId ? refById(xx.refId) : findRef(xx); if (!rr2) return;
    rr2.format = JSON.parse(JSON.stringify(xx.format||{})); rr2.updated = today(); rr2.verified = false;
    if (xx.methodNotes && (rr2.notes||"").indexOf(xx.methodNotes) < 0) rr2.notes = (rr2.notes ? rr2.notes + "\n" : "") + "Из заявки " + (xx.student||"") + ": " + xx.methodNotes;
    var ok7 = save(); render(); toast(ok7 ? "Справочник обновлён по заявке" : "Не сохранено: браузер не разрешает хранение"); return;
  }
  if (act === "open"){ openId = id; return render(); }
  if (act === "filter"){ var nf = el.getAttribute("data-k"); if (nf === "all" && filter === "all") query = ""; filter = nf; if (nf === "all") query = ""; return render(); }
  if (act === "copy-contact"){ var x = item(id); if (x) copyText(x.contact); return; }
  if (act === "deliver-result") return StudResults.deliver(item(id));
  if (act === "doc-open") return openDocBuilder(id);
  if (act === "px-save"){ readProviderForm(); saved("Сохранено"); return; }
  if (act === "pv-toggle"){
    readProviderForm();
    var pc = D.settings.providers[id] = D.settings.providers[id] || {}; pc.on = !pc.on;
    var okP = save(); render();
    if (!okP) toast("Не сохранено: браузер не разрешает хранение");
    return;
  }
  if (act === "pv-test"){
    var b2 = el; b2.textContent = "…";
    readProviderForm();
    if (!save()) toast("Настройки не сохранены: браузер не разрешает хранение");
    askAI(id, "Ты помощник.", "Ответь одним словом: работает",{section:"connection",stage:"check",attempt:1}).then(function(r){ toast(providerName(id) + " отвечает: " + r.text.slice(0,40)); })
      .catch(function(e){ toast(aiErrorText(e)); }).then(function(){ b2.textContent = "проверить"; });
    return;
  }
  if (act === "copy-prompt"){ var x2 = item(id); if (x2) copyText(buildPrompt(x2)); return; }
  if (act === "show-prompt"){
    var x3 = item(id); if (!x3) return;
    openModal('<button type="button" class="close" data-x="1">✕</button><h3>Заготовка запроса</h3>' +
      '<div class="fld" style="margin-top:12px"><textarea readonly style="min-height:320px">' + esc(buildPrompt(x3)) + '</textarea></div>' +
      '<div class="rowbtns"><button type="button" class="btn" data-copy="1">Скопировать</button></div>')
      .addEventListener("click", function(e2){ if (e2.target.closest("[data-copy]")) copyText(buildPrompt(x3)); });
    return;
  }
  if (act === "save-note"){ var x4 = item(id); if (!x4) return; x4.note = document.getElementById("note").value; saved("Заметка сохранена"); return; }
  if (act === "delete"){
    if (!confirm("Удалить заявку? Восстановить будет нельзя.")) return;
    D.items = D.items.filter(function(y){ return y.id !== id }); recountRefs(); var okd = save(); openId = null; render(); toast(okd ? "Заявка удалена" : "Не сохранено: браузер не разрешает хранение"); return;
  }
  if (act === "paste"){
    var wrap = openModal('<button type="button" class="close" data-x="1">✕</button><h3>Вставить заявку из текста</h3>' +
      '<div class="mut">Скопируйте сообщение студента целиком и вставьте сюда.</div>' +
      '<div class="fld" style="margin-top:12px"><textarea id="pasteBox" placeholder="ЗАЯВКА НА ЧЕРНОВИК&#10;Тема: ...&#10;Вид работы: ..."></textarea></div>' +
      '<div class="rowbtns"><button type="button" class="btn" data-go="1" style="flex:1">Разобрать</button>' +
      '<button type="button" class="btn ghost" data-x="1" style="flex:1">Отмена</button></div>');
    wrap.addEventListener("click", function(e2){
      if (!e2.target.closest("[data-go]")) return;
      var text = wrap.querySelector("#pasteBox").value;
      var link = text.match(/#z=([A-Za-z0-9\-_]+)/), rec = null;

      if (!rec) rec = parseText(text);
      if (!rec) return toast("Не получилось разобрать — проверьте, что текст полный");
      var same = item(rec.id) || findTwin(rec);

            ".\n\nОК — обновить её (статус, заметка и документ сохранятся).\nОтмена — добавить как новую.")){
          rec.id = uid("rq"); D.items.unshift(rec); refIntake(rec); var ok1 = save(); wrap.remove(); openId = rec.id; render(); toast(ok1 ? "Добавлена как новая" : "Не сохранено: браузер не разрешает хранение");
          return;
        }
        mergeInto(same, rec); same.refId = null; refIntake(same); var ok2 = save(); wrap.remove(); openId = same.id; render(); toast(ok2 ? "Заявка обновлена" : "Не сохранено: браузер не разрешает хранение");
        return;
      }
      D.items.unshift(rec); refIntake(rec); var ok3 = save(); wrap.remove(); openId = rec.id; render(); toast(ok3 ? "Заявка добавлена" : "Не сохранено: браузер не разрешает хранение");
    });
    return;
  }
  if (act === "export"){
    var safe = JSON.parse(JSON.stringify(D));
    if (safe.settings) delete safe.settings.proxyToken;
    var blob = new Blob([JSON.stringify(safe, null, 1)], { type:"application/json" });
    var urlB = URL.createObjectURL(blob);
    var a = document.createElement("a"); a.href = urlB; a.download = "reestr-" + today() + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(urlB) }, 4000);
    toast("Копия сохранена"); return;
  }
  if (act === "import"){
    var inp = document.createElement("input"); inp.type = "file"; inp.accept = "application/json,.json";
    inp.onchange = function(){
      var file = inp.files[0]; if (!file) return;
      var r = new FileReader();
      r.onload = function(){
        try{
          var o = JSON.parse(r.result);
          var bad = checkBackup(o);
          if (bad){ toast(bad); return; }
          var keepToken = (D.settings||{}).proxyToken || "";
          D = o; if (!D.settings) D.settings = {};
          D.settings.proxyToken = keepToken;

          okI = save() && okI; render();
          toast(okI ? "Данные загружены" : "Данные показаны, но не сохранены: браузер не разрешает хранение");
        }
        catch(e){ toast("Файл повреждён или это не копия реестра"); }
      };
      r.readAsText(file);
    };
    inp.click(); return;
  }
});

applyTheme();
