<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4E7A9E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Реестр">
<title>Реестр заявок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#22303F; --mut:#6B7F92; --line:#DCE6EE; --ok:#4B7F62; --stop:#A85147;
  --ground:#F4F7FA; --card:rgba(255,255,255,.92);
  --navy:#28425C; --head:#4E7A9E; --accent:#2F6091; --warm:#B08347;
  --body-bg:radial-gradient(circle at 10% 8%,rgba(120,160,200,.20),transparent 30%),radial-gradient(circle at 88% 24%,rgba(176,131,71,.14),transparent 30%),linear-gradient(145deg,#F7FAFD 0%,#F1F5F9 52%,#F8F6F2 100%);
  --phone-bg:linear-gradient(180deg,#F5F8FB 0%,#F9FBFD 48%,#F4F7FA 100%);
  --appbar:radial-gradient(circle at 86% -40%,rgba(255,255,255,.30),transparent 42%),linear-gradient(120deg,#2E5A85 0%,#4E7A9E 55%,#6F98BB 100%);
  --appbar-sh:rgba(40,66,92,.22);
  --greet:linear-gradient(125deg,#2E5A85 0%,#4E7A9E 52%,#7FA6C6 100%);
  --greet-morning:linear-gradient(125deg,#B9784A 0%,#D3A06E 50%,#E6C48F 100%);
  --greet-day:linear-gradient(125deg,#2E5A85 0%,#4E7A9E 52%,#7FA6C6 100%);
  --greet-evening:linear-gradient(125deg,#33465F 0%,#4E6483 50%,#7A8AA3 100%);
  --greet-night:linear-gradient(130deg,#1B2637 0%,#2C3D58 55%,#465A78 100%);
  --greet-sh:rgba(40,66,92,.24);
  --card-border:rgba(200,214,226,.9); --card-sh:rgba(40,66,92,.07);
  --lab:#6B7F92; --ic-bg:linear-gradient(145deg,#E8F0F7,#F3F7FA); --ic-fg:#2F6091; --ic-ring:rgba(190,208,224,.7);
  --bar:linear-gradient(90deg,#2F6091,#6F98BB); --bar-bg:#E4ECF3;
  --chip-bg:linear-gradient(110deg,#E8F0F7,#EEF4F9); --chip-fg:#2F6091;
  --btn:linear-gradient(110deg,#2F6091,#4E7A9E); --btn-sh:rgba(47,96,145,.22);
  --fab:linear-gradient(115deg,#B08347,#D2A46A); --fab-sh:rgba(176,131,71,.36);
  --tab-on:#2F6091; --tab-bg:rgba(255,255,255,.94); --tab-line:#DCE6EE;
  --sheet-bg:rgba(34,48,63,.45); --toast:linear-gradient(110deg,#28425C,#3D5E80);
  --days-bg:#E8F0F7; --days-fg:#2F6091; --spine:linear-gradient(#C8D6E2,#E4ECF3); --dot-on:#4E7A9E;
  --cal-today:linear-gradient(145deg,#2F6091,#6F98BB);
  --warm-bg:#F6EEE1; --warm-fg:#8F6A3A; --hot-bg:#F6E7E4; --hot-fg:#A85147;
}
body[data-theme="green"]{
  --navy:#2A4A42; --head:#3F7A6A; --accent:#2F6B5E; --warm:#C48A3F;
  --body-bg:radial-gradient(circle at 10% 8%,rgba(110,170,150,.22),transparent 30%),radial-gradient(circle at 88% 24%,rgba(196,138,63,.14),transparent 30%),linear-gradient(145deg,#F6FAF8 0%,#F0F5F3 52%,#F9F7F2 100%);
  --phone-bg:linear-gradient(180deg,#F4F9F7 0%,#F9FCFA 48%,#F3F7F5 100%);
  --appbar:radial-gradient(circle at 86% -40%,rgba(255,255,255,.30),transparent 42%),linear-gradient(120deg,#25594C 0%,#3F7A6A 55%,#6AA08F 100%);
  --appbar-sh:rgba(42,74,66,.22);
  --greet:linear-gradient(125deg,#25594C 0%,#3F7A6A 52%,#7DB3A2 100%);
  --greet-morning:linear-gradient(125deg,#B57A3E 0%,#D3A360 50%,#E8C98B 100%);
  --greet-day:linear-gradient(125deg,#25594C 0%,#3F7A6A 52%,#7DB3A2 100%);
  --greet-evening:linear-gradient(125deg,#2F4D47 0%,#4C6D66 50%,#7A948E 100%);
  --greet-night:linear-gradient(130deg,#182A26 0%,#264038 55%,#3F5C52 100%);
  --greet-sh:rgba(42,74,66,.24);
  --card-border:rgba(200,222,214,.9); --card-sh:rgba(42,74,66,.07);
  --lab:#6B8A80; --ic-bg:linear-gradient(145deg,#E6F2ED,#F2F8F5); --ic-fg:#2F6B5E; --ic-ring:rgba(190,220,208,.7);
  --bar:linear-gradient(90deg,#2F6B5E,#6AA08F); --bar-bg:#E2EEE9;
  --chip-bg:linear-gradient(110deg,#E6F2ED,#EEF6F2); --chip-fg:#2F6B5E;
  --btn:linear-gradient(110deg,#2F6B5E,#3F7A6A); --btn-sh:rgba(47,107,94,.22);
  --fab:linear-gradient(115deg,#C48A3F,#DFAE6A); --fab-sh:rgba(196,138,63,.36);
  --tab-on:#2F6B5E; --tab-line:#D8E6E0; --sheet-bg:rgba(30,50,44,.45); --toast:linear-gradient(110deg,#2A4A42,#3F6B5E);
  --days-bg:#E6F2ED; --days-fg:#2F6B5E; --spine:linear-gradient(#C6DCD3,#E2EEE9); --dot-on:#3F7A6A;
  --cal-today:linear-gradient(145deg,#2F6B5E,#6AA08F);
}
body[data-theme="lilac"]{
  --ink:#352D42; --mut:#7A6D86; --line:#E9DDEC; --navy:#503B68; --head:#8164B5; --accent:#7652A8; --warm:#D47794; --stop:#B34D67;
  --ground:#FBF7FC;
  --body-bg:radial-gradient(circle at 10% 8%,rgba(236,183,211,.28),transparent 29%),radial-gradient(circle at 88% 24%,rgba(180,151,222,.25),transparent 31%),linear-gradient(145deg,#fffafd 0%,#f7f4ff 52%,#fff7f2 100%);
  --phone-bg:linear-gradient(180deg,#F9F4FD 0%,#FFF9FC 48%,#F8F5FF 100%);
  --appbar:radial-gradient(circle at 86% -40%,rgba(255,255,255,.36),transparent 42%),linear-gradient(120deg,#7052A5 0%,#A66EB0 53%,#D77F9D 100%);
  --appbar-sh:rgba(92,62,126,.18);
  --greet:linear-gradient(125deg,#6E50A2 0%,#A965AD 52%,#DC839E 100%);
  --greet-morning:linear-gradient(125deg,#D7839E 0%,#EDAA9D 53%,#F2C38F 100%);
  --greet-day:linear-gradient(125deg,#7A62B5 0%,#A978C3 50%,#E58FAE 100%);
  --greet-evening:linear-gradient(125deg,#68488D 0%,#9B5E9F 50%,#CE718F 100%);
  --greet-night:linear-gradient(130deg,#302A5A 0%,#533C78 55%,#765083 100%);
  --greet-sh:rgba(99,63,132,.22);
  --card-border:rgba(219,202,227,.82); --card-sh:rgba(81,55,105,.075);
  --lab:#886E96; --ic-bg:linear-gradient(145deg,#F4E9FA,#FFEFF3); --ic-fg:#704E9A; --ic-ring:rgba(211,187,225,.55);
  --bar:linear-gradient(90deg,#7652A8,#E18DAA); --bar-bg:#EEE4F2;
  --chip-bg:linear-gradient(110deg,#F0E6F8,#FCEAF2); --chip-fg:#704E9A;
  --btn:linear-gradient(110deg,#7452AA,#A565B1); --btn-sh:rgba(103,70,145,.2);
  --fab:linear-gradient(115deg,#D16991,#E99A9D); --fab-sh:rgba(190,91,126,.34);
  --tab-on:#7652A8; --tab-bg:rgba(255,251,254,.93); --tab-line:#E8DCEB;
  --sheet-bg:rgba(48,34,60,.48); --toast:linear-gradient(110deg,#513A68,#74518B);
  --days-bg:#F0E6F8; --days-fg:#704E9A; --spine:linear-gradient(#D5C2E0,#EFD4DD); --dot-on:#9A72BE;
  --cal-today:linear-gradient(145deg,#7252A4,#C578A1);
  --warm-bg:#FFF0E6; --warm-fg:#A8663A; --hot-bg:#FFE9EE; --hot-fg:#B34D67;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden}
html,body{max-width:100%}
body{margin:0;color:var(--ink);font-family:'Golos Text',system-ui,-apple-system,sans-serif;line-height:1.45;overflow-x:hidden;width:100%;background:var(--body-bg)}
button,input,select,textarea{font:inherit;color:inherit}
.num,.big,.stat b,.tl-time{font-family:'IBM Plex Mono',monospace}

.phone{width:100%;max-width:520px;min-height:100vh;margin:0 auto;position:relative;display:flex;flex-direction:column;background:var(--phone-bg)}
@media (min-width:600px){.phone{margin:22px auto;min-height:calc(100vh - 44px);border:1px solid var(--card-border);border-radius:34px;box-shadow:0 28px 70px var(--greet-sh);overflow:hidden}}

.appbar{position:sticky;top:0;z-index:5;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 18px 16px;display:flex;align-items:flex-end;justify-content:space-between;background:var(--appbar);box-shadow:0 10px 30px var(--appbar-sh)}
.appbar:after{content:'✦';position:absolute;right:21%;top:14px;color:rgba(255,255,255,.5);font-size:11px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:28px;height:28px;flex:0 0 28px;display:block;filter:drop-shadow(0 3px 7px rgba(0,0,0,.2))}
.appbar h2{font-family:'Spectral',serif;font-size:20px;margin:0;font-weight:600;letter-spacing:.01em}
.appbar .sub,.appbar .saved{font-size:11px;color:rgba(255,255,255,.84);margin-top:2px}
.appbar .saved{font-size:10px;text-align:right}

.screen{flex:1;padding:18px 16px 150px;overflow-x:hidden}

.greeting{position:relative;overflow:hidden;margin:0 0 14px;padding:18px 18px 17px;border-radius:22px;color:#fff;background:var(--greet);box-shadow:0 14px 32px var(--greet-sh)}
.greeting:before{content:'✦';position:absolute;right:19px;top:12px;font-size:28px;color:rgba(255,255,255,.2);transform:rotate(12deg)}
.greeting:after{content:'✧';position:absolute;right:58px;bottom:12px;font-size:17px;color:rgba(255,255,255,.26)}
.greeting .hello{font-family:'Spectral',Georgia,serif;font-size:23px;font-weight:600;line-height:1.2;padding-right:48px}
.greeting .moment{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:12px;color:rgba(255,255,255,.84)}
.greeting .moment i{display:block;width:6px;height:6px;border-radius:50%;background:#FFE3C2;box-shadow:0 0 0 4px rgba(255,227,194,.15)}
.greeting.morning{background:var(--greet-morning)}
.greeting.morning:before{content:'☀';color:rgba(255,248,210,.34)}
.greeting.day{background:var(--greet-day)}
.greeting.evening{background:var(--greet-evening)}
.greeting.evening:before{content:'◐';color:rgba(255,224,210,.3)}
.greeting.night{background:var(--greet-night)}
.greeting.night:before{content:'☾';color:rgba(236,219,255,.32)}
.greeting.night:after{content:'✦  ·  ✧';letter-spacing:7px;color:rgba(255,255,255,.35)}

.card{background:var(--card);border:1px solid var(--card-border);border-radius:20px;padding:14px;margin-bottom:12px;max-width:100%;box-shadow:0 10px 26px var(--card-sh),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(10px)}
.card.now{border-color:var(--head);box-shadow:0 12px 30px var(--card-sh),0 0 0 3px var(--days-bg)}
.lab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--lab);font-weight:600;margin-bottom:8px}
.mut{color:var(--mut);font-size:12px;overflow-wrap:anywhere}
.title{font-family:'Spectral',serif;font-size:18px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.big{font-size:27px;font-weight:500;letter-spacing:-.02em}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.days{flex:0 0 auto;text-align:center;min-width:58px;padding:6px 8px;border-radius:14px;background:var(--days-bg);color:var(--days-fg)}
.days b{display:block;font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:500;line-height:1}
.days span{font-size:10px;letter-spacing:.06em}
.days.warm{background:var(--warm-bg);color:var(--warm-fg)}
.days.hot{background:var(--hot-bg);color:var(--hot-fg)}
.days.late{background:var(--stop);color:#fff}

.dayline{position:relative;padding-left:22px}
.spine{position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--spine)}
.tl{position:relative;padding:0 0 14px}
.tl:last-child{padding-bottom:2px}
.tl-dot{position:absolute;left:-21px;top:4px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.tl.next .tl-dot{background:var(--dot-on);border-color:var(--dot-on);box-shadow:0 0 0 4px var(--days-bg)}
.tl.late .tl-dot{background:var(--stop);border-color:var(--stop)}
.tl-time{font-size:11px;color:var(--mut)}
.tl-what{font-size:14px;font-weight:500;overflow-wrap:anywhere}
.tl-sub{font-size:11px;color:var(--mut)}

.stat{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.stat:last-child{border:0;padding-bottom:0}
.stat b{font-weight:500;text-align:right;overflow-wrap:anywhere}
.item{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);max-width:100%}
.item:last-child{border-bottom:0}
.item.tapline{cursor:pointer}
.item.tapline:active{background:var(--ground)}
.ic{width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;color:var(--ic-fg);background:var(--ic-bg);box-shadow:inset 0 0 0 1px var(--ic-ring)}
.item .txt{flex:1;min-width:0}
.item .txt b{display:block;font-weight:500;font-size:14px;overflow-wrap:anywhere}
.item .txt small{color:var(--mut);font-size:11px;overflow-wrap:anywhere}
.bar{height:7px;border-radius:99px;background:var(--bar-bg);overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--bar)}

.pill{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:99px;white-space:nowrap;flex:0 0 auto}
.p-gray{background:var(--bar-bg);color:var(--mut)}
.p-och{background:var(--warm-bg);color:var(--warm-fg)}
.p-warn{background:var(--hot-bg);color:var(--hot-fg)}
.p-ok{background:#E7F1EA;color:#4B7F62}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:8px 13px;border:none;border-radius:99px;background:var(--chip-bg);font-size:12.5px;color:var(--chip-fg);font-weight:600;cursor:pointer}
.chip:active{filter:brightness(.96)}
.chip.ok{background:#E7F1EA;color:#4B7F62}
.chip.warn{background:var(--warm-bg);color:var(--warm-fg)}
.switch{display:flex;background:var(--bar-bg);border-radius:12px;padding:3px;margin-bottom:12px}
.switch button{flex:1;border:0;background:transparent;padding:9px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500;color:var(--mut)}
.switch button[aria-selected="true"]{background:#fff;color:var(--accent);box-shadow:0 4px 12px var(--card-sh)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:rgba(255,255,255,.8);border-radius:99px;padding:7px 12px;cursor:pointer;font-size:13px;color:var(--ink)}
.pick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font-family:'Spectral',serif;font-size:17px;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dw{text-align:center;font-size:10px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;padding:2px 0 4px}
.cal .d{aspect-ratio:1;border:1px solid var(--line);border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;cursor:pointer;background:rgba(255,255,255,.7);position:relative}
.cal .d.out{visibility:hidden}
.cal .d.today{background:var(--cal-today);border-color:transparent;color:#fff;font-weight:600}
.cal .d.sel{outline:2px solid var(--accent);outline-offset:-2px}
.cal .d .dots{display:flex;gap:2px;height:5px}
.cal .d .dots i{width:5px;height:5px;border-radius:50%;background:var(--dot-on)}
.cal .d .dots i.tk{background:var(--warm)}
.cal .d .dots i.late{background:var(--stop)}
.cal .d .dots i.ev{background:var(--navy)}
.cal-legend i.ev{background:var(--navy)}
.cal .d.today .dots i{background:#fff}
.cal-legend{display:flex;gap:12px;font-size:11px;color:var(--mut);margin-top:10px}
.cal-legend i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--dot-on);margin-right:4px;vertical-align:middle}
.cal-legend i.tk{background:var(--warm)}
.cal-legend i.late{background:var(--stop)}
.dategroup{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--lab);font-weight:600;margin:12px 0 4px}
.dategroup:first-child{margin-top:0}

.btn,button.b{display:block;width:100%;border:0;border-radius:14px;padding:12px;font-size:14px;font-weight:500;cursor:pointer;color:#fff;background:var(--btn);box-shadow:0 8px 18px var(--btn-sh);transition:transform .18s ease}
.btn:active,button.b:active{transform:scale(.985)}
.btn.ghost,.b-alt,.b-quiet{background:rgba(255,255,255,.75);border:1px solid var(--line);color:var(--accent);box-shadow:none}
.b-quiet{color:var(--mut)}
button.b{width:auto;display:inline-block;padding:11px 16px}
.b-sm{padding:8px 12px;font-size:13px}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.rowbtns button.b{flex:1 1 auto}
.mini{border:1px solid var(--line);background:#fff;color:var(--accent);border-radius:8px;padding:5px 9px;font-size:11px;cursor:pointer;white-space:nowrap}
.del{border:0;background:transparent;color:var(--stop);font-size:12px;cursor:pointer;flex:0 0 auto}
.tick{width:26px;height:26px;flex:0 0 26px;border:1.5px solid var(--line);background:#fff;border-radius:50%;cursor:pointer;color:#fff;font-size:14px;line-height:1;padding:0}
.tick.on{background:var(--ok);border-color:var(--ok)}
.empty{color:var(--mut);font-size:13px;padding:8px 0}

.fld,.field{margin-bottom:10px}
.fld label,.field label{display:block;font-size:11px;color:var(--mut);margin-bottom:4px;font-weight:500}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;font-size:16px;background:rgba(255,255,255,.9);color:var(--ink)}
textarea{resize:vertical;min-height:120px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:3px solid var(--days-bg);border-color:var(--head)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.fgrid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 8px}
@media (max-width:420px){.fgrid4{grid-template-columns:repeat(2,1fr)}}
.hint,.small{display:block;font-size:11px;color:var(--mut);margin-top:6px;line-height:1.35}
.infobox{background:var(--days-bg);border:1px solid var(--line);color:var(--accent);border-radius:12px;padding:9px 12px;font-size:12px;margin:10px 0}
.warnbar,.warnbox{background:var(--hot-bg);border:1px solid #E4C3BD;color:var(--stop);border-radius:12px;padding:9px 12px;font-size:12.5px;margin-bottom:12px}
.warnbar ul{margin:6px 0 0;padding-left:18px}
.warnbar li{margin-bottom:3px}
.okbar,.okbox{background:#E7F1EA;border:1px solid #C9DED0;color:#4B7F62;border-radius:12px;padding:9px 12px;font-size:12.5px}

.fab{position:fixed;right:max(16px,calc(50% - 230px));bottom:calc(80px + env(safe-area-inset-bottom));min-height:56px;padding:0 18px;border:0;border-radius:99px;background:var(--fab);color:#fff;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 10px 26px var(--fab-sh);z-index:5}
.fab i{font-style:normal;font-size:19px;line-height:1}
.fab:active{transform:scale(.95)}
.fab[hidden]{display:none}

.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;height:calc(66px + env(safe-area-inset-bottom));padding:0 4px env(safe-area-inset-bottom);display:flex;align-items:center;z-index:6;background:var(--tab-bg,rgba(255,255,255,.94));border-top:1px solid var(--tab-line);box-shadow:0 -10px 28px var(--card-sh);backdrop-filter:blur(18px)}
@media (min-width:600px){.tabs{bottom:22px;border-radius:0 0 33px 33px}}
.tabs button{flex:1;border:0;background:transparent;cursor:pointer;padding:5px 0;font-size:10.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button i{font-style:normal;font-size:18px;opacity:.5}
.tabs button[aria-selected="true"]{color:var(--tab-on);font-weight:600;transform:translateY(-1px)}
.tabs button[aria-selected="true"] i{opacity:1}

.sheet{position:fixed;inset:0;background:var(--sheet-bg);backdrop-filter:blur(4px);display:flex;align-items:flex-end;z-index:20}
.sheet-in{background:#fff;width:100%;max-width:520px;margin:0 auto;border-radius:26px 26px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;box-shadow:0 -18px 50px var(--greet-sh);animation:up .26s ease}

@media (prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}

<script>

"use strict";

var STATUS = { new:"Новая", work:"В работе", sent:"Черновик отправлен", done:"Готово", off:"Отменена" };
var PILL = { new:"p-och", work:"p-gray", sent:"p-ok", done:"p-ok", off:"p-gray" };
var ORDER = ["new","work","sent","done","off"];

var KEY = "reestr_zayavok_v1";
var D = null, tab = "list", openId = null, openRefId = null, filter = "all", query = "";

/* ---------- ХРАНЕНИЕ ---------- */
function load(){
  var raw = null;
  try{ raw = localStorage.getItem(KEY); }catch(e){}
  if (raw){ try{ D = JSON.parse(raw); }catch(e){ D = null; } }
  if (!D) D = { items:[], theme:"light" };
  if (!D.items) D.items = [];
  if (!D.refs){ D.refs = seedRefs(); }
  if (!D.settings) D.settings = {};
  if (D.settings.dsKey === undefined) D.settings.dsKey = "";
  if (!D.settings.dsModel) D.settings.dsModel = "deepseek-chat";
  D.refs.forEach(function(r){ if (!r.id) r.id = uid("ref"); if (!r.format) r.format = {}; });
  if (D.theme === "dark") document.body.classList.add("dark");
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(D)); }catch(e){} }

/* ---------- ОБЩЕЕ ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c] }); }
function today(){ var d=new Date(); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); }
function ruDate(iso){
  if (!iso) return "";
  var M=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  var d=new Date(iso), now=new Date();
  if (isNaN(d)) return iso;
  return d.getDate()+" "+M[d.getMonth()]+(d.getFullYear()!==now.getFullYear()?" "+d.getFullYear():"");
}
function uid(p){ return p + Math.random().toString(36).slice(2,8) }
function item(id){ return D.items.filter(function(x){ return x.id===id })[0]; }
var toastT;
function toast(t){
  var el=document.getElementById("toast");
  el.textContent=t; el.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(function(){ el.classList.remove("on") },2600);
}
function copyText(msg){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(msg).then(function(){ toast("Скопировано") }, function(){ fb(msg) });
  } else fb(msg);
  function fb(m){
    var ta=document.createElement("textarea");
    ta.value=m; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{ document.execCommand("copy"); toast("Скопировано"); }catch(e){ toast("Не удалось скопировать"); }
    document.body.removeChild(ta);
  }
}

/* ---------- СПРАВОЧНИК ВУЗОВ ---------- */
var REF_STYLES = { brackets:"квадратные скобки [12]", footnotes:"постраничные сноски", unknown:"не уточнён" };
function seedRefs(){
  var t = today();
  function mk(univ, faculty, kafedra, fmt, refStyle, notes, verified){
    return { id:uid("ref"), univ:univ, faculty:faculty, kafedra:kafedra, format:fmt, refStyle:refStyle,
      notes:notes, verified:!!verified, source:"записи проекта", added:t, updated:t, requests:0 };
  }
  return [
    mk("РАНХиГС", "Институт отраслевого менеджмента, факультет рыночных технологий", "",
      { mTop:20, mRight:15, mBottom:20, mLeft:30, font:"Times New Roman", size:14, spacing:1.5, indent:1.25 }, "brackets",
      "Курсовая: не менее 20 стр. на автора, оригинальность от 70%. Интервал 1,5 в тексте, одинарный в сносках и заголовках. Титульный лист и содержание — по формам приложений 2 и 3 Положения о курсовой работе.", false),
    mk("РАНХиГС", "Волгоградский институт управления, факультет ГМУ", "",
      { mTop:20, mRight:15, mBottom:20, mLeft:20, font:"Times New Roman", size:14, spacing:1.5, indent:1.25 }, "unknown",
      "Левое поле 20 мм — по записям проекта, ПЕРЕПРОВЕРИТЬ по методичке: обычно 30. Титульный лист по форме Приложения 1.", false),
    mk("Московский международный университет", "", "Кафедра экономики и управления",
      { mTop:20, mRight:15, mBottom:20, mLeft:30, font:"Times New Roman", size:14, spacing:1.5, indent:1.25 }, "footnotes",
      "Ссылки — настоящие постраничные сноски (автор, работа, издательство, год, страница), не квадратные скобки. Дисциплина из разобранной методички: «Теория и практика рекламы».", false),
    mk("Столичный бизнес колледж", "", "",
      { mTop:20, mRight:10, mBottom:20, mLeft:30, font:"Times New Roman", size:14, spacing:1.5, indent:1.25 }, "brackets",
      "ВКР: собственный стандарт колледжа. Свой титульный лист, свой порядок группировки источников, приложения без номеров страниц. Правое поле 10 мм.", false)
  ];
}
function normKey(s){ return String(s||"").toLowerCase().replace(/[«»"']/g,"").replace(/\s+/g," ").trim(); }
function refKey(r){ return normKey(r.univ) + "|" + normKey(r.faculty) + "|" + normKey(r.kafedra); }
function refById(id){ return (D.refs||[]).filter(function(r){ return r.id===id })[0]; }
function findRef(x){
  if (!x.univ) return null;
  var key = refKey(x);
  var exact = D.refs.filter(function(r){ return refKey(r) === key })[0];
  if (exact) return exact;
  /* тот же вуз, факультет и кафедра не указаны ни там, ни там — считаем совпадением по вузу */
  var byUniv = D.refs.filter(function(r){ return normKey(r.univ) === normKey(x.univ) });
  if (byUniv.length === 1 && !x.faculty && !x.kafedra) return byUniv[0];
  return null;
}
var FMT_FIELDS = [["mLeft","лево, мм"],["mRight","право, мм"],["mTop","верх, мм"],["mBottom","низ, мм"],["font","шрифт"],["size","кегль"],["spacing","интервал"],["indent","отступ, см"]];
function fmtDiff(a, b){
  var out = [];
  FMT_FIELDS.forEach(function(f){
    var va = a && a[f[0]], vb = b && b[f[0]];
    if (va == null || vb == null || va === "" || vb === "") return;
    if (String(va).trim().toLowerCase() !== String(vb).trim().toLowerCase()) out.push({ k:f[0], label:f[1], ref:vb, req:va });
  });
  return out;
}
function fmtLine(f){
  if (!f || f.mLeft == null) return "не задано";
  return "поля " + f.mLeft + "/" + f.mRight + "/" + f.mTop + "/" + f.mBottom + " мм · " + (f.font||"") + " " + (f.size||"") + " · интервал " + (f.spacing||"") + " · отступ " + (f.indent||"") + " см";
}
/* заявка пришла — записываем вуз в справочник или сверяем с ним */
function refIntake(x){
  if (!x.univ) return;
  var r = findRef(x);
  if (!r){
    r = { id:uid("ref"), univ:x.univ, faculty:x.faculty||"", kafedra:x.kafedra||"",
      format:JSON.parse(JSON.stringify(x.format||{})), refStyle:"unknown",
      notes:(x.methodNotes ? "Из заявки: " + x.methodNotes : ""), verified:false,
      source:"заявка " + (x.student||"") , added:today(), updated:today(), requests:1 };
    D.refs.unshift(r);
    x.refId = r.id; x.refNew = true; return;
  }
  r.requests = (r.requests||0) + 1;
  x.refId = r.id; x.refNew = false;
}

/* ---------- ЗАГОТОВКА ЗАПРОСА ---------- */
function buildPrompt(x){
  var f = x.format || {};
  var refs = "";
  var L = [];
  L.push("Ты помогаешь студенту подготовить черновик учебной работы. Нужен связный текст, который студент дальше дорабатывает и проверяет сам.");
  L.push("");
  L.push("РАБОТА");
  if (x.workType) L.push("Вид работы: " + x.workType);
  if (x.topic) L.push("Тема: " + x.topic);
  if (x.discipline) L.push("Дисциплина: " + x.discipline);
  if (x.univ) L.push("Вуз: " + x.univ);
  if (x.faculty) L.push("Факультет: " + x.faculty);
  if (x.kafedra) L.push("Кафедра: " + x.kafedra);
  if (x.program) L.push("Направление подготовки: " + x.program);
  if (x.requirements) L.push("Требования: " + x.requirements);
  if (x.org){ L.push(""); L.push("ОРГАНИЗАЦИЯ ИЛИ ОБЪЕКТ ИССЛЕДОВАНИЯ"); L.push(x.org); }
  if (x.methodNotes){ L.push(""); L.push("ОСОБЕННОСТИ МЕТОДИЧКИ"); L.push(x.methodNotes); }
  L.push("");
  L.push("СТРУКТУРА");
  L.push("[вписать главы и параграфы из задания]");
  L.push("");
  L.push("КАК ПИСАТЬ");
  L.push("— Пиши цельным текстом, а не тезисами: каждый параграф — законченный связный фрагмент.");
  L.push("— Академический стиль, без канцелярита и без воды ради объёма.");
  L.push("— Абзацы 4–8 предложений, каждый с одной мыслью.");
  L.push("");
  L.push("ОБЯЗАТЕЛЬНЫЕ ОГРАНИЧЕНИЯ");
  L.push("— Не выдумывай источники. Приводи только те работы, в существовании которых уверен, и помечай каждую: [ПРОВЕРИТЬ ИСТОЧНИК]. Лучше пять реальных, чем двадцать выдуманных.");
  L.push("— Не выдумывай цифры и факты об организации. Где нужны реальные данные, ставь: [ДАННЫЕ СТУДЕНТА: что именно нужно].");
  L.push("— Не придумывай результаты опросов, интервью и расчётов.");
  L.push("— Где нужен собственный вывод студента, ставь: [СФОРМУЛИРОВАТЬ САМОСТОЯТЕЛЬНО].");
  L.push("");
  L.push("ЧТО ВЫДАТЬ");
  L.push("Только текст работы по разделам. Без вступлений и комментариев. Заголовки — точно как в структуре.");
  return L.join("\n");
}

/* ---------- ДОКУМЕНТ ПО ЗАЯВКЕ ---------- */
function defaultDoc(x){
  var big = /выпускн|вкр|диплом/i.test(x.workType || "");
  var list = [
    { id:"intro", name:"Введение", pages: 2 },
    { id:"ch1",   name:"Глава 1. " + (big ? "Теоретические основы" : "Теоретическая часть"), pages: big ? 12 : 6 },
    { id:"ch2",   name:"Глава 2. " + (big ? "Анализ" : "Практическая часть"), pages: big ? 14 : 6 },
    { id:"ch3",   name:"Глава 3. " + (big ? "Рекомендации" : "Результаты и предложения"), pages: big ? 10 : 4 },
    { id:"concl", name:"Заключение", pages: 2 },
    { id:"refs",  name:"Список использованных источников", pages: 1 }
  ];
  var st = {}; list.forEach(function(c){ st[c.id] = { text:"" }; });
  return { order:list, structure:st, updated:"" };
}
function docOf(x){ if (!x.doc) x.doc = defaultDoc(x); return x.doc; }
function docPages(x){ var n = 0; docOf(x).order.forEach(function(c){ n += ((x.doc.structure[c.id]||{}).text||"").length; }); return Math.round(n/1800*10)/10; }

function sectionPrompt(x, c){
  var doc = docOf(x);
  var sys = buildPrompt(x).replace("[вписать главы и параграфы из задания]",
    doc.order.map(function(q, i){ return (i+1) + ". " + q.name + (q.pages ? " — примерно " + q.pages + " стр." : ""); }).join("\n"));
  var user;
  if (c.id === "refs"){
    var seen = doc.order.filter(function(q){ return q.id !== "refs" && (doc.structure[q.id]||{}).text })
      .map(function(q){ return q.name + ":\n" + doc.structure[q.id].text.slice(0, 1500); }).join("\n\n");
    user = "Составь раздел «" + c.name + "» к работе. Включи только те источники, на которые опираются написанные разделы (фрагменты ниже). " +
      "Каждый источник — отдельной строкой с номером, в формате библиографического описания по ГОСТ, и с пометкой [ПРОВЕРИТЬ ИСТОЧНИК] в конце. " +
      "Не добавляй источники ради количества. Выдай только список.\n\n" + seen;
  } else {
    user = "Напиши раздел «" + c.name + "». Объём примерно " + (c.pages || 3) + " " + ruPages(c.pages || 3) +
      " (около " + ((c.pages || 3) * 1800) + " знаков). Выдай только текст этого раздела, без его заголовка и без вступлений. " +
      "Внутри раздела можно использовать подзаголовки параграфов (например, 1.1, 1.2), каждый на отдельной строке.";
  }
  return { system: sys, user: user };
}
function ruPages(n){ var a = n % 100, b = n % 10; if (a > 10 && a < 20) return "страниц"; if (b > 1 && b < 5) return "страницы"; if (b === 1) return "страница"; return "страниц"; }

function askDeepseek(system, user){
  var key = (D.settings.dsKey || "").trim();
  if (!key) return Promise.reject(new Error("NOKEY"));
  return fetch("https://api.deepseek.com/chat/completions", {
    method:"POST",
    headers:{ "Content-Type":"application/json", "Authorization":"Bearer " + key },
    body: JSON.stringify({
      model: D.settings.dsModel || "deepseek-chat",
      messages:[ { role:"system", content:system }, { role:"user", content:user } ],
      temperature: 0.7, max_tokens: 8000
    })
  }).then(function(r){
    if (r.status === 401) throw new Error("AUTH");
    if (r.status === 402) throw new Error("PAY");
    if (!r.ok) return r.text().then(function(t){ throw new Error("HTTP " + r.status + " " + t.slice(0,120)); });
    return r.json();
  }).then(function(j){
    var txt = j && j.choices && j.choices[0] && j.choices[0].message ? j.choices[0].message.content : "";
    if (!txt) throw new Error("EMPTY");
    var u = j.usage || {};
    return { text: txt.trim(), tokens: (u.prompt_tokens||0) + (u.completion_tokens||0) };
  });
}
function dsErrorText(e){
  var m = (e && e.message) || "";
  if (m === "NOKEY") return "Ключ не вписан: Ещё → Дипсик.";
  if (m === "AUTH") return "Дипсик не принял ключ — проверьте его в настройках.";
  if (m === "PAY") return "На счёте Дипсика закончились деньги.";
  if (m === "EMPTY") return "Дипсик вернул пустой ответ, попробуйте ещё раз.";
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Из браузера до Дипсика не достучаться (обращения с сайтов запрещены или нет сети). Запасной путь: «Скопировать запрос» и вкладка chat.deepseek.com.";
  return "Ошибка: " + m;
}

var genBusy = false;
function openDocBuilder(id){
  var x = item(id); if (!x) return;
  var doc = docOf(x);
  function sec(c, i){
    var t = (doc.structure[c.id]||{}).text || "";
    return '<div class="card" data-sec="' + c.id + '" style="padding:12px">' +
      '<div class="row" style="gap:6px;margin-bottom:6px">' +
        '<input type="text" class="secName" value="' + esc(c.name) + '" style="flex:1;padding:8px;font-size:14px;font-weight:500">' +
        '<input type="number" class="secPages" value="' + (c.pages||"") + '" min="0" style="width:64px;padding:8px;font-size:13px" title="страниц">' +
        '<button type="button" class="del" data-secdel="' + c.id + '" title="Убрать раздел">✕</button>' +
      '</div>' +
      '<textarea class="secText" style="min-height:' + (t ? 160 : 70) + 'px;font-size:14px" placeholder="Вставьте текст или нажмите «Написать»">' + esc(t) + '</textarea>' +
      '<div class="row" style="margin-top:6px"><span class="mut secStat">' + (t ? Math.round(t.length/1800*10)/10 + ' стр. · ' + t.length + ' знаков' : 'пусто') + '</span>' +
      '<div style="display:flex;gap:6px">' +
        '<button type="button" class="mini" data-seccopy="' + c.id + '">запрос</button>' +
        '<button type="button" class="mini" data-secgen="' + c.id + '">написать</button>' +
      '</div></div></div>';
  }
  var wrap = openModal(
    '<button type="button" class="close" data-x="1">✕</button>' +
    '<h3>Документ</h3><div class="mut" style="margin-bottom:10px">' + esc(x.topic||"") + '</div>' +
    '<div id="docStatus" class="infobox" style="margin:0 0 10px;display:none"></div>' +
    '<div id="docSecs">' + doc.order.map(sec).join("") + '</div>' +
    '<div class="chips" style="margin-top:4px">' +
      '<button type="button" class="chip" data-secadd="1">+ раздел</button>' +
      '<button type="button" class="chip warn" data-genall="1">Собрать черновик целиком</button>' +
    '</div>' +
    '<div class="rowbtns"><button type="button" class="btn" data-docx="1" style="flex:1">Скачать Word</button>' +
    '<button type="button" class="btn ghost" data-docsave="1" style="flex:1">Сохранить</button></div>' +
    '<div class="hint">Черновик пишется по разделам, по очереди — так надёжнее для длинных работ. Титульный лист и оформление берутся из заявки. Пометки [ДАННЫЕ СТУДЕНТА] и [ПРОВЕРИТЬ ИСТОЧНИК] останутся в тексте — их надо пройти перед отправкой.</div>'
  );
  function readBack(){
    var order = [], st = {};
    wrap.querySelectorAll("[data-sec]").forEach(function(el){
      var cid = el.getAttribute("data-sec");
      order.push({ id:cid, name:el.querySelector(".secName").value.trim() || "Раздел", pages: parseFloat(el.querySelector(".secPages").value) || 0 });
      st[cid] = { text: el.querySelector(".secText").value };
    });
    doc.order = order; doc.structure = st; doc.updated = today();
    save();
  }
  function setStatus(msg, kind){
    var el = wrap.querySelector("#docStatus"); if (!msg){ el.style.display = "none"; return; }
    el.style.display = "block"; el.className = kind === "err" ? "warnbar" : kind === "ok" ? "okbar" : "infobox"; el.style.margin = "0 0 10px"; el.textContent = msg;
  }
  function genOne(cid){
    readBack();
    var c = doc.order.filter(function(q){ return q.id === cid })[0]; if (!c) return Promise.resolve();
    var pr = sectionPrompt(x, c);
    var el = wrap.querySelector('[data-sec="' + cid + '"]');
    el.querySelector(".secStat").textContent = "пишу…";

function b64dec(s){
  s = s.replace(/-/g,"+").replace(/_/g,"/");
  while (s.length % 4) s += "=";
  var bin = atob(s), out = "";
  for (var i=0; i<bin.length; i++) out += "%" + ("0" + bin.charCodeAt(i).toString(16)).slice(-2);
  return decodeURIComponent(out);
}
function fromPayload(p){
  var f = p.fm || {};
  return {
    id: p.id || uid("rq"),
    added: today(),
    status: "new",
    topic: p.t || "", workType: p.k || "", discipline: p.d || "",
    univ: p.u || "", faculty: p.fc || "", kafedra: p.kf || "", city: p.ct || "",
    student: p.n || "", group: p.g || "", supervisor: p.s || "",
    program: p.pr || "", form: p.fo || "", course: p.co || "",
    deadline: p.dl || "", requirements: p.rq || "",
    org: p.org || "", methodNotes: p.mn || "", contact: p.cn || "",
    format: { mTop:f.mt, mRight:f.mr, mBottom:f.mb, mLeft:f.ml,
              font:f.fn, size:f.sz, spacing:f.sp, indent:f.ind },
    note: ""
  };
}
function intake(){
  var h = location.hash || "";
  var m = h.match(/#z=(.+)$/);
  if (!m) return null;
  try{
    var p = JSON.parse(b64dec(m[1]));
    if (!p || !p.t) throw new Error("bad");
    var rec = fromPayload(p);
    var exist = item(rec.id);
    if (exist){
      /* повторная отправка той же работы — обновляем, статус не трогаем */
      var keepStatus = exist.status, keepNote = exist.note;
      for (var k in rec) if (k !== "id") exist[k] = rec[k];
      exist.status = keepStatus; exist.note = keepNote;
      save(); return { rec:exist, updated:true };
    }
    D.items.unshift(rec); refIntake(rec); save();
    return { rec:rec, updated:false };
  }catch(e){ return { error:true }; }
  finally{
    history.replaceState(null, "", location.pathname + location.search);
  }
}

var LABELS = {
  "Тема":"topic", "Вид работы":"workType", "Дисциплина":"discipline",
  "Вуз":"univ", "Факультет":"faculty", "Кафедра":"kafedra",
  "Студент":"student", "Группа":"group", "Руководитель":"supervisor",
  "Направление":"program", "Форма обучения":"form", "Курс":"course",
  "Город":"city", "Срок":"deadline", "Требования":"requirements",
  "Организация":"org", "Особенности методички":"methodNotes",
  "Оформление":"formatText", "Связь":"contact"
};
function parseText(text){
  var rec = { id:uid("rq"), added:today(), status:"new", format:{}, note:"" };
  var found = 0;
  String(text).split(/\r?\n/).forEach(function(line){
    var m = line.match(/^\s*([^:]{3,40}):\s*(.+)$/);
    if (!m) return;
    var key = LABELS[m[1].trim()];
    if (!key) return;
    var val = m[2].trim();
    if (key === "deadline"){
      var iso = val.match(/(\d{4}-\d{2}-\d{2})/);
      rec.deadline = iso ? iso[1] : val;
    } else rec[key] = val;
    found++;
  });
  return found >= 2 ? rec : null;
}


var CRC_TABLE = (function(){
  var c, t = [];
  for (var n=0; n<256; n++){
    c = n;
    for (var k=0; k<8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes){
  var c = 0xFFFFFFFF;
  for (var i=0; i<bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function makeZip(files){
  var enc = new TextEncoder(), parts = [], central = [], offset = 0;
  files.forEach(function(f){
    var name = enc.encode(f.name), data = enc.encode(f.text);
    var crc = crc32(data), len = data.length;
    var lh = new Uint8Array(30 + name.length), dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true); dv.setUint16(6, 0x0800, true);
    dv.setUint16(8, 0, true); dv.setUint16(10, 0, true); dv.setUint16(12, 0, true);
    dv.setUint32(14, crc, true); dv.setUint32(18, len, true); dv.setUint32(22, len, true);
    dv.setUint16(26, name.length, true); dv.setUint16(28, 0, true);
    lh.set(name, 30);
    parts.push(lh, data);
    var ch = new Uint8Array(46 + name.length), cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true); cv.setUint16(6, 20, true); cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true); cv.setUint16(12, 0, true); cv.setUint16(14, 0, true);
    cv.setUint32(16, crc, true); cv.setUint32(20, len, true); cv.setUint32(24, len, true);
    cv.setUint16(28, name.length, true); cv.setUint16(30, 0, true); cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true); cv.setUint16(36, 0, true); cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    ch.set(name, 46);
    central.push(ch);
    offset += lh.length + len;
  });
  var cdSize = central.reduce(function(a,b){ return a + b.length }, 0);
  var end = new Uint8Array(22), ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true); ev.setUint16(6, 0, true);
  ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true); ev.setUint16(20, 0, true);
  return new Blob(parts.concat(central).concat([end]),
    { type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
}

function xesc(s){

}

function buildDocx(w, chapters){

  body += P("", {}) + P("", {}) + P("", {}) + P("", {});
  body += P(((f.city ? f.city + ", " : "") + year), { jc:"center" });
  body += pageBreak();

  /* Содержание */
  if (f.toc){
    body += P("СОДЕРЖАНИЕ", { jc:"center", b:true, after:240 });
    body += '<w:p><w:pPr><w:spacing w:line="'+line+'" w:lineRule="auto"/></w:pPr>'+
      '<w:r><w:fldChar w:fldCharType="begin" w:dirty="true"/></w:r>'+

document.addEventListener("input", function(ev){

document.addEventListener("change", function(ev){
  var el = ev.target;
  if (el.tagName === "SELECT" && el.getAttribute("data-act") === "status"){
    var x = item(el.getAttribute("data-id")); if (!x) return;
    x.status = el.value; save(); render(); toast("Статус: " + STATUS[x.status]);
  }
});
document.addEventListener("keydown", function(ev){
  if (ev.key === "Escape"){ var m = document.querySelector(".sheet"); if (m) m.remove(); }
});
document.addEventListener("click", function(ev){
  var el = ev.target.closest ? ev.target.closest("[data-act],[data-tab]") : null;
  if (!el || el.tagName === "SELECT") return;
  var tb = el.getAttribute("data-tab");
  if (tb){ tab = tb; openId = null; openRefId = null; return render(); }
  var act = el.getAttribute("data-act"), id = el.getAttribute("data-id");

  if (act === "back"){ openId = null; return render(); }
  if (act === "ref-back"){ openRefId = null; return render(); }
  if (act === "ref-open"){ tab = "refs"; openRefId = id; openId = null; return render(); }
  if (act === "open-from-ref"){ tab = "list"; openId = id; openRefId = null; return render(); }
  if (act === "ref-new") return newRef();
  if (act === "ref-save"){ var rr = refById(id); if (!rr) return; readRefForm(rr); save(); render(); toast("Сохранено"); return; }
  if (act === "ref-delete"){
    if (!confirm("Удалить карточку вуза? Заявки останутся.")) return;
    D.refs = D.refs.filter(function(r){ return r.id !== id }); D.items.forEach(function(x){ if (x.refId === id) delete x.refId; });
    save(); openRefId = null; render(); toast("Карточка удалена"); return;
  }
  if (act === "ref-accept"){
    var xx = item(id); if (!xx) return;
    var rr2 = xx.refId ? refById(xx.refId) : findRef(xx); if (!rr2) return;
    rr2.format = JSON.parse(JSON.stringify(xx.format||{})); rr2.updated = today(); rr2.verified = false;
    if (xx.methodNotes && (rr2.notes||"").indexOf(xx.methodNotes) < 0) rr2.notes = (rr2.notes ? rr2.notes + "\n" : "") + "Из заявки " + (xx.student||"") + ": " + xx.methodNotes;
    save(); render(); toast("Справочник обновлён по заявке"); return;
  }
  if (act === "open"){ openId = id; return render(); }
  if (act === "filter"){ filter = el.getAttribute("data-k"); return render(); }
  if (act === "copy-contact"){ var x = item(id); if (x) copyText(x.contact); return; }
  if (act === "doc-open") return openDocBuilder(id);
  if (act === "ds-save"){
    var k = document.getElementById("dsKey").value.trim(), md = document.getElementById("dsModel").value;
    D.settings.dsKey = k; D.settings.dsModel = md; save(); toast(k ? "Ключ сохранён" : "Ключ удалён"); return;
  }
  if (act === "ds-test"){
    var btn = el; btn.textContent = "проверяю…";
    askDeepseek("Ты помощник.", "Ответь одним словом: работает").then(function(r){ toast("Дипсик отвечает: " + r.text.slice(0,40)); })
      .catch(function(e){ toast(dsErrorText(e)); }).then(function(){ btn.textContent = "Проверить связь"; });
    return;
  }
  if (act === "copy-prompt"){ var x2 = item(id); if (x2) copyText(buildPrompt(x2)); return; }
  if (act === "show-prompt"){
    var x3 = item(id); if (!x3) return;
    openModal('<button type="button" class="close" data-x="1">✕</button><h3>Заготовка запроса</h3>' +
      '<div class="fld" style="margin-top:12px"><textarea readonly style="min-height:320px">' + esc(buildPrompt(x3)) + '</textarea></div>' +
      '<div class="rowbtns"><button type="button" class="btn" data-copy="1">Скопировать</button></div>')
      .addEventListener("click", function(e2){ if (e2.target.closest("[data-copy]")) copyText(buildPrompt(x3)); });
    return;
  }
  if (act === "save-note"){ var x4 = item(id); if (!x4) return; x4.note = document.getElementById("note").value; save(); toast("Заметка сохранена"); return; }
  if (act === "delete"){
    if (!confirm("Удалить заявку? Восстановить будет нельзя.")) return;
    D.items = D.items.filter(function(y){ return y.id !== id }); save(); openId = null; render(); toast("Заявка удалена"); return;
  }
  if (act === "paste"){
    var wrap = openModal('<button type="button" class="close" data-x="1">✕</button><h3>Вставить заявку из текста</h3>' +
      '<div class="mut">Скопируйте сообщение студента целиком и вставьте сюда.</div>' +
      '<div class="fld" style="margin-top:12px"><textarea id="pasteBox" placeholder="ЗАЯВКА НА ЧЕРНОВИК&#10;Тема: ...&#10;Вид работы: ..."></textarea></div>' +
      '<div class="rowbtns"><button type="button" class="btn" data-go="1" style="flex:1">Разобрать</button>' +
      '<button type="button" class="btn ghost" data-x="1" style="flex:1">Отмена</button></div>');
    wrap.addEventListener("click", function(e2){
      if (!e2.target.closest("[data-go]")) return;
      var text = wrap.querySelector("#pasteBox").value;
      var link = text.match(/#z=([A-Za-z0-9\-_]+)/), rec = null;
      if (link){ try{ rec = fromPayload(JSON.parse(b64dec(link[1]))); }catch(e){ rec = null; } }
      if (!rec) rec = parseText(text);
      if (!rec) return toast("Не получилось разобрать — проверьте, что текст полный");
      if (item(rec.id)) rec.id = uid("rq");
      D.items.unshift(rec); refIntake(rec); save(); wrap.remove(); openId = rec.id; render(); toast("Заявка добавлена");
    });
    return;
  }
  if (act === "export"){
    var blob = new Blob([JSON.stringify(D, null, 1)], { type:"application/json" });
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "reestr-" + today() + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a); toast("Копия сохранена"); return;
  }
  if (act === "import"){
    var inp = document.createElement("input"); inp.type = "file"; inp.accept = "application/json,.json";
    inp.onchange = function(){
      var file = inp.files[0]; if (!file) return;
      var r = new FileReader();
      r.onload = function(){
        try{ var o = JSON.parse(r.result); if (!o.items) throw new Error("bad"); D = o; save(); load(); D.items.forEach(function(x){ if (!x.refId) refIntake(x); }); save(); render(); toast("Данные загружены"); }
        catch(e){ toast("Этот файл не похож на копию реестра"); }
      };
      r.readAsText(file);
    };
    inp.click(); return;
  }
});

/* ---------- ЗАПУСК ---------- */
load();
document.body.setAttribute("data-theme", "blue");
var got = intake();
render();
if (got && got.error) toast("Ссылка повреждена — попробуйте «Из текста»");
else if (got && got.rec){ openId = got.rec.id; render(); toast(got.updated ? "Заявка обновлена" : "Новая заявка добавлена"); }

</script>
</body>
</html>
