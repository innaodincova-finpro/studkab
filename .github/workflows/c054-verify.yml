name: C-054 проверка после установки (без изменений)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studkab-production-state
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'innaodincova-finpro/studkab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Проверка сценария
        run: node --test tests/c054-verify.test.mjs
      - name: Проверка рабочей среды
        run: node scripts/c054-verify.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
