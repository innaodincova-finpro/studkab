name: Deploy studkab requests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - supabase/functions/studkab-requests/**
      - supabase/functions/_shared/external-word.mjs
      - .github/workflows/deploy-studkab-requests.yml
permissions:
  contents: read
concurrency:
  group: studkab-requests-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'innaodincova-finpro/studkab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.117.0
      - name: Check request and result delivery
        run: node --test tests/external-word.test.mjs tests/requests.test.mjs tests/request-attachments.test.mjs
      - name: Deploy existing function
        run: supabase functions deploy studkab-requests --project-ref dcpthwmuiodrjepifzsd --use-api --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
