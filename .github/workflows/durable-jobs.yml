name: Durable execution checks
on:
  pull_request:
    paths:
      - 'server/**'
      - 'tests/server/**'
      - '.github/workflows/durable-jobs.yml'
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/server/durable-jobs.test.mjs
